<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2A1A0E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="选题库">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>阿祖画室 · 选题库</title>
<style>
:root{
  --bg:#FFFFFF; --ink:#2A1A0E; --sub:#6A5745; --faint:#A2907E;
  --accent:#A9651A; --cta:#A0521A; --line:#E8DFD6; --card:#FBF8F4;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font:15px/1.75 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-text-size-adjust:100%}
a{color:inherit;text-decoration:none}
.hd{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.96);
  backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.hd .back{width:34px;height:34px;border:0;background:transparent;font-size:22px;
  color:var(--ink);display:none;align-items:center;justify-content:center;padding:0}
.hd .ttl{font-size:16px;font-weight:800;letter-spacing:.5px;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .cnt{font-size:12px;color:var(--faint)}
main{padding:14px 16px calc(90px + env(safe-area-inset-bottom));max-width:720px;margin:0 auto}
.hero{padding:8px 0 18px}
.hero h1{font-size:26px;line-height:1.35;margin:0 0 6px;font-weight:900;letter-spacing:-.5px}
.hero p{margin:0;color:var(--sub);font-size:13px}
.srch{margin:4px 0 18px}
.srch input{width:100%;border:1px solid var(--line);background:var(--card);
  border-radius:12px;padding:12px 14px;font-size:15px;color:var(--ink);outline:none}
.srch input:focus{border-color:var(--accent)}
.seasonbox{margin:0 0 14px;padding:16px 18px;border-radius:16px;background:var(--ink);color:#fff}
.seasonbox:active{opacity:.9}
.seasonbox .st{font-size:11px;letter-spacing:2px;color:#D9C3A5}
.seasonbox .sn{font-size:20px;font-weight:900;margin:4px 0 2px}
.seasonbox .sd{font-size:12px;color:#CDBBA6}
.wk{margin:22px 0 4px;font-size:12px;font-weight:800;color:var(--accent);letter-spacing:1px}
.sep{margin:26px 0 10px;font-size:12px;color:var(--faint);letter-spacing:1px;border-top:1px solid var(--line);padding-top:16px}
.cats{display:grid;gap:10px}
.cat{display:flex;align-items:center;gap:14px;padding:16px 16px;border:1px solid var(--line);
  border-radius:14px;background:var(--card);transition:.15s}
.cat:active{transform:scale(.985);background:#F6F0E8}
.cat .k{width:34px;height:34px;border-radius:10px;background:var(--ink);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;flex:0 0 34px}
.cat .n{font-weight:800;font-size:16px}
.cat .d{font-size:12px;color:var(--faint);margin-top:2px}
.cat .go{margin-left:auto;color:var(--faint);font-size:18px}
.list{display:flex;flex-direction:column}
.row{display:flex;gap:12px;align-items:flex-start;padding:15px 2px;border-bottom:1px solid var(--line)}
.row:active{opacity:.6}
.row .idx{font-size:11px;color:var(--faint);font-weight:700;padding-top:4px;min-width:34px}
.row .body{flex:1;min-width:0}
.row .t{font-size:15px;font-weight:700;line-height:1.55}
.row .m{font-size:12px;color:var(--faint);margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{font-size:11px;padding:1px 7px;border-radius:20px;background:#F1E7DA;color:var(--cta)}
.chip.season{background:var(--cta);color:#fff}
.dot{width:7px;height:7px;border-radius:50%;background:#C9B79F;display:inline-block;margin-right:5px}
.dot.done{background:#2E7D32}.dot.pub{background:#A0521A}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:13px;color:var(--accent);letter-spacing:1px}
.detail h2{font-size:22px;line-height:1.5;margin:2px 0 6px;font-weight:900}
.detail .meta{color:var(--faint);font-size:12px;margin-bottom:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hook{font-size:19px;font-weight:800;line-height:1.55;color:var(--ink)}
.copy{white-space:pre-wrap;font-size:15px;line-height:1.95;color:#3A2A1A}
.copy,.hook,.t,.linkbox{overflow-wrap:anywhere}
.steps{margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{position:relative;padding-left:26px;margin-bottom:10px;font-size:14px;line-height:1.8;color:#3A2A1A}
.steps li:before{counter-increment:s;content:counter(s);position:absolute;left:0;top:1px;
  width:18px;height:18px;border-radius:50%;background:var(--accent);color:#fff;
  font-size:11px;line-height:18px;text-align:center;font-weight:700}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font-size:15px;
  font-weight:800;background:var(--cta);color:#fff;margin-top:6px;font-family:inherit}
.btn:active{opacity:.85}
.btn.ghost{background:#fff;color:var(--cta);border:1px solid var(--line)}
.btn.danger{background:#fff;color:#B3261E;border:1px solid #E7C4C0}
.btnrow{display:flex;gap:10px;margin-top:10px}
.btnrow .btn{flex:1;margin-top:0}
.tags{color:var(--accent);font-size:13px;word-break:break-all}
.empty{color:var(--faint);text-align:center;padding:50px 0;font-size:14px}
.foot{text-align:center;color:var(--faint);font-size:11px;padding:26px 0 10px}
.fab{position:fixed;right:18px;bottom:calc(24px + env(safe-area-inset-bottom));
  width:56px;height:56px;border-radius:50%;background:var(--cta);color:#fff;
  font-size:30px;line-height:1;display:flex;align-items:center;justify-content:center;
  box-shadow:0 8px 24px rgba(160,82,26,.35);z-index:20;border:0;font-family:inherit}
.fab:active{transform:scale(.95)}
.form label{display:block;font-size:12px;color:var(--faint);margin:14px 0 6px;letter-spacing:1px}
.form input,.form select,.form textarea{width:100%;border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;font-size:15px;background:#fff;color:var(--ink);outline:none;font-family:inherit}
.form textarea{line-height:1.8;resize:vertical}
.form input:focus,.form textarea:focus,.form select:focus{border-color:var(--accent)}
.stat{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 10px}
.stat .s{border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 12px;
  font-size:12px;color:var(--sub)}
.stat .s.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.nav{display:flex;gap:10px;margin:18px 0 0}
.nav button{flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;
  padding:10px;font-size:13px;color:var(--sub);font-family:inherit}
.nav button:disabled{opacity:.35}
.hint{font-size:12px;color:var(--faint);margin:8px 0}
.backup{width:100%;min-height:220px;border:1px solid var(--line);border-radius:12px;
  padding:12px;font:12px/1.6 ui-monospace,Menlo,monospace;color:#3A2A1A;background:#fff}
.mine{display:flex;align-items:center;justify-content:space-between;padding:14px 2px;border-bottom:1px solid var(--line)}
.mine .l{font-size:14px;font-weight:700}
.mine .r{font-size:12px;color:var(--faint)}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:10px;
  max-width:720px;margin:0 auto;padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.97);border-top:1px solid var(--line);
  backdrop-filter:saturate(180%) blur(12px)}
.actionbar .btn{flex:1;margin-top:0;padding:12px 10px;font-size:14px}
.actionbar .btn.ghost{background:#fff}
main.withbar{padding-bottom:calc(112px + env(safe-area-inset-bottom))}
.qrimg{width:100%;max-width:260px;height:auto;display:block;margin:4px auto 14px;border-radius:8px}
.linkbox{font:12px/1.6 ui-monospace,Menlo,monospace;background:#fff;border:1px solid var(--line);
  border-radius:10px;padding:10px;word-break:break-all;color:var(--sub);margin-bottom:10px}
</style>
</head>

<script id="DATA" type="application/json">{"items": [{"id": "A1", "cat": "A", "title": "26届央美附中全国第一名的成绩单长什么样", "form": "图文", "hook": "这张成绩单，分数没打码", "copy": "今年这个孩子，拿了央美附中的全国第一名。\n\n成绩单就贴在下面。姓名按家长要求处理了，分数一分没动。\n\n很多人看成绩单，只看总分。我建议你看三个地方。\n\n第一，专业分。专业分不是靠一张画撑起来的，是三科加起来。素描、色彩、速写，哪一科拖后腿，总分就上不去。\n\n第二，文化分。附中的规则是文化过线、按专业排名录取。文化不过线，专业再高也没用。这个孩子的文化分，刚好在安全区往上一点。\n\n第三，单科之间的差距。差距越小，说明越稳；有一科特别高、一科特别低，说明偏科，考试风险大。\n\n我不拿这个名次做宣传。\n\n一个孩子考第一，说明不了每个孩子都能考第一。他可能有天赋，可能起步早，可能家里支持得好。这些条件不是人人都有。\n\n但它至少说明一件事：这个方向是走得通的，这条路有人走通过。\n\n对家长来说，这张成绩单最大的价值，不是让你觉得「我孩子也能第一」，是让你知道，第一名的分数结构长什么样。\n\n你可以拿它当尺子，量一量自己孩子现在差在哪一科。\n\n差在哪，就从哪补。别对着总分焦虑。\n\n还有，别把第一名的训练路径直接套在自己孩子身上。他可能每天画六小时，你孩子只有周末。路径要按时间改。", "shoot": ["成绩单正面，姓名打码、分数保留", "手指点在专业分那一栏", "最后一张是孩子平时的画"], "cost": "20 分钟", "tags": "#美术生 #央美附中 #美院附中 #美术中考"}, {"id": "A2", "cat": "A", "title": "26届录取名单完整公示（一图看全）", "form": "图文", "hook": "完整名单，一个没删", "copy": "这是今年完整的录取名单。\n\n谁、考到哪、什么专业，都在上面。名字按授权处理了，学校一个没删。\n\n发完整名单是有风险的。因为考得不好的那部分，也会被看见。\n\n有同行劝我，只发考上的就行，没考上的别放。我说那叫什么公示。\n\n家长看名单，最容易犯一个错：只数人数。\n\n其实更该看三件事。\n\n第一，录取学校的分布。是集中在一两所，还是分散在好几所。集中，说明教学方向明确；分散，说明出口比较宽。\n\n第二，专业分布。造型、设计、国画、书法，方向不一样，适合的孩子也不一样。\n\n第三，有没有复读生。有复读生不丢人，反而说明这个画室敢把完整路径摆出来。\n\n我发这份名单，不是为了让家长算升学率。\n\n升学率这个东西，分母怎么定，说法就不一样。报考人数算分母，还是全部学生算分母，结果差很多。\n\n名单不会骗人。谁考上了，考到哪，白纸黑字。\n\n你可以不信我说的任何一句话，但你可以自己数。\n\n如果你要问画室要名单，别问「考上几个」，问「能不能看完整名单，包括没考上的」。这句话一问，对方的态度就出来了。", "shoot": ["名单整页，姓名打码", "手指从上往下划", "最后停在名单末尾"], "cost": "20 分钟", "tags": "#美术生 #央美附中 #美院附中 #美术中考"}, {"id": "A3", "cat": "A", "title": "素描 90 分以上，都是什么样的画面", "form": "图文", "hook": "90 分的素描，赢在错误少", "copy": "这几张是九十分以上的素描。\n\n共同点不是画得多细，是形体准、关系整、没有硬伤。\n\n什么叫硬伤？\n\n第一，形。头骨的宽窄、五官的位置、脖子的粗细。这些地方差一点，整张画就站不住。高分卷不一定画得漂亮，但比例一定对。\n\n第二，黑白灰。高分卷从最黑到最亮，层次是拉开的。灰卷的问题是，所有地方都差不多重，画面糊成一片。\n\n第三，边缘。什么地方该实，什么地方该虚，高分卷交代得很清楚。实的地方压得住，虚的地方退得远。\n\n第四，完整度。高分卷不一定每个角落都画满，但主体一定画完了。没画完的卷子，评卷老师一眼就能看出来。\n\n我常跟学生说，高分卷不是「最好看」的那张，是「错误最少」的那张。\n\n因为考试不是创作，是在有限时间里，把你会的东西稳定地拿出来。\n\n家长看这些画，可以问孩子一个问题：你觉得这张画哪里最黑，哪里最亮？\n\n他答得出来，说明他在看关系。答不出来，说明他还在看细节。\n\n看细节的人，画得再多，也上不了高分。\n\n还有，别让孩子照着高分卷临摹。先看他能不能说出这张画的黑白灰关系，说不出来，临了也是抄。", "shoot": ["三张高分卷并排，局部放大", "手指点向形体和明暗交界线", "整张退远看关系"], "cost": "20 分钟", "tags": "#美术生 #央美附中 #美院附中 #美术中考"}, {"id": "A4", "cat": "A", "title": "色彩 85 分以上作品对照", "form": "图文", "hook": "85 分的色彩，颜色不一定多", "copy": "这几张是八十五分以上的色彩。\n\n很多人以为，高分色彩一定是颜色丰富、笔触潇洒。其实不是。\n\n你仔细看，它们的颜色数量并不多。\n\n第一，暗部干净。高分卷的暗部，颜色是统一的，不会红里加绿、绿里加紫。暗部一脏，整张画就闷。\n\n第二，亮部透气。亮部不是靠加白提亮的。加多了白，颜色会粉。高分卷的亮部，能看出原来的色相。\n\n第三，冷暖明确。受光偏暖，背光偏冷；前面偏暖，后面偏冷。这个关系一乱，画面就平。\n\n第四，笔触跟着结构走。不是乱扫，是顺着物体的转折在走。\n\n我见过很多孩子，颜料买了一整盒，画出来还是灰。问题不在颜色少，在关系乱。\n\n色彩考的是关系，不是颜色数量。\n\n家长可以做一个简单的判断：把孩子画的照片调成黑白，如果还能看出体积和前后关系，说明关系是对的；如果一调黑白就糊了，说明颜色在掩盖问题。\n\n这个方法很土，但很准。\n\n颜色是结果，黑白灰才是骨架。\n\n最后补一句：色彩想不脏，调色盘要干净。很多孩子一块脏颜色用一下午，越画越灰。", "shoot": ["两张色彩并排，一张脏一张透", "手指点向暗部和反光", "退远看整体冷暖"], "cost": "20 分钟", "tags": "#美术生 #央美附中 #美院附中 #美术中考"}, {"id": "A5", "cat": "A", "title": "速写 85 分以上作品对照", "form": "图文", "hook": "85 分的速写，赢在三点", "copy": "这几张是八十五分以上的速写。\n\n速写分数拉开，通常不在画得多细，在这三点。\n\n第一，动态准。人站在那，重心落在哪只脚，骨盆往哪边倾，肩膀和骨盆是不是反的。这三件事对了，人就是活的；错了，画得再细也是纸片。\n\n第二，比例对。头、躯干、四肢的长度关系。速写时间短，很多人来不及量，凭感觉画，画出来不是腿短就是手长。\n\n第三，主次清楚。高分速写不是每个人都画得一样细。前面的人实，后面的人虚；动的人实，静的人虚。\n\n还有一个容易被忽略的点：完整度。\n\n四十分钟画三个人，很多人第三个人只画了个轮廓。高分卷不一定每个人都画完，但画面是完整的，不会空一块。\n\n我常让学生练一件事：先画三个人位置，再画动态线，最后才抠细节。顺序反了，时间一定不够。\n\n家长看速写，别只看像不像。看三个人是不是站在同一个空间里，看前后有没有区别。\n\n速写考的是抓整体的能力，不是画完的能力。\n\n练速写有一个笨办法：每天画十个站姿，每个三十秒，只画重心线。一个月后，动态就稳了。", "shoot": ["三张速写并排，重点拍动态线", "手指点向重心和关节", "最后一张退远看整体"], "cost": "20 分钟", "tags": "#美术生 #央美附中 #美院附中 #美术中考"}, {"id": "A6", "cat": "A", "title": "鲁美附中素描最高分，拆开看", "form": "图文", "hook": "鲁美附中的高分卷，强在结构", "copy": "这是鲁美附中的一张高分素描。\n\n不同美院附中，判卷的口味不完全一样。央美附中看重造型的严谨和感受，鲁美附中更看重结构和体积。\n\n这张画强在哪？\n\n第一，结构清楚。颧骨、眉弓、下颌角，这几个骨点交代得很硬。你能感觉到石膏里面是有骨头的。\n\n第二，体积厚。暗部压得下去，亮部提得起来，中间过渡有层次。整张脸是鼓的，不是平的。\n\n第三，用笔肯定。没有反复描，线条是一次到位的。这种肯定，来自对结构的理解，不是手快。\n\n我一直跟学生说，画石膏像不是画一层白皮，是画里面的骨头。\n\n你摸自己的脸，摸到硬的地方，就是骨点。石膏像也是同样的道理。\n\n家长看这类画，可以问孩子：这个人的颧骨在哪，下颌角在哪。他指得出来，说明他在看结构；指不出来，说明他在抄明暗。\n\n抄明暗的孩子，换一个光就废了。\n\n结构是根，明暗是叶。根扎住了，叶才长得稳。\n\n家长不用懂结构，问一句就行：这个石膏像，哪里最硬？孩子指得对，说明他看进去了。", "shoot": ["高分卷正面，局部放大颧骨和下颌", "手指比一下头骨比例", "整张退远看"], "cost": "20 分钟", "tags": "#美术生 #央美附中 #美院附中 #美术中考"}, {"id": "A7", "cat": "A", "title": "广美附中榜眼、探花的画面", "form": "图文", "hook": "广美附中的高分卷，赢在感受", "copy": "这是广美附中的一张高分卷。\n\n广美附中的判卷，和央美、鲁美又不太一样。它更看重画面的生动和感受。\n\n你看这张画，形不是最严谨的，但画面是活的。\n\n第一，笔触有情绪。不是均匀地排线，有的地方快，有的地方慢，有的地方干脆留白。\n\n第二，黑白灰有节奏。不是每一块都画满，该重的地方重，该松的地方松。\n\n第三，有取舍。耳朵后面、脖子下面，该虚的虚掉了，眼睛和鼻子的转折留得很实。\n\n这种画，初看不如精细的画讨喜，但耐看。\n\n我常提醒学生，不要用一种标准套所有学校。\n\n央美附中要严谨，鲁美附中要结构，广美附中要生动。你考哪个，就得知道那个学校喜欢什么。\n\n但有一点是共通的：基本功不能差。\n\n感受是建立在造型能力上的。形都画不准，谈生动就是空的。\n\n家长常问：孩子画得太规矩，是不是没灵气？不一定。先看基本功扎不扎实。基本功到了，灵气才站得住。\n\n先会走，再谈跑。\n\n还有，别因为一张画被夸就换方向。风格是长出来的，不是选出来的。", "shoot": ["高分卷正面，笔触局部", "手指顺着笔触方向走", "退远看整体气息"], "cost": "20 分钟", "tags": "#美术生 #央美附中 #美院附中 #美术中考"}, {"id": "A8", "cat": "A", "title": "国艺第一是怎么画出来的", "form": "图文", "hook": "国艺第一，画的是关系", "copy": "这是国艺附中的一张高分卷。\n\n很多家长没听过国艺附中，其实中国戏曲学院附中也有美术专业，方向偏舞台美术和戏曲人物。\n\n这张画最值得看的，不是细节，是关系。\n\n第一，主体和背景的关系。主体压得住，背景退得远。很多孩子把背景画得和主体一样重，画面就平了。\n\n第二，前后关系。前面的东西实，后面的东西虚。不是靠画得细不细区分，是靠对比强弱区分。\n\n第三，黑白灰的分布。最重的一块在哪，最亮的一块在哪，中间怎么过渡。这张画的分布很清楚。\n\n我常跟学生说，一张画退到三米外看，如果还能看出主体，说明关系对了。\n\n如果退远之后一片糊，说明你画的全是细节，没有关系。\n\n家长看画，也可以用这个方法。把手机拿远一点，眯着眼看，看能不能一眼找到主体。\n\n找不到，就是关系没拉开。\n\n不同学校口味不同，但关系这件事，到哪都通用。\n\n看画的时候，把手机拿远，眯眼。三秒内找不到主体，这张画的关系就有问题。\n\n看画的时候，别只看画了什么，看没画什么。没画的地方，往往是判断。", "shoot": ["高分卷正面，构图完整", "手指点向主体和背景的关系", "退远看整体"], "cost": "20 分钟", "tags": "#美术生 #央美附中 #美院附中 #美术中考"}, {"id": "A9", "cat": "A", "title": "月考分 vs 央附实考分，这张表怎么看", "form": "图文", "hook": "月考分和实考分，差多少", "copy": "这张表，是我们内部做的对照：月考分和央附实考分。\n\n做这张表，是为了看清一件事：月考分到底能不能代表考试分。\n\n结论是：能参考，但不能直接换算。\n\n第一，考题不一样。月考是我们出题，实考是附中出题。附中的题更活，构图、光线、角度都可能出变化。\n\n第二，评卷人不一样。我们按附中标准评，但评卷老师不是附中老师。口味再接近，也有偏差。\n\n第三，考场状态不一样。平时在熟悉的教室画，考试在陌生考场画，心态完全不同。\n\n这张表里，大部分孩子的实考分和月考分在同一个档位，上下浮动不大。也有少数孩子差得比较多。\n\n差得多的，通常不是画技问题，是心态或者时间分配。\n\n所以我们看月考分，看趋势，不看绝对值。\n\n连续三次往上走，说明方法对了；忽高忽低，说明不稳定；一直平，说明到了瓶颈。\n\n家长常问：月考多少分才能考上？这个问题没有标准答案。每年的题、每年的竞争都不一样。\n\n你能做的，是看孩子在同届里的位置，再看他这三个月有没有变化。\n\n分数是路标，不是终点。\n\n最后一句：月考考砸了别急着加课。先看是哪里丢的分，加课解决不了方向问题。", "shoot": ["表格截图，两列分数对照", "手指点在差距最大的一行", "最后拍一张孩子的画"], "cost": "20 分钟", "tags": "#美术生 #央美附中 #美院附中 #美术中考"}, {"id": "A10", "cat": "A", "title": "前 20 名里 18 个专业过线，然后呢", "form": "图文", "hook": "前 20 名里，18 个专业过线", "copy": "三月的月考，前二十名里，有十八个专业过了央美附中。\n\n这个数字，经常被拿来做宣传。我今天想说的是它背后的东西。\n\n第一，前二十名不是随机分布的。他们大多有几个共同点：起步早、出勤稳、改画勤。\n\n第二，过线不等于录取。专业过线只是第一步，文化课还要过线，最后按专业排名录取。\n\n第三，没进前二十的孩子，也有过线的。月考排名和最终结果，不是一回事。\n\n我见过排名十五的孩子最后没走成，也见过排名三十的孩子最后过了。\n\n原因很多：有人考场发挥好，有人文化课拖了后腿，有人考前一个月突然开窍。\n\n所以我不建议家长盯着这个数字，觉得进了前二十就稳了。\n\n它只能说明一件事：这个班的教学方向是对的，大部分孩子跟得上。\n\n对个体的意义，要具体看。\n\n家长常问：我孩子现在排三十，还有希望吗？有。但要看他是怎么排三十的。是一直在三十，还是从五十爬上来的。\n\n往上走的三十，比躺平的十五有希望。\n\n家长看这个数字，最好配一句：那我孩子在第几档，他这三个月动了吗。", "shoot": ["成绩表局部，名次和过线标记", "手指划过前二十行", "最后拍一张教室全景"], "cost": "20 分钟", "tags": "#美术生 #央美附中 #美院附中 #美术中考"}, {"id": "A11", "cat": "A", "title": "六年录取总表（一张图看完）", "form": "图文", "hook": "六年的名单，摞在一起看", "copy": "这是 2021 到 2026 六年的录取名单。\n\n单看一年，看不出什么。六年摞在一起，能看出趋势。\n\n第一，录取学校的分布变宽了。早几年集中在一两所，这几年分散到好几所。这说明学生的选择多了，也说明教学不只对着一所学校。\n\n第二，复读生的比例在变。有的年份多，有的年份少。复读生多，不一定是坏事，说明有人愿意再来一年。\n\n第三，跨专业的多了。以前大多是造型，这几年设计、国画、书法的都有。\n\n我发这六年名单，不是想证明什么。\n\n一家画室办得久，总有一些成绩。把六年摊开，是为了让家长看见一个长期的样子，而不是某一年的高光。\n\n家长常问：看几年够？三年起步。一年可能是运气，三年能看到稳定性。\n\n还有人问：名单上没名字的年份怎么办？那就要问清楚，是没考，还是没考好。\n\n敢把六年都摆出来的画室，至少不怕你查。\n\n时间是最好的过滤器。\n\n如果一家画室只能拿出一年名单，你就多问一句：前几年呢。\n\n名单看三年，能看出稳定；看六年，能看出一个人是不是还在认真做这件事。", "shoot": ["六张名单并排铺开", "手指点向不同年份的学校分布", "最后合上，拍封面"], "cost": "20 分钟", "tags": "#美术生 #央美附中 #美院附中 #美术中考"}, {"id": "A12", "cat": "A", "title": "复读生的成绩对比：多这一年，差在哪", "form": "图文", "hook": "复读这一年，他改了什么", "copy": "这个孩子复读了一年。\n\n左边是第一次考的成绩，右边是第二次。分数涨了，但涨得不算多。\n\n真正变的，不是分数，是三件事。\n\n第一，他知道自己弱在哪了。第一年他什么都练，什么都练不深。第二年他只补色彩，因为第一年色彩拖了后腿。\n\n第二，他不再追求画完，追求画对。第一年他总想画满，第二年他知道哪里该停。\n\n第三，他心态稳了。第一年进考场手抖，第二年他知道最坏的结果是什么，反而不怕了。\n\n复读这件事，不是所有人都适合。\n\n适合复读的孩子，通常有三个特征：自己不甘心、知道差在哪、家里支持。\n\n不适合的也有三个：被逼的、不知道为什么没考上的、家里已经很勉强的。\n\n家长常问：复读一年值不值？这个问题没有统一答案。有人复读一年考上了，有人复读一年还是差几分。\n\n你能做的，是帮孩子想清楚：这一年，他打算改什么。\n\n说不出要改什么，复读就是再来一遍。\n\n复读不是重来一遍，是带着答案再考一次。没有答案，就别急。", "shoot": ["两年成绩单并排", "两张同角度素描对比", "学生在画架前的背影"], "cost": "20 分钟", "tags": "#美术生 #央美附中 #美院附中 #美术中考"}, {"id": "A13", "cat": "A", "title": "零基础到央附，一个完整案例的两年", "form": "图文", "hook": "零基础到附中，用了两年", "copy": "这个孩子，来的时候是零基础。\n\n两年后，他考上了央美附中。\n\n我把他两年的画整理了一下，挑了十二张，按时间排。\n\n前三个月，画的是几何体和排线。丑，但必须画。因为手要先把线控制住。\n\n第四个月到第八个月，画石膏像。这段时间最难，因为他开始知道什么是「结构」，但手跟不上。\n\n第九个月到第一年结束，画头像和静物。开始有样子了。\n\n第二年，才是针对附中考试的训练：素描石膏像、色彩静物、场景速写、书法。\n\n我讲这个案例，不是想说零基础也能考上。\n\n零基础能考上，有几个前提：起步不能太晚、每天的训练量要够、文化课不能垮、孩子自己要想画。\n\n缺一个，难度都会上一个台阶。\n\n家长常问：我孩子零基础，现在初一，来得及吗？来得及，但不能再拖。初二开始，时间就很紧了。\n\n还有人问：零基础是不是要先上兴趣班？不用。直接打基础，兴趣是在进步里长出来的。\n\n两年听起来很长，其实一天一天过，很快。\n\n零基础最怕的不是起步晚，是中途换方向。今天学素描，明天学设计，最后什么都没扎住。", "shoot": ["第一张画和最后一张画并排", "中间过程图快速翻过", "学生在教室里画画的背影"], "cost": "20 分钟", "tags": "#美术生 #央美附中 #美院附中 #美术中考"}, {"id": "A14", "cat": "A", "title": "我们今年劝退了近 30 个孩子，为什么", "form": "视频", "hook": "今年我劝退了近三十个孩子", "copy": "今年我们劝退了近三十个孩子。\n\n不是他们不够好，是这条路不适合所有人。\n\n第一类，不想画的。来了两个月，每天坐在画架前，笔不动。你问他，他说在想。想了两个月，一张完整的画都没有。\n\n第二类，时间不够的。高三才来，文化课也悬着，专业从零开始。他自己急，家长更急。这种孩子，我们收下来，最后大概率是两头空。\n\n第三类，方向错的。有的孩子喜欢画，但喜欢的是漫画、是插画，不是附中要考的造型。硬把他往考试上拽，他痛苦，也考不好。\n\n劝退这件事，最难的不是开口，是开口之后。\n\n有个孩子，来了两个月，状态一直不对。我跟他聊了三次，第三次他说，老师我其实不想考附中，是我妈想让我考。\n\n那天下午他妈妈来了。她坐在我对面，第一句话是：是不是我孩子不行。\n\n我说不是。是你孩子不想。\n\n她哭了。她说我们从小画到大，怎么能不想。\n\n我说画到大，不代表想画下去。这两件事不一样。\n\n后来他们退费走了。走的时候，那个孩子给我鞠了一躬。\n\n退费我们按课时算，不拖，也不扣。有的家长不理解，说你们是不是傻。我说收了不合适的钱，后面更麻烦。\n\n家长常问：你们是不是挑学生？是。我们挑的不是基础，是愿意画。\n\n还有人问：被劝退的孩子后来怎么办？有的去了普高，有的转学设计，有的过了一年又回来。回来的时候，是他自己想画了。\n\n少收这些孩子，账上肯定少一笔。但我睡得着。\n\n一个画室如果什么人都收，最后谁都教不好。\n\n我们劝退有流程。先由班主任谈，再由我谈，最后给家长两个选择：转班试一个月，或者退费。\n\n不当天做决定。让孩子回去想三天，想清楚了再来。\n\n三天后还来的，多半是真想画。三天后不来的，我们也不劝。\n\n有人说我们不会做生意。可能吧。但我见过太多画室，收了一屋子不想画的孩子，最后老师累，孩子苦，家长还觉得被骗。", "shoot": ["办公室正面口播，背景是空教室", "手边一摞退费单，不拍内容", "结尾镜头停在空画架上"], "cost": "20 分钟", "tags": "#美术生 #央美附中 #美院附中 #美术中考"}, {"id": "A15", "cat": "A", "title": "第 40 面锦旗背后是谁", "form": "视频", "hook": "第四十面锦旗，是一个复读生家长送的", "copy": "墙上挂着四十面锦旗。\n\n第四十面，是一个复读生的家长送的。\n\n第一年，这个孩子没考上。\n\n出成绩那天，他妈妈来办退费。她没闹，也没说难听的话，就坐在办公室里，把收据一张张摊开，说，麻烦你了。\n\n我给她办完，送她到门口。她回头问了一句：老师，是不是我们孩子真的不行。\n\n我说不是。是今年差了一点。\n\n她没说话，走了。\n\n那个孩子第二年又来了。不是我们劝的，是他自己跟他妈说，想再来一年。\n\n第二年他考上了。\n\n录取通知书下来那天，他妈妈抱着一面锦旗站在门口。我接过来，看见上面写的是「不弃」两个字。\n\n她说，第一年没送，是觉得没脸送。第二年送，是想告诉你，你没看错他。\n\n这面旗子，比前面三十九面都重。\n\n因为它不是庆祝成功，是纪念一个人被相信过。\n\n家长常问：复读一年值得吗？看孩子。自己想复读的，值得；被逼着复读的，多半还是不行。\n\n还有人问：你们会不会因为第一年没考上，就不收这个孩子？不会。第一年没考上，不代表第二年不行。\n\n四十面锦旗挂在墙上，我很少看。\n\n但第四十面，我每次路过都会看一眼。\n\n它提醒我，教育这件事，有时候要等一年才看得到结果。\n\n第一年那个孩子，其实画得不差。差的是心态。\n\n他每次月考都紧张，一紧张就画不完。我们跟他聊过很多次，没用。\n\n第二年他变了一个人。不是因为画技涨了多少，是因为他知道自己为什么再来一次。\n\n他跟我说，老师，第一年我是怕考不上，第二年我是想考上。\n\n怕和想，是两回事。怕的人手会抖，想的人手会稳。\n\n这句话我后来讲给很多家长听。\n\n那面旗后来被学生碰掉过一次，我捡起来，重新挂回去。挂的时候我在想，教育这件事，有时候不是把孩子送进去，是等他一年。", "shoot": ["锦旗墙，从第一面慢慢推到第四十面", "手指停在第四十面的名字上", "口播站在墙前，不拍全景"], "cost": "20 分钟", "tags": "#美术生 #央美附中 #美院附中 #美术中考"}, {"id": "A16", "cat": "A", "title": "成绩公示：能发的名字，都发真的", "form": "图文", "hook": "能发的名字，都发真的", "copy": "这是我们贴在教学楼里的成绩公示。\n\n能发的名字，都发真的。不能发的，一个不放。\n\n什么叫不能发？孩子或家长不同意的，打码或者不写。这是底线。\n\n为什么要做公示？\n\n因为画室这个行业，成绩是最容易注水的地方。\n\n有的机构把「专业过线」写成「录取」，把「合格证」写成「考上」，把别的画室的学生写成自己的。\n\n家长分不清，就只能听谁说得好听。\n\n公示的意义，是让家长能核对。\n\n名字可以对，学校可以对，年份可以对。对不上，你就有理由怀疑。\n\n我们每年公示两次：一次是专业过线，一次是最终录取。两次分开写，不混在一起。\n\n家长常问：公示的名字会不会泄露隐私？我们提前征得同意，不同意的打码。\n\n还有人问：为什么有的年份名字少？因为那一年考得少，或者同意的少。少就是少，不补。\n\n公示不是给别人看的，是给自己立的规矩。\n\n写上去的每一个名字，都要经得起问。\n\n你去看任何一家的公示，先看它敢不敢写年份，敢不敢写没考上的。", "shoot": ["公示墙全景", "名单局部，姓名和学校", "家长在墙前看"], "cost": "20 分钟", "tags": "#美术生 #央美附中 #美院附中 #美术中考"}, {"id": "A17", "cat": "A", "title": "央美附中在各省招多少人（数据科普）", "form": "图文", "hook": "200 个名额，全国分", "copy": "央美附中每年面向全国招 200 人。\n\n注意，是不按地区、不按性别预先分配名额。\n\n这句话很重要。\n\n很多家长以为，附中会给各省分名额，像高考一样。不是。全国一张卷，一个标准，一起排。\n\n这意味着两件事。\n\n第一，竞争是全国性的。你在省里排前几名，不代表在全国排得上。\n\n第二，没有地域照顾。北京的孩子、河北的孩子、广东的孩子，考的是同一场试。\n\n那北京户口有什么用？\n\n考上之后，学生转入北京集体户口，高考时享受北京户口的相关政策。这是考上之后的事，不是考试时的加分。\n\n家长常问：外地孩子考附中是不是更难？考试标准一样，但信息差不一样。北京的孩子看展多、消息快，这是客观存在的。\n\n还有人问：200 个名额，多少人报？近几年大概两千人左右。\n\n数字摆在这，你自己算。\n\n但别被数字吓住。报名的两千人里，真正准备充分的，没有那么多。\n\n200 个名额听着少，但真正跟你孩子竞争的，是准备得和你孩子差不多那一批人。", "shoot": ["招生简章页面，招生人数圈出", "中国地图示意，不标具体省份数", "手指点在「不按地区分配」"], "cost": "20 分钟", "tags": "#美术生 #央美附中 #美院附中 #美术中考"}, {"id": "A18", "cat": "A", "title": "一条视频看完这一届的录取结果", "form": "视频", "hook": "这一届的名单，我一张张翻给你看", "copy": "这条视频，没有配乐，也没有煽情。\n\n我就是把这一届的名单，一张张翻给你看。\n\n翻的时候，你会发现几件事。\n\n第一，考上的人里，很多不是一开始画得最好的。\n\n有的孩子刚来的时候，形都画不准，排线一塌糊涂。但他每天改一张，改了一年。\n\n第二，名单里有复读生。\n\n复读不丢人。第一年差几分，第二年补上，这条路是通的。但复读要想清楚，是孩子自己想再来，还是家长不甘心。\n\n第三，专业好的孩子，文化课大多也不差。\n\n不是因为他们聪明，是因为他们知道怎么安排时间。画画需要专注，学文化也需要专注，这两件事是通的。\n\n第四，也是最容易被忽略的：名单背后，有很多没考上的人。\n\n他们不在这张纸上。但他们也画了一年，也起早贪黑，也在某个晚上想过放弃。\n\n我翻名单的时候，脑子里会出现他们的脸。\n\n有个孩子，专业过了，文化差几分。出成绩那天他没哭，跟我说，老师我想去读个专科，以后再考。\n\n我说好。\n\n名单是结果，但不是全部。\n\n家长常问：看名单能看出什么？能看出比例，看不出你家孩子。你孩子是独一无二的，别拿名单吓自己。\n\n还有人问：考上的是不是都有天赋？大部分没有。他们只是没有停。\n\n名单翻完，就一张纸。\n\n但每一行，都是一年。\n\n名单里有一个孩子，我印象很深。\n\n他刚来的时候，是班里基础差的几个之一。第一次月考，素描六十分。\n\n他不聪明，但他有一个习惯：每张画都留着，背面写日期。\n\n一年下来，他攒了三百多张。结业那天他抱过来给我看，从第一张翻到最后一张，像看一个人慢慢站起来。\n\n他考上了。\n\n名单上只有一行字，但那一行后面，是三百多张纸。\n\n名单翻到最后一页，我会停一下。那一页之后，还有很多人没写上来。他们也在画，也值得被记住。", "shoot": ["固定机位俯拍，名单逐页翻", "每页停 1.5 秒，姓名打码", "最后合上名单，手停一下"], "cost": "20 分钟", "tags": "#美术生 #央美附中 #美院附中 #美术中考"}, {"id": "B1", "cat": "B", "title": "央美附中到底是什么学校？和普通高中差在哪", "form": "图文", "hook": "它是一所中专，不是高中", "copy": "央美附中，全称是中央美术学院附属中等美术学校。\n\n注意最后两个字：中专。\n\n很多家长一听中专就皱眉，觉得不如高中。这是最大的误解。\n\n第一，它是中专，所以才能面向全国招生。普通高中受学籍和户籍限制，它不受。\n\n第二，它隶属中央美术学院，1953 年建校，首任校长徐悲鸿。专业课和文化课都在央美体系里。\n\n第三，它的出口不是就业，是高考。绝大多数毕业生考中央美院、清华美院这类院校，也有相当一部分进人大、中传这样的综合类大学。\n\n第四，考上之后，学生转入北京集体户口，高考时按北京政策走。\n\n所以它不是「考不上高中的退路」，是另一条赛道。\n\n这条赛道适不适合你孩子，看三件事：孩子想不想画、家里能不能接受四年制、文化课能不能保住。\n\n家长常问：中专学历会不会影响以后？附中的学生走的是艺考，最后看的是本科院校，不是中专学历。\n\n还有人问：和普通高中美术班有什么区别？普通高中先拼文化，美术是加分项；附中是专业训练为主，文化课保证过线。\n\n方向不一样，别拿一个的标准衡量另一个。\n\n最后说一句：选附中，不是选一个学历，是选四年怎么过。", "shoot": ["校门照片或简章封面", "招生简章里「中专」两个字圈出", "附中学生作品一张"], "cost": "20 分钟", "tags": "#美术生 #央美附中 #附中备考 #美术中考"}, {"id": "B2", "cat": "B", "title": "初二开始学美术，来得及考央美附中吗", "form": "图文", "hook": "初二开始，来得及，但很紧", "copy": "初二开始学美术，考央美附中来不来得及？\n\n来得及，但要看怎么学。\n\n附中的考试在每年五月初，考素描石膏像、色彩静物、场景速写、书法，还有文化课。\n\n从初二下学期算起，到初三考试，大概一年半。\n\n一年半时间，够把基础打起来，但不够慢慢来。\n\n我的建议是分三段。\n\n第一段，初二下学期到暑假：打基础。几何体、静物、石膏像，把形和黑白灰解决掉。\n\n第二段，初三上学期：进集训。按附中的考试科目走，素描、色彩、速写、书法同时推。\n\n第三段，考前三个月：模拟考、卡时间、调状态。\n\n文化课不能停。附中的规则是文化过线，按专业排名录取。文化不过线，专业再高也没用。\n\n家长常问：初二零基础行不行？行，但每天的训练量要够，不能只靠周末。\n\n还有人问：要不要现在就去北京？不一定。先看本地有没有能按附中标准教的老师。\n\n一年半，够用，但一天都不能浪费。\n\n如果现在还在犹豫，先做一件事：让孩子连续画两周，每天两小时。坐得住，再谈规划。\n\n还有：初二这一年，别急着画难的东西，先把形画准。形不准，后面全是白练。", "shoot": ["日历翻到初二那一页", "画室里初二学生的课表", "一张基础素描"], "cost": "20 分钟", "tags": "#美术生 #央美附中 #附中备考 #美术中考"}, {"id": "B3", "cat": "B", "title": "初三才决定考附中，还有机会吗", "form": "图文", "hook": "初三才决定，只剩一条窄路", "copy": "初三才决定考附中，还有机会吗？\n\n有，但只剩一条窄路。\n\n附中考试在五月初。初三开学到考试，大概八个月。\n\n八个月，要从零开始打基础，同时保住文化课，难度很大。\n\n什么样的孩子能在八个月里走通？\n\n第一，有底子。小时候学过，手上有控制力，只是没系统练过。\n\n第二，文化课稳。不用花太多时间补文化，能把精力放在专业上。\n\n第三，自己能坐得住。每天画六到八个小时，不喊累。\n\n三条缺一条，我一般会劝家长想清楚。\n\n不是劝退，是别让孩子用八个月去赌一个概率很低的结果。\n\n如果孩子确实想试，我的建议是：先做一个月的强化测试。每天按集训强度画，一个月后看进步速度。进步快，继续；进步慢，及时调整。\n\n家长常问：初三休学专攻专业行不行？不建议。文化课一停，后面捡回来更难。\n\n还有人问：考不上怎么办？还有统考、普高美术班、美职这几条路，不是只有附中一条。\n\n八个月不是不可能，是要看清代价。\n\n八个月走通的孩子，我见过，但不多。做决定之前，先做一次诚实的评估。\n\n如果评估下来不乐观，换赛道不丢人。硬撑八个月，最后文化专业两头空，才是真的亏。", "shoot": ["初三课表，专业课占满", "画室里初三学生的画", "倒计时日历"], "cost": "20 分钟", "tags": "#美术生 #央美附中 #附中备考 #美术中考"}, {"id": "B4", "cat": "B", "title": "央美附中考试到底考什么", "form": "图文", "hook": "四科专业，一科都不能瘸", "copy": "央美附中到底考什么？\n\n专业四科：素描、色彩、速写、书法。\n\n素描考石膏像写生，三个小时。考的是形体、结构、黑白灰。\n\n色彩考静物写生，三个小时。考的是冷暖、空间、质感。\n\n速写考场景，不少于三个人，四十分钟。考的是动态、比例、组织画面的能力。\n\n书法限楷体，四十分钟，分值三十分。这一科最容易被忽略，但它是实打实的分数。\n\n文化课考语文、数学、英语、文综，单科满分一百分。\n\n录取规则是：文化课达到合格线，按专业排名择优录取。\n\n这句话要读三遍。文化是门槛，专业是排名。\n\n所以训练的重心在专业，但文化不能掉队。\n\n家长常问：书法要练到什么程度？不用写成书法家，但要工整、结构稳、不出错。\n\n还有人问：速写三个人怎么练？先练单人动态，再练双人组合，最后练三人场景。\n\n四科是一张桌子，缺一条腿就站不住。\n\n书法这一科，很多孩子考前三个月才开始练。三十分，丢不起。\n\n书法练法：每天二十分钟，先练横竖，再练结构，最后抄整段。别贪多，稳比多重要。三十分，练三个月能拿二十多，不练就是白丢。", "shoot": ["考试科目表，四科并列", "素描石膏像、色彩静物各一张", "速写场景一张"], "cost": "20 分钟", "tags": "#美术生 #央美附中 #附中备考 #美术中考"}, {"id": "B5", "cat": "B", "title": "央美附中历年分数线（2021-2025）", "form": "图文", "hook": "分数线涨了，不是因为题难", "copy": "这是央美附中近几年的分数线。\n\n2025 年，文化满分 400，过线 286；专业满分 330，线 234。\n\n2024 年，文化满分 400，过线 278；专业满分 330，线 236。\n\n2023 年，文化满分 300，过线 215；专业满分 310，线 229。\n\n2022 年，文化 300，过线 210；专业 310，线 224。\n\n2021 年，文化 300，过线 210；专业 310，线 231。\n\n看这张表，注意两件事。\n\n第一，2024 年文化满分从 300 变成 400，因为加了文综一百分，书法也从 10 分提到 30 分。\n\n第二，文化过线分跟着涨，但这不是题变难了，是科目变多了。\n\n所以别拿 2023 年的 215 分去对 2025 年的 286 分，没有可比性。\n\n家长常问：过线就行吗？不是。过线只是有资格，最后按专业排名录取。\n\n还有人问：每年分数会大涨吗？看科目和报考人数，不能只看一年。\n\n看分数线，要看三年的趋势，不要盯一年的高低。\n\n最后提醒：分数线是门槛，不是目标。盯着线练，永远差一点。", "shoot": ["历年分数线表格截图", "2024 年那一行圈出", "文化课科目变化标注"], "cost": "20 分钟", "tags": "#美术生 #央美附中 #附中备考 #美术中考"}, {"id": "B6", "cat": "B", "title": "央美附中录取多少人、多少人报考", "form": "图文", "hook": "200 个名额，2000 人报", "copy": "央美附中每年面向全国招 200 人。\n\n报考人数，近几年大概两千人左右。\n\n十个里取一个。\n\n这个比例，比很多家长想象的低，也比很多家长想象的高。\n\n低在哪？低在两千人里，真正准备充分的不多。很多人是临时起意，或者被机构推着报。\n\n高在哪？高在附中的考试很专业。素描考石膏像，色彩考静物，速写考三人场景，还有书法。没系统练过，很难蒙。\n\n所以这个数字要这么看：你真正的对手，不是两千人，是那几百个准备了一年以上的人。\n\n家长常问：招 200 人，分省吗？不分。全国统一排名，不按地区预设名额。\n\n还有人问：北京孩子是不是占优势？考试标准一样。优势在信息和资源，不在分数。\n\n知道比例，不是为了吓自己，是为了知道要准备到什么程度。\n\n十分之一，靠运气进不去。\n\n准备到什么程度算够？看同届的人，不看报名总数。\n\n还有一个数字要看：每年附中会在考前发布招生简章，人数和科目以当年为准。别拿往年的数字做今年的决定。家长最容易犯的错，是拿三年前的经验，指导今年的考试。", "shoot": ["招生简章人数页", "报名现场或考场外", "录取名单厚度"], "cost": "20 分钟", "tags": "#美术生 #央美附中 #附中备考 #美术中考"}, {"id": "B7", "cat": "B", "title": "读央美附中一年要花多少钱", "form": "图文", "hook": "附中的钱，花在三个地方", "copy": "读央美附中一年要花多少钱？\n\n这个问题没有统一答案，因为每个家庭的住法、画材用量都不一样。\n\n但钱主要花在三个地方。\n\n第一，学费和住宿。附中是公办学校，收费标准按国家规定执行，具体金额以当年招生简章为准。【待填：附中学费与住宿费标准】\n\n第二，画材。素描纸、颜料、画笔、画板，一个月几百到上千不等。色彩最费颜料，速写最费纸。\n\n第三，生活。北京的生活成本，吃住行，一个月多少，看家庭安排。\n\n还有一笔容易被忽略的：写生和看展。附中会有外出写生、参观展览，这些是学习的一部分。\n\n家长常问：附中是不是很贵？它比集训便宜，比普通高中贵一点。真正的开销在画材和生活。\n\n还有人问：要不要在北京租房陪读？看孩子自理能力。能住校就住校，住校也是学习的一部分。\n\n算费用，别只算学费。把一年当一个整体算。\n\n算完这笔账，再决定要不要走这条路。别让孩子考上了，家里却撑不住。\n\n如果家里预算紧，先保画材和集训，住宿可以选得朴素一点。钱要花在能变成画的地方，别在设备上攀比，画笔好用就行。", "shoot": ["费用清单手写版", "宿舍和食堂照片", "画材堆一角"], "cost": "20 分钟", "tags": "#美术生 #央美附中 #附中备考 #美术中考"}, {"id": "B8", "cat": "B", "title": "北京户口和考央美附中有什么关系", "form": "图文", "hook": "北京户口，是考上之后的事", "copy": "北京户口和考央美附中，到底是什么关系？\n\n一句话：考上之后才有，考试的时候没有加分。\n\n附中的规则是，学生考入后转入北京集体户口，高考期间按北京的相关政策参加考试。\n\n这是考上之后的福利，不是考试时的捷径。\n\n很多家长误以为，有北京户口更容易考。不是。附中面向全国招生，全国一张卷，一个标准。\n\n北京孩子真正的优势，是信息。看展方便，找老师方便，知道附中喜欢什么。\n\n外地孩子也能补，但要主动。\n\n家长常问：集体户口和正式户口一样吗？不一样。它是学生集体户，毕业后要迁出。\n\n还有人问：为了户口考附中值不值？如果只为了户口，不值。附中四年，专业训练很苦，不喜欢画的孩子撑不下来。\n\n户口是结果，不是理由。\n\n先想清楚孩子要不要走这条路，再谈户口。\n\n户口这件事，说清楚比说好听重要。\n\n另外，集体户口不解决父母户口，也不解决买房上学，别想太多。它的作用只有一个：高考按北京政策。想清楚这一点，再做决定。", "shoot": ["户口迁移说明页", "高考政策截图", "附中学生在教室"], "cost": "20 分钟", "tags": "#美术生 #央美附中 #附中备考 #美术中考"}, {"id": "B9", "cat": "B", "title": "央美附中 vs 国美附中，怎么选", "form": "图文", "hook": "央美附中和国美附中，怎么选", "copy": "央美附中和国美附中，怎么选？\n\n两所都是好学校，但方向不一样。\n\n央美附中在北京，隶属中央美术学院，1953 年建校。教学偏造型基础，考试考素描石膏像、色彩静物、场景速写、书法。\n\n国美附中在杭州，隶属中国美术学院。同样重视基础，但地域文化、教学传统、考试偏好都有自己的特点。\n\n怎么选？看三件事。\n\n第一，孩子喜欢哪种画。多看两校学生的作品，孩子自然会有感觉。\n\n第二，家里的安排。北京和杭州，距离、生活成本、陪读条件都不一样。\n\n第三，考试内容。两校的科目和侧重点不同，训练方向要跟着变。\n\n我不建议同时准备两所。方向不同，同时抓容易两头空。\n\n家长常问：哪个更好考？没有绝对答案，看当年报考人数和孩子的适配度。\n\n还有人问：能不能先考一个，考不上再考另一个？考试时间接近，准备方向也不同，很难兼顾。\n\n选学校，本质是选一种训练方式。\n\n选之前，带孩子去两所学校门口站一站。感觉这东西，比表格准。", "shoot": ["两校简章并排", "两校学生作品对比", "地图上北京和杭州"], "cost": "20 分钟", "tags": "#美术生 #央美附中 #附中备考 #美术中考"}, {"id": "B10", "cat": "B", "title": "央美/鲁美/广美附中，分别适合什么样的孩子", "form": "图文", "hook": "三所附中，三种孩子", "copy": "央美、鲁美、广美三所附中，分别适合什么样的孩子？\n\n央美附中，在北京。偏造型，重结构、重感受，考试有书法。适合基础扎实、愿意在北京待四年的孩子。\n\n鲁美附中，在沈阳。重结构、重体积，画面要厚。适合手上有力量、画风偏结实的孩子。\n\n广美附中，在广州。重感受、重生动，画面要活。适合观察敏锐、画风偏松的孩子。\n\n这只是大致倾向，不是绝对标准。每年考题和评卷老师都会变。\n\n怎么判断孩子适合哪所？最好的办法是看作品。把三校的高分卷放在一起，让孩子说自己喜欢哪张，为什么。\n\n他说得出理由，说明他有感觉；说不出，说明还在模仿。\n\n家长常问：能不能三所都考？时间不冲突的话可以，但训练要有主次。主攻一所，另外两所当机会。\n\n还有人问：考上哪所都一样吗？不一样。城市、教学、出口都不同，要想清楚。\n\n选学校，先选方向，再选城市。\n\n别问哪所最好，问哪所最适合。\n\n还有一点：三所附中的考试时间可能冲突，报名前先看日历。别等到打印准考证才发现撞了。", "shoot": ["三校作品并排", "三地地图示意", "考试科目对比表"], "cost": "20 分钟", "tags": "#美术生 #央美附中 #附中备考 #美术中考"}, {"id": "B11", "cat": "B", "title": "考附中一定要去北京集训吗", "form": "图文", "hook": "不去北京，也能考附中吗", "copy": "考附中一定要去北京集训吗？\n\n不一定，但有条件。\n\n不去北京，意味着三件事要靠自己解决。\n\n第一，教学标准。附中喜欢什么样的画，本地老师要清楚。不清楚，练得越多偏得越远。\n\n第二，信息。报名时间、考试变化、评分偏好，这些在北京更容易拿到。\n\n第三，氛围。周围有没有一群同样考附中的孩子，差别很大。\n\n如果本地画室能解决这三件事，不用去北京。\n\n怎么判断？问三个问题：你们每年有几个考附中的？能不能看他们的画？老师知不知道今年的考试变化？\n\n答得清楚，可以考虑；答得含糊，就要谨慎。\n\n家长常问：线上课行不行？可以补知识，补不了手感和氛围。\n\n还有人问：考前一个月去北京冲刺行不行？可以，但前提是基础已经打好。去北京是调方向，不是从零开始。\n\n去不去北京，不是关键。关键是训练标准对不对。\n\n最后一句话：集训地不重要，教你的人重要。\n\n最后一句：不管在哪学，每个月都要拿附中的真题测一次。测完对照高分卷，差在哪，一目了然。", "shoot": ["本地画室上课场景", "线上课屏幕", "附中考试真题"], "cost": "20 分钟", "tags": "#美术生 #央美附中 #附中备考 #美术中考"}, {"id": "B12", "cat": "B", "title": "备考附中要不要放弃文化课", "form": "图文", "hook": "停文化课，是最贵的省钱", "copy": "备考附中，要不要放弃文化课？\n\n不要。这是我最肯定的一条建议。\n\n附中的录取规则是：文化课达到合格线，按专业排名录取。\n\n注意顺序。文化是门槛，专业是排名。\n\n门槛过不去，专业再高也进不了。\n\n而且文化课有一个特点：停了就退，退了很难捡。\n\n画画停一个月，手感会差，但捡回来快。文化课停三个月，单词忘了，题型生了，捡回来要双倍时间。\n\n所以我们的安排是每天固定一小时文化课，不占专业课，也不额外加。\n\n一小时能干什么？做一套小题，背二十个词，过一遍错题。\n\n不多，但每天都在。\n\n家长常问：孩子专业课太忙，能不能考前停两个月？不能。停两个月，等于把之前的积累清零。\n\n还有人问：文化课差很多怎么办？早补，别等到初三。文化课是慢功夫，越早越省力。\n\n专业决定你能不能被看见，文化决定你能不能被留下。\n\n最后一句：文化课不是负担，是保险。\n\n前年有个孩子，专业很好，考前两个月把文化课停了。最后专业过了，文化差 9 分。他妈妈说，早知道每天抽一小时。9 分，就是每天一小时的事。", "shoot": ["文化课教室，黑板上一道题", "课表上专业和文化的比例", "学生边画边背单词"], "cost": "20 分钟", "tags": "#美术生 #央美附中 #附中备考 #美术中考"}, {"id": "B13", "cat": "B", "title": "专业课和文化课时间怎么分配", "form": "图文", "hook": "一天的时间，这样分", "copy": "专业课和文化课的时间怎么分配？\n\n我给一个可执行的版本。\n\n早上八点到十二点，专业课。这四个小时是全天状态最好的，用来画素描或者色彩这种需要长时间投入的科目。\n\n下午两点到五点，专业课。练速写、书法，或者改画。\n\n晚上七点到八点，文化课。固定一小时，做小题、背单词、过错题。\n\n八点到九点半，复盘。改一张画，看一张好画，记一条心得。\n\n九点半以后，不收画，不熬夜。\n\n这个安排的核心，是把最难的事放在状态最好的时候。\n\n很多孩子反了：早上磨蹭，下午犯困，晚上熬夜画。画到十二点，第二天起不来，循环下去。\n\n家长常问：孩子晚上效率高，能不能晚点睡？偶尔可以，长期不行。备考是半年的事，不是一晚上。\n\n还有人问：周末要不要加课？加一节可以，加三节就过了。\n\n时间不是越多越好，是用对地方。\n\n时间表可以调，但有一条不能变：固定睡觉时间。\n\n还有一点：时间表要留白。排得太满，孩子会假努力，坐在那儿发呆，也算在画。留半小时空，反而效率高。", "shoot": ["手写时间表，早中晚三段", "画室时钟", "学生吃饭、画画的切换"], "cost": "20 分钟", "tags": "#美术生 #央美附中 #附中备考 #美术中考"}, {"id": "B14", "cat": "B", "title": "什么样的孩子不适合考附中", "form": "图文", "hook": "有五类孩子，我不建议考附中", "copy": "什么样的孩子不适合考附中？\n\n我说五类，可能不中听。\n\n第一类，不想画的。坐在画架前就烦，画画对他来说是惩罚。这种孩子，考上也是受罪。\n\n第二类，坐不住的。附中四年，每天大量时间在画室里。坐不住的人，撑不过第一年。\n\n第三类，文化课差太多的。附中要文化过线，差几十分，补起来很吃力。\n\n第四类，家里撑不住的。四年学费、生活费、画材，是一笔长期开销。勉强上，孩子压力也大。\n\n第五类，只想逃避高考的。觉得艺考轻松，这是误解。艺考是另一条更窄的路。\n\n这五类里，前两类最要紧。因为不投入，什么都白搭。\n\n家长常问：孩子现在不想画，以后会不会想？有可能，但别拿四年去赌。\n\n还有人问：孩子成绩一般，是不是就没戏？不是。看的是意愿和进步速度，不是现在的分数。\n\n选路之前，先看清孩子。\n\n不适合，不等于不行。换一条路，可能走得更远。\n\n怎么判断孩子想不想画？别问，看。给他三天，不催不陪，看他自己会不会坐到画架前。会，就是想；不会，就是不想。", "shoot": ["办公室谈话场景", "空画架", "附中校园外景"], "cost": "20 分钟", "tags": "#美术生 #央美附中 #附中备考 #美术中考"}, {"id": "B15", "cat": "B", "title": "怎么判断一家画室的成绩是真的", "form": "图文", "hook": "看成绩，先看它敢不敢写全", "copy": "怎么判断一家画室的成绩是真的？\n\n看四点。\n\n第一，敢不敢放完整名单。只放几个名字的，多半是挑过的。\n\n第二，敢不敢写年份。2026 届、2025 届，写清楚。混在一起写的，要小心。\n\n第三，敢不敢区分「过线」和「录取」。专业过线不等于录取，这是两回事。把过线写成录取的，是常见套路。\n\n第四，敢不敢让你核对。名字可以打码，但学校、专业、年份要对得上。\n\n还有一个小办法：问他要三年的名单。只给一年的，可能那一年最好。\n\n家长常问：名单会不会造假？有可能。所以要看细节：学校分布、专业分布、有没有重复的名字。\n\n还有人问：能不能问在读学生？能，这是最直接的办法。\n\n成绩这件事，越具体越可信。越笼统，越要打问号。\n\n记住一句话：敢给你看全部的，通常不会太差。\n\n验证的办法很土：要一张录取通知书的照片，看学校和专业对不对得上。真的不怕看，假的会绕。\n\n还有，问一句：这个名字能不能对上学校？对不上，就是有问题。", "shoot": ["名单公示墙", "录取通知书一角", "手机里放大的名单"], "cost": "20 分钟", "tags": "#美术生 #央美附中 #附中备考 #美术中考"}, {"id": "B16", "cat": "B", "title": "画室说的升学率怎么看水分", "form": "图文", "hook": "升学率的分母，藏在哪", "copy": "画室说的升学率，怎么看水分？\n\n先问一句：分母是什么。\n\n分母有三种算法。\n\n第一种，按报考人数算。考上的除以报考的，这个最实。\n\n第二种，按全部学生算。包括中途退出的、转班的，分母变大，比例就低。\n\n第三种，按「拿到证的人数」算。这个最容易做文章，因为一个人可以拿好几个证。\n\n还有一种更隐蔽的：把「专业过线」算成「录取」。\n\n所以看升学率，要连着问三个问题：多少人报考？多少人过线？多少人录取？\n\n三个数字对得上，才可信。\n\n家长常问：那看什么最靠谱？看名单。名单是具体的，比例是可以算的。\n\n还有人问：别家说 90% 录取，可信吗？先问分母。分母小，90% 也可能只有几个人。\n\n数字不会骗人，但算法会。\n\n问完三个数字，你基本就能判断这家实不实。\n\n举个例子：一家说 90% 录取，一問，全年只有 10 个学生，9 个考上。数字是真的，但跟你想的不是一回事。\n\n如果对方不愿意给三个数字，基本可以判断：他自己也没算清楚。", "shoot": ["计算器特写", "名单和人数对照", "表格上圈出分母"], "cost": "20 分钟", "tags": "#美术生 #央美附中 #附中备考 #美术中考"}, {"id": "B17", "cat": "B", "title": "怎么辨别央附嫡系教学是真是假", "form": "图文", "hook": "「嫡系教学」四个字，怎么验", "copy": "怎么辨别「央附嫡系教学」是真是假？\n\n别看宣传语，看四样东西。\n\n第一，老师的履历。是不是央美或者央美附中毕业的？有没有在附中任教过？任教过多久？这些要能说出来。\n\n第二，课程表。是不是按附中的考试科目排的？素描石膏像、色彩静物、场景速写、书法，四科有没有都开。\n\n第三，真题。有没有近几年的附中真题？有没有按真题做过模拟考？\n\n第四，评卷标准。月考是不是按附中的标准评？能不能说出分档的依据？\n\n四样都有，才算得上「按附中的路子教」。\n\n只有一句「我们的老师来自央美」，不够。\n\n家长常问：老师是央美毕业的就够了吗？不够。会画不等于会教，会教不等于懂附中考试。\n\n还有人问：有没有内部关系？据我所知，附中招生是统一考试、统一评卷，没有内部名额这回事。\n\n「嫡系」不是血统，是方法。\n\n宣传可以夸张，课程表不会。\n\n真正的附中标准课，作业是有明确要求的：三个小时、指定角度、指定光线。不是随便画一张就算。", "shoot": ["教师履历页", "课堂上课场景", "附中真题册"], "cost": "20 分钟", "tags": "#美术生 #央美附中 #附中备考 #美术中考"}, {"id": "B18", "cat": "B", "title": "附中备考一年要花多少钱（费用明细）", "form": "图文", "hook": "备考一年，钱花在哪", "copy": "附中备考一年要花多少钱？\n\n先说明：具体金额每家画室不一样，我不报虚数。这里只讲钱花在哪。\n\n第一，学费。长期班、先行班、假期班，价格不同。问清楚是按月还是按学期，含不含文化课。\n\n第二，住宿和吃饭。脱产集训大多要住校，这部分是固定开销。\n\n第三，画材。素描纸、颜料、笔、画板、画架。色彩最费颜料，速写最费纸。\n\n第四，写生和看展。有的画室包含在学费里，有的另收。\n\n第五，考试相关。报名费、路费、住宿，考前要去考点。\n\n家长常问：能不能只报专业课，文化课自己学？可以，但要确认孩子真能自己学。\n\n还有人问：贵的一定好吗？不一定。看师生比、看老师履历、看评卷标准。\n\n问价的时候，别只问总价。问清楚包含什么，不包含什么。\n\n便宜和贵，差在细节里。\n\n把钱花在老师身上，比花在装修上值。\n\n两个家庭，预算差不多。一家把钱花在大画室的大班，一家花在小班。最后小班那个孩子改画次数多，进步快。钱花在哪，结果不一样。", "shoot": ["费用清单，项目列清楚", "画材店货架", "宿舍和食堂"], "cost": "20 分钟", "tags": "#美术生 #央美附中 #附中备考 #美术中考"}, {"id": "B19", "cat": "B", "title": "长期班/先行班/寒暑假班/周末班，到底该上哪个", "form": "图文", "hook": "五个班型，别选错", "copy": "长期班、先行班、寒暑假班、周末班，到底该上哪个？\n\n看孩子现在几年级。\n\n五年级到初二：假期班或者周末班。按基础分班，主要打基础，不急着应试。\n\n初二学年内：可以先上先行班。提前适应脱产集训的节奏，随到随学。\n\n初三应届：上应届班，十个月脱产集训，按附中考试科目系统训练。\n\n往届初三：上复读班，也是十个月，但重点在补上一年的短板。\n\n选班型，核心看两点：时间够不够，基础够不够。\n\n时间够、基础弱，选长一点的班；时间紧、基础好，选冲刺型的班。\n\n家长常问：先行班和应届班有什么区别？先行班是提前适应，应届班是完整冲刺。\n\n还有人问：能不能直接上应届班？可以，但基础差的孩子会跟不上。\n\n班型不是越贵越好，是越合适越好。\n\n选班之前，先问一句：我孩子现在最缺什么。\n\n有个孩子基础弱，家长非要上冲刺班。上了两个月跟不上，又转回长期班，时间全浪费了。班型选错，比不学还亏。\n\n选班之前，问清楚每天几张画、几次改画。这比班型名字实在。", "shoot": ["班型表，五行", "不同班上课场景", "课表对比"], "cost": "20 分钟", "tags": "#美术生 #央美附中 #附中备考 #美术中考"}, {"id": "B20", "cat": "B", "title": "孩子五六年级，现在该做什么准备", "form": "图文", "hook": "五六年级，别急着画石膏像", "copy": "孩子五六年级，现在该做什么准备？\n\n三件事，按顺序来。\n\n第一，打基础。几何体、静物、简单的石膏，把形画准，把黑白灰看懂。别一上来就画头像。\n\n第二，养习惯。每天画一点，哪怕半小时。重点是坐得住，不是画得多。\n\n第三，保文化课。语数外是底子，别因为画画落下。\n\n这个阶段，最忌讳的是提前应试。天天练附中真题，孩子会烦，基础也不牢。\n\n家长常问：要不要现在就去北京？不用。这个阶段，本地有好老师就够。\n\n还有人问：怎么判断孩子有没有天赋？看两点：他愿不愿意画，他能不能改。愿意画是兴趣，能改是能力。\n\n五六年级的任务，不是考上，是准备好。\n\n基础打牢，初三才跑得起来。\n\n这个阶段慢一点，后面快得起来。\n\n五年级的周末，两小时画画，一小时文化，剩下时间玩。别排满。这个年纪，兴趣比进度重要。\n\n如果孩子已经在学，就盯一件事：形准不准。形准了，后面学什么都快。\n\n五六年级最该做的，是把「每天画一点」变成习惯。", "shoot": ["小学生画几何体", "孩子在画室上课", "家长等候区"], "cost": "20 分钟", "tags": "#美术生 #央美附中 #附中备考 #美术中考"}, {"id": "B21", "cat": "B", "title": "附中备考倒推时间轴（几月做什么）", "form": "图文", "hook": "从四年级到考试，每年做什么", "copy": "附中备考的时间轴，倒推给你。\n\n四到五年级：了解附中，看作品，判断孩子喜不喜欢。可以上寒暑假班。\n\n六年级：打基础。几何体、静物、石膏，把形和黑白灰解决掉。\n\n初一：继续基础，开始接触石膏像。文化课不能松。\n\n初二：关键的一年。可以进先行班，提前适应集训节奏。专业课加量，文化课保持。\n\n初三上学期：进入集训。素描、色彩、速写、书法四科同时推。\n\n初三下学期到四月：模拟考、卡时间、调状态。\n\n五月初：考试。\n\n这条时间轴，每一步都不能省。\n\n家长常问：能不能跳步？可以跳，但后面要补。跳得越多，补得越吃力。\n\n还有人问：初二才开始，来得及吗？来得及，但每一天都要用上。\n\n时间轴不是用来吓人的，是用来对照的。\n\n现在在哪一步，下一步该干什么，一目了然。\n\n每半年对一次时间轴，别等到初三才发现落后。\n\n最常见的拖延，是初二觉得还早，初三发现来不及。初二那一年，是整条时间轴上最值钱的一年。\n\n现在对一次，比考完后悔强。", "shoot": ["时间轴手绘图", "各阶段课表", "附中考试日历"], "cost": "20 分钟", "tags": "#美术生 #央美附中 #附中备考 #美术中考"}, {"id": "B22", "cat": "B", "title": "附中的心理测评会问什么", "form": "图文", "hook": "心理测评，问的不是分数", "copy": "附中的心理测评会问什么？\n\n先说清楚：测评不是考试，不计分，也不影响录取。\n\n它问的多是这些：最近睡得好不好，食欲怎么样，情绪波动大不大，考试前会不会紧张到睡不着，和家里沟通顺不顺。\n\n为什么问这些？因为备考压力大，有些问题早发现，比晚发现好。\n\n很多孩子不会主动说「我撑不住」。他们怕被当成矫情，怕被劝退。\n\n测评给了一个开口的机会。\n\n家长常问：填了会不会对孩子不利？不会。它是教学参考，不进档案，不对外。\n\n还有人问：孩子填得不真实怎么办？所以测评之后要有一对一聊，老师能听出来。\n\n心理这件事，宁可信其有。\n\n一个孩子状态崩了，画得再好也发挥不出来。\n\n孩子不说，不代表没事。\n\n测评之后，如果发现孩子睡眠差、情绪低，我们会调整训练量，也会跟家长沟通。发现问题不是坏事，藏着才是。\n\n家长也别把测评当诊断。它只是一个提醒，真正的判断要靠老师长期观察。\n\n测评不是给孩子贴标签，是给老师提个醒。提醒了，才顾得上。", "shoot": ["测评表局部，栏目可见", "老师和学生谈话", "档案柜"], "cost": "20 分钟", "tags": "#美术生 #央美附中 #附中备考 #美术中考"}, {"id": "B23", "cat": "B", "title": "考附中的孩子后来都去哪了", "form": "图文", "hook": "附中毕业，不是终点", "copy": "考附中的孩子，后来都去哪了？\n\n大部分继续考大学。\n\n附中的出口，一是艺术院校，中央美院、清华美院这类；二是综合类大学，人大、中传这样的学校也有不少。\n\n附中不是终点，是把选择权往后延了四年。\n\n这四年里，孩子会知道自己到底喜欢造型、设计，还是别的方向。\n\n四年后他能选的路，比现在多。\n\n家长常问：附中毕业是不是只能画画？不是。设计、建筑、影视、动画，很多方向都能走。\n\n还有人问：附中毕业考大学容易吗？不轻松。附中给的是专业底子，文化课还得自己抓。\n\n我见过附中毕业又回来的孩子。他说附中四年最大的收获，不是画得多好，是知道怎么自己学。\n\n这个能力，比一张录取通知书值钱。\n\n选附中，是选一种长大方式。\n\n还有一个数据：附中毕业生里，相当一部分进了综合类大学。这说明它的出口不只是美院。\n\n还有个孩子，附中毕业后转去学建筑。他说附中教他的不是怎么画房子，是怎么看空间。专业是底子，路可以拐弯。别把附中当成一条窄路。", "shoot": ["毕业展现场", "大学录取榜", "校友作品"], "cost": "20 分钟", "tags": "#美术生 #央美附中 #附中备考 #美术中考"}, {"id": "B24", "cat": "B", "title": "为什么要提前半年上先行班", "form": "图文", "hook": "提前半年，不是提前学", "copy": "为什么要提前半年上先行班？\n\n因为半年不是用来学新东西的，是用来改错的。\n\n一个孩子带着错误的习惯来，前三个月基本都在改。等改完，只剩三个月冲刺。\n\n晚来半年，不是少学半年，是少了改错的时间。\n\n我举个具体的。有个孩子，在别的地方学了两年，画得很熟。但起稿全靠感觉，形一错，后面全错。\n\n他来的时候，我们让他从几何体重新画。他不服，说我都画两年了。\n\n画了一个月，他自己服了。因为他发现，以前那些熟，是错的熟。\n\n改一个错误习惯，比教一个零基础难三倍。因为手已经记住了错的。\n\n所以先行班不是提前学，是提前改。\n\n家长常问：孩子基础好，还需要先行班吗？基础好更要来。基础越好，错得越深，改起来越疼。\n\n还有人问：能不能只来三个月？能，但那是冲刺班，不是先行班。\n\n早来的孩子，改完还有时间冲刺；晚来的，改完就上考场了。\n\n先行班的另一个作用，是让孩子提前知道集训有多累。知道了，正式集训时不至于崩。\n\n还有，先行班名额不是随时有，越晚越被动。想上的家庭，最好初二上学期就问清楚。", "shoot": ["白板上画时间轴", "先行班上课场景", "学生改画前后对比"], "cost": "20 分钟", "tags": "#美术生 #央美附中 #附中备考 #美术中考"}, {"id": "B25", "cat": "B", "title": "附中考不上还有哪些退路", "form": "图文", "hook": "考不上，还有四条路", "copy": "附中考不上，还有哪些退路？\n\n至少四条。\n\n第一，统考。走省内美术统考，考综合类大学的美术专业。这条路最稳，但要提前转训练方向。\n\n第二，普高美术班。先上普通高中，再走艺考。文化课压力大，但选择面宽。\n\n第三，美职。美术类职业院校，方向更具体，就业导向强。\n\n第四，复读。第二年再考附中。适合自己不甘心、知道差在哪的孩子。\n\n这四条，没有哪条是「差的选择」。\n\n我见过统考走出来的孩子，后来读了很好的大学。也见过复读两年才考上的。\n\n关键是别在孩子最崩溃的时候谈退路。那时候说什么，他都听不进去。\n\n家长常问：要不要提前告诉孩子有退路？要，但别在考前说。考完再说。\n\n还有人问：考不上是不是很丢人？不丢人。两千个人左右抢两百个名额，没考上很正常。\n\n路不止一条，别把一次考试当成判决。\n\n如果孩子坚决不复读，别逼。复读要自己愿意，被逼的一年，大概率还是白费。\n\n家长先把四条路摸清楚，孩子才有得选。你自己都慌，孩子更慌。", "shoot": ["四条路手写清单", "统考考场", "普高美术班课堂"], "cost": "20 分钟", "tags": "#美术生 #央美附中 #附中备考 #美术中考"}, {"id": "B26", "cat": "B", "title": "报考附中要准备哪些材料（报名+录取）", "form": "图文", "hook": "报名材料，一样都不能少", "copy": "报考附中要准备哪些材料？\n\n按往年流程，分两步：先报名，再交录取材料。\n\n第一步，报名。在艺术升网站或者 APP 上报，报名费 260 元。四月上旬填信息，中旬确认，月底打印准考证。\n\n第二步，考试。自备颜料、画具、四开画板和 2B 铅笔。考试用纸和画架由学校提供。\n\n第三步，录取后交材料。包括中考成绩单和准考证、加盖公章的录取登记表、体检表和肝功能化验单、户口卡和身份证复印件。往年要求七月十一日中午前寄达。\n\n这些是最容易出岔子的地方。\n\n每年都有家长在最后一天发现少一张表，或者快递没赶上。\n\n我的建议是：提前一个月把清单打印出来，交一样划一样。\n\n家长常问：每年都一样吗？不一定，以当年招生简章为准。\n\n还有人问：材料能不能后补？尽量别赌。\n\n考试考的是孩子，材料考的是家长。\n\n材料清单我建议打印两份，一份放家里，一份放包里。丢一份还有一份。\n\n另外，所有材料留一份电子扫描件。丢了能补，时间补不回来。", "shoot": ["材料清单逐项拍", "报名网站截图", "快递单特写"], "cost": "20 分钟", "tags": "#美术生 #央美附中 #附中备考 #美术中考"}, {"id": "B27", "cat": "B", "title": "附中的作息和作业量是什么样的", "form": "图文", "hook": "四年，拼的是体力", "copy": "附中的作息和作业量，是什么样的？\n\n专业课加文化课，双线走。\n\n专业课占大头，素描、色彩、速写、设计都要学。文化课按高考要求开，语数外和文综都要跟上。\n\n作业量不小。专业课有长期作业，也有短期练习。文化课有正常的作业和考试。\n\n不是「天天画画不用学文化」，恰恰相反。\n\n四年下来，拼的是时间和体力。\n\n有孩子刚去的时候不适应，觉得比画室还累。因为画室只盯考试，附中要你全面发展。\n\n家长常问：孩子能受得了吗？大部分能，前提是喜欢画。不喜欢，四年很难熬。\n\n还有人问：能不能不住校？可以申请走读，但住校更能融入节奏。\n\n附中不是轻松的地方，是让人长大的地方。\n\n如果孩子连每天八小时都坐不住，先别急着去附中。先把坐功练出来。\n\n附中有宿舍和食堂，生活节奏比在家规律。规律这件事，本身就是训练。家长别只看孩子画了多少张，看他第二天有没有精神。\n\n我见过撑不住的，也见过越读越稳的。差别不在天赋，在喜不喜欢。", "shoot": ["附中课表", "画室晚自习", "宿舍熄灯"], "cost": "20 分钟", "tags": "#美术生 #央美附中 #附中备考 #美术中考"}, {"id": "B28", "cat": "B", "title": "家长陪读有必要吗", "form": "图文", "hook": "陪读，解决不了自觉", "copy": "家长陪读有必要吗？\n\n看孩子，不看家长。\n\n适合陪读的孩子：自理能力弱、情绪波动大、身体不太好。\n\n不适合陪读的孩子：自己能管自己，只是家长不放心。\n\n陪读能解决生活问题，解决不了自觉问题。\n\n我见过陪读的家长，每天接送、做饭、盯着画。孩子反而更依赖，一没人盯就停。\n\n也见过不陪读的孩子，自己洗衣服、自己安排时间，第二年明显成熟。\n\n家长常问：不陪读，孩子会不会学坏？看学校管理，也看孩子底子。附中在北京，环境不差。\n\n还有人问：陪读要不要租在学校旁边？如果要陪，越近越好，省下来的时间都是孩子的。\n\n陪读是辅助，不是替代。\n\n孩子总要自己长大，早一点比晚一点好。\n\n陪读的家长最容易犯一个错：把焦虑传给孩子。你越盯，他越紧。\n\n陪读前先问孩子一句：你希望我陪吗。他说不用，你就别去。他不说，你就观察：衣服会不会洗，钱会不会花，时间会不会排。这三样会了，就不用陪。\n\n早一点放手，比晚一点好。放手不是不管，是换个方式管。", "shoot": ["校门口接孩子的家长", "出租屋书桌", "学生在宿舍画画"], "cost": "20 分钟", "tags": "#美术生 #央美附中 #附中备考 #美术中考"}, {"id": "B29", "cat": "B", "title": "怎么跟孩子谈万一考不上", "form": "图文", "hook": "谈考不上，别在考前谈", "copy": "怎么跟孩子谈「万一考不上」？\n\n第一，别在考前谈。\n\n考前谈退路，孩子会理解成「你不相信我」。\n\n第二，考完再谈，而且要具体。\n\n别说「考不上也没关系」，这句话太虚。孩子会觉得你在安慰他。\n\n要说具体的：考不上，我们可以走统考，也可以复读，还可以上普高。每条路大概是什么样，家里能支持到哪一步。\n\n第三，把决定权还给他。\n\n复读还是走统考，让他自己选。他选了，才会认。\n\n家长常问：孩子考完就哭，怎么办？先别讲道理，让他哭完。哭完再吃饭，吃完再说。\n\n还有人问：要不要提前准备plan B？要，但别让孩子知道你在准备。你自己心里有数就行。\n\n退路是给大人的定心丸，不是给孩子的压力。\n\n考完那天，先抱一下，再说别的。\n\n有一年，一个孩子考完跟我说，老师我最怕的不是没考上，是我妈失望。这句话我记到现在。\n\n孩子考完那几天，家里最好安静一点。别急着问，别急着分析。等他自己开口。他开口的第一句话，往往才是真心话。", "shoot": ["家长和孩子坐在沙发上", "窗外夜景", "孩子的手"], "cost": "20 分钟", "tags": "#美术生 #央美附中 #附中备考 #美术中考"}, {"id": "B30", "cat": "B", "title": "备考附中最容易踩的 5 个坑", "form": "图文", "hook": "备考附中，五个坑", "copy": "备考附中，最容易踩的五个坑。\n\n第一个，只练素描。附中要考色彩、速写、书法，只练一科，其他三科拉分。\n\n第二个，只画完整的画，不练局部。考试时间有限，局部画不好，整张就废。\n\n第三个，不做模拟考。平时画得好，一上考场就乱，因为没有按时间练过。\n\n第四个，文化课停太早。文化过线是门槛，停了就退。\n\n第五个，跟着感觉换老师。今天听这个，明天听那个，方法打架，孩子无所适从。\n\n这五个坑，每一个都能让一年的努力打折。\n\n家长常问：哪个坑最致命？第三个。因为只有它平时看不出来。\n\n还有人问：怎么避免？把考试科目列出来，每个月对一次，缺什么补什么。\n\n备考不怕慢，怕偏。\n\n第五个坑最隐蔽。换老师不是不行，但要换方法，不是换说法。\n\n每个月对一次科目表，比考前突击强。缺哪科补哪科，别靠感觉。还有，别同时改三个毛病。改一个，稳一个。一次一个，一年也能改十二个。\n\n备考不怕慢，怕偏。偏了，越努力越远。方向对了，慢也是快。", "shoot": ["五个坑手写清单", "画室里学生改画", "课表"], "cost": "20 分钟", "tags": "#美术生 #央美附中 #附中备考 #美术中考"}, {"id": "B31", "cat": "B", "title": "选画室最该问的 7 个问题（附答案）", "form": "图文", "hook": "选画室，问这七个问题", "copy": "选画室，最该问的七个问题。\n\n第一，你们每年有几个考附中的？答得含糊，说明不是主攻方向。\n\n第二，能不能看完整名单？包括没考上的。\n\n第三，老师是什么背景？有没有在附中任教过？\n\n第四，课程怎么排？四科都开吗？书法谁教？\n\n第五，一个月考几次？按什么标准评？\n\n第六，一个班多少人？老师能改到每个孩子吗？\n\n第七，孩子跟不上怎么办？有没有分班或者补课机制？\n\n七个问题问完，基本能判断这家画室专不专业。\n\n家长常问：问这么细，会不会显得不信任？不会。专业的画室，欢迎你问。\n\n还有人问：价格要不要问？要，但放在最后。先看对不对，再看贵不贵。\n\n选画室，是选一个教孩子的人。\n\n问完七个问题，再看一眼教室：孩子在画，老师在不在旁边走。这个细节骗不了人。\n\n问的时候记笔记，回来对比。别当场被说服。销售的话都一样，细节不一样。七个问题，答不上三个的，基本可以排除了。", "shoot": ["七个问题清单", "画室课堂", "成绩公示墙"], "cost": "20 分钟", "tags": "#美术生 #央美附中 #附中备考 #美术中考"}, {"id": "B32", "cat": "B", "title": "附中和美职、普高美术班的区别", "form": "图文", "hook": "三条路，三种人生节奏", "copy": "附中、美职、普高美术班，有什么区别？\n\n附中：四年制中专，专业训练为主，文化课保证过线，出口是艺考。适合确定要走专业路的孩子。\n\n美职：美术类职业院校，方向更具体，比如设计、动画、工艺。适合想早点接触职业的孩子。\n\n普高美术班：先上普通高中，文化课为主，美术是特长。适合文化课不错、还没想清楚的孩子。\n\n三条路，没有高低，只有适配。\n\n附中给的是专业深度，美职给的是职业技能，普高给的是选择余地。\n\n家长常问：哪条路考大学更容易？没有绝对。附中专业强，但文化要过线；普高文化强，但专业训练时间少。\n\n还有人问：能不能先上普高，再考附中？不行。附中招的是初中毕业生。\n\n选路之前，先问孩子：你想现在就专业，还是想再等等。\n\n这个答案，比任何排名都重要。\n\n选哪条路，最好在孩子初二结束前定。拖到初三，三条路都变窄。\n\n三条路都能走通，怕的是走到一半才换。换路不可怕，可怕的是没有准备。提前一年想清楚，比事后补救便宜。", "shoot": ["三条路对比表", "附中校园", "普高美术班"], "cost": "20 分钟", "tags": "#美术生 #央美附中 #附中备考 #美术中考"}, {"id": "C1", "cat": "C", "title": "3 小时周测，从起稿到完成", "form": "视频", "hook": "三个小时，画不完的人不是手慢", "copy": "周测三个小时，交卷铃响，还有四个人没画完。\n\n不是手慢。我看了他们的过程，三个人都死在同一个地方：起稿改了又改。\n\n三个小时怎么分？我要求起稿十五分钟，铺大关系四十分钟，深入九十分钟，最后留二十分钟退远看。\n\n十五分钟起稿，意思是到点必须停。形不准也往下画。很多孩子做不到，一笔不对就擦，擦完再起，四十分钟过去了，纸还是白的。\n\n我常说一句话：考试不是让你画一张完美的画，是让你在规定时间里交出完整的一张。\n\n完整，比完美重要。\n\n去年有个孩子，平时画得细，一到周测就画不完。我让他做了一件事：起稿只许用十分钟，到点必须开始铺色。他难受了一个月，第二个月就顺了，最后考试提前二十分钟交卷。\n\n深入那九十分钟，也不是越细越好。先画主要的，再画次要的。很多人反过来，把一个苹果画到极致，背景还是白的。\n\n最后二十分钟，我要求所有人站起来，退到三米外看。看什么？看黑白灰够不够，看主体突不突出，看有没有哪个地方脏了。\n\n这一步，大部分人舍不得花。他们宁愿再画两笔。\n\n家长常问：孩子在家画一天也画不完，是不是磨蹭？先别定性。让他把过程录下来，看看时间花在哪。多半不是磨蹭，是没有时间概念。\n\n还有人问：要不要给孩子掐表？要，但要掐在起稿上，不是掐在整体上。起稿一慢，后面全乱。\n\n三个小时考的不是手，是取舍。舍不得停笔的人，最后都交不完整。\n\n上个月有个女孩，起稿特别认真，一笔不对就擦，橡皮把纸擦破了两张。她妈妈说，这孩子做事就是这样，认真。\n\n我说认真是好事，但考试有考试的节奏。后来我给她定了个规矩：每张画只许用一块橡皮，用完了就不许擦。她第一周很难受，第二周开始，下笔反而准了。\n\n因为知道自己没有退路，她就开始想清楚再画。", "shoot": ["开场拍墙上的挂钟，指针清楚", "俯拍一排画板，四张明显没画完", "收卷时拍手把画纸抽走"], "cost": "30 分钟", "tags": "#美术生 #央美附中 #美术生的日常 #画室"}, {"id": "C2", "cat": "C", "title": "一张色彩静物被改出来的全过程", "form": "视频", "hook": "一张色彩静物，我改了四十分钟", "copy": "这张色彩静物，我改了四十分钟。学生坐在旁边看，一句话没说。\n\n我先没动颜色。我把画退远，问他：你觉得这张画，哪个地方最亮？\n\n他说不上来。这就是问题。\n\n一张色彩画，先看黑白灰，再看冷暖，最后才看细节。顺序反了，越画越脏。\n\n我改的第一步，是把所有高光压掉。他原来在每个果子、每个罐子上都点了高光，画面到处在闪，反而没有主体。\n\n第二步，改暗部。他的暗部用了很多颜色，红里加绿，绿里加紫，看着热闹，其实全糊在一起。我让他把暗部统一成一个偏冷的深色，只在反光处留一点变化。\n\n第三步，才是冷暖。桌面偏暖，背景偏冷，主体受光偏暖，暗部偏冷。这个关系一立，画就站住了。\n\n改完，他问我：老师，那我原来画的那些细节呢？\n\n我说细节还在，只是现在它们有地方待了。\n\n很多孩子学色彩，一上来就学调色配方，苹果怎么调，罐子怎么调。配方记了一堆，画面还是灰。因为他不知道整体要什么。\n\n色彩不是颜色多，是关系对。\n\n家长常问：孩子色彩总是脏，是不是颜料不好？多数时候不是。是暗部颜色太杂，或者反复叠加，把纸磨死了。\n\n还有人问：要不要让孩子多临摹？要，但临摹之前先看。看原作哪里亮、哪里暗、哪里冷、哪里暖。看不出来，临摹就是抄颜色。\n\n一张画改四十分钟，不是为了画得好看，是为了让他知道，问题出在顺序上。\n\n有个家长问我，孩子在家画色彩，画到一半就烦，是不是没耐心。我说不是烦，是他看见画面乱了，但不知道怎么救。\n\n会救的人，知道先停，退远，找最关键的那个问题。不会救的人，就继续往上涂，越涂越乱。\n\n所以改画这件事，我现在让学生自己先说：你觉得哪里不对。说得出来，我就让他自己改；说不出来，我才动手。\n\n我动手的时候也不全改，只改一块，剩下的他自己来。全改了，他下次还是不会。", "shoot": ["原画和改后的画并排，机位不动", "改画时只拍手和笔，不拍脸", "最后退远，两张画同框"], "cost": "30 分钟", "tags": "#美术生 #央美附中 #美术生的日常 #画室"}, {"id": "C3", "cat": "C", "title": "月考评卷现场", "form": "视频", "hook": "月考评卷，五个老师吵了半小时", "copy": "月考评卷，五个老师吵了半个小时。\n\n吵的不是谁教得好，是两张画该放二档还是三档。\n\n我们的评卷方式，是先分档，再细评。所有人先把画分成五摞，一档最好，五档最差。分完再一张张调。\n\n分档的时候不许说话，各自看，各自放。放完再对。对不上，就吵。\n\n为什么要吵？因为标准不吵不清楚。\n\n有一张画，形很准，但画面灰。一个老师说要上二档，一个说只能三档。最后大家的结论是：形准是基本功，灰是观察问题，放在三档，但要在评语里写清楚。\n\n这张画的孩子，后来专门来找我看评语。他以为自己是形不准，练了一个月形，没用。真正的问题是明暗关系没拉开。\n\n评卷最怕的，是老师凭印象打分。印象好的孩子，画得平一点也能上；印象差的孩子，画得好一点也被压。\n\n所以我们有一条规矩：评卷不看名字。画纸背面只写编号。\n\n家长常问：画室内部排名准不准？只能当参考。它反映的是这一个月，不是最后那场考试。\n\n还有人问：孩子分数忽高忽低，正常吗？正常。月考题不一样，评卷老师也不完全一样。看趋势，别盯一次。\n\n吵半小时，是为了让每一档都站得住。孩子拿到的不只是一个分数，是一个能改的方向。\n\n有一年评卷，两个老师为一张画争了四十分钟。那张画构图很怪，主体偏到边上。一个老师说要扣分，一个说这是学生的想法。\n\n最后我们把它放在三档，评语写了两句话：构图有想法，但画面失衡。\n\n第二年，那个孩子考上了。他回来说，就是那句「失衡」让他记了半年。\n\n评语比分数有用。分数只告诉你高低，评语告诉你往哪走。\n\n评完卷，学生来问分数。我们只给评语，不给排名。因为分数会过去，评语能带走。\n\n评语我要求写具体：哪里丢了分，怎么补。写「继续努力」的，我会让他重写。", "shoot": ["五张画铺在地上，围一圈", "老师手指点在两张画之间", "最后把画分档，摞成五摞"], "cost": "30 分钟", "tags": "#美术生 #央美附中 #美术生的日常 #画室"}, {"id": "C4", "cat": "C", "title": "一个学生 30 天的进步对比", "form": "视频", "hook": "30 天，他没变得更好看", "copy": "这个孩子三十天的两张画，我贴在墙上。\n\n第一眼看，你会觉得没什么变化，甚至第二张还丑一点。\n\n但你看三个地方。\n\n第一，形。三十天前，他的罐子口是歪的，左右不对称。现在还有一点歪，但已经能站住。\n\n第二，明暗交界线。以前他是一条线画到底，硬的软的一个样。现在他知道转折的地方要实，往后要虚。\n\n第三，画面的整体关系。以前他每个东西都画得很用力，画面平。现在他知道主体要重，背景要退。\n\n这三样，家长一般看不出来。家长看的是像不像、细不细。\n\n所以很多孩子进步了，家长觉得没进步，孩子也觉得自己没进步，然后放弃。\n\n我贴这两张画，就是想让他们看见：进步不是变得好看，是变得知道自己在干什么。\n\n三十天里，他有十天是在退步的。第十天到第二十天，画得比原来还差。因为他在改起稿方式，手不熟。\n\n那段时间他妈妈说，要不要停一停。我说不用，再给他十天。\n\n第二十五天，他自己画顺了。\n\n家长常问：怎么判断孩子有没有进步？别只看完成品。看他起稿是不是更快，看他能不能说出自己哪里没画好。\n\n还有人问：进步慢是不是没天赋？三十天看不出天赋，只能看出方法对不对。\n\n两张画贴在一起，不是为了对比好看，是为了让一个孩子相信，他那二十天的难看是有用的。\n\n他妈妈后来跟我说，那二十天她天天想让孩子停。看着孩子越画越差，心里受不了。\n\n我说我理解。但改方法这件事，一定有一段难看期。就像换手写字，刚开始比原来还丑。\n\n家长能做的，不是催，也不是夸，是别在那段时间做判断。\n\n很多孩子不是败在不会，是败在改到一半，被大人叫停了。\n\n他妈妈看完两张画，说了一句：原来他不是没变，是我没看见。这句话我记了很久。\n\n他妈妈后来跟我说，看得见变化，比变化本身重要。", "shoot": ["两张画并排，一张发灰一张结实", "学生站在画前的背影", "手指点在同一个位置对比"], "cost": "30 分钟", "tags": "#美术生 #央美附中 #美术生的日常 #画室"}, {"id": "C5", "cat": "C", "title": "素描从 60 分到 85 分，改了什么", "form": "视频", "hook": "60 分到 85 分，只改了三个地方", "copy": "这张素描，一个月前六十分，现在八十五分。\n\n我没让他多画，只改了三个地方。\n\n第一，形的比例。他以前画头像，先画眼睛，眼睛画得特别大。因为人看人的时候，先看眼睛。但画画不能这样，得先定头骨的长宽，再分三庭五眼。\n\n我让他前两周只画头部外轮廓和十字线，不画五官。他画得很难受，但比例慢慢准了。\n\n第二，明暗交界线。他原来的交界线是一条均匀的灰线，从头到尾一个轻重。真实的交界线是有节奏的：额结节实，颧骨实，下颌转过去要虚。\n\n我让他用手摸自己的脸，摸到骨头转折的地方，再回去画。他摸完说，原来脸不是平的。\n\n第三，排线。他以前排线很用力，一道压一道，纸都起毛了。我让他换软一点的铅笔，线排得松一点，一层一层叠。\n\n这三件事，没有一件是\"多画\"。都是\"改习惯\"。\n\n改习惯比学新东西难。因为手已经记住了错的。\n\n家长常问：孩子画得多，为什么不见涨？如果每次都在重复同一个错误，画得越多，错得越牢。\n\n还有人问：六十分到八十五分，算快吗？一个月不算快，也不算慢。真正难的是八十五到九十，那要靠感受。\n\n分数不是重点。重点是他现在拿起笔，知道先干什么。\n\n他原来还有个习惯：一画错就整张重来。一个月下来，画了二十多张，没有一张画完。\n\n我规定他一张画必须画到底，错了也在上面改。改出来的痕迹，比一张干净的废纸有用。\n\n因为痕迹会告诉你，你是在哪里想错的。\n\n现在他的画上还有很多改的印子。我不让他擦。那些印子，就是他这一个月走的路。\n\n现在他的画贴在走廊上。不是最好的那张，是他改得最多的那张。\n\n他妈妈来开家长会，站在那张画前面看了很久，说这张不像他画的。我说是他画的，只是你没见过他画成这样。孩子的变化，常常先发生在你看不见的地方。", "shoot": ["两张素描并排，局部放大", "手指点在下颌线和肩线上", "铅笔在纸上比一下比例"], "cost": "30 分钟", "tags": "#美术生 #央美附中 #美术生的日常 #画室"}, {"id": "C6", "cat": "C", "title": "速写动态问题，怎么一步步解决的", "form": "视频", "hook": "速写画得僵，问题不在速度", "copy": "这个孩子的速写，一直画得很僵。\n\n他以为是速度不够，拼命练快。一分钟一张，画了两个月，还是僵。\n\n我让他停下来，先别画。\n\n速写僵，通常不是速度问题，是没找到重心。\n\n一个人站着，重量落在哪只脚上？骨盆往哪边倾？肩膀和骨盆是不是反方向？这三件事不清楚，画出来的人就是纸片。\n\n我让他做一件事：画之前，先用一根线定重心，从脖子后面落到承重脚。这根线定完，再画三大块：头、胸腔、骨盆。\n\n三大块的关系对了，人才站得住。\n\n然后是衣纹。很多孩子一上来就画衣纹，画得越多越乱。衣纹是跟着结构走的：肩膀转折处有，肘部有，膝盖有。关节的地方密，中间的地方松。\n\n最后才是手脚。手不用画细，画出朝向和用力方式就够了。\n\n他按这个顺序练了三个星期，速度反而快了。因为不用再反复改。\n\n家长常问：孩子速写总是画不完，是不是练得少？先看他是不是在抠细节。速写考的是抓整体的能力，不是画完的能力。\n\n还有人问：要不要背动态？可以背几个常见的，但背完要能用。考试给的动作，你未必背过。\n\n速写不是画得快，是想得清。想清楚了，手自然就快。\n\n有个学生问我，老师你画速写的时候在想什么。我说我在想三件事：他站在哪，他的重量在哪，他下一步要干什么。\n\n形是结果，动作是原因。你把原因想清楚了，形自然就对了。\n\n所以我现在让学生画之前，先自己摆一遍动作。摆的时候你就知道，哪条腿在受力，哪边肩膀是高的。\n\n摆过再画，和直接照着画，是两回事。\n\n我让他把动作拆成三步：站稳、转身、抬手。拆完再画，速写就活了。\n\n三步定完，再画衣纹。衣纹不是越多越好，是跟着结构走。关节处密，中间松。这一条他练了三个星期，三个星期后，他的速写不僵了。", "shoot": ["学生速写本摊开，三张连续动作", "老师用铅笔在纸上找重心线", "学生自己站起来摆动作"], "cost": "30 分钟", "tags": "#美术生 #央美附中 #美术生的日常 #画室"}, {"id": "C7", "cat": "C", "title": "色彩调色示范（不讲解，只看过程）", "form": "视频", "hook": "这节课我不说话，只看我调色", "copy": "这节课我不讲话。你只看我调色。\n\n先看我怎么起稿。不用铅笔，直接用群青加一点熟褐，定出大形。为什么用这个颜色？因为它干得快，也不容易脏。\n\n再看铺色。我先铺的是暗部，不是亮部。暗部一定，画面就有了骨架。\n\n注意我调暗部的顺序：先取一点环境色，再加补色，最后用白提一点。不是一次调准，是一层层找。\n\n很多人调色，喜欢在调色盘上反复搅，搅到最后颜色是死的。我一般搅三下就上纸，剩下的在纸上调。\n\n纸上调出来的颜色，比盘子里调的透气。\n\n然后是亮部。亮部不要一上来就加白。白加多了，颜色会粉。先看亮部偏什么，偏黄还是偏冷，再用对应的浅色。\n\n最后是交界线。交界线不是一条深色，是一段有冷暖变化的过渡。受光那边偏暖，背光那边偏冷。\n\n整个过程我一句话没说。因为调色这件事，讲不明白，只能看。\n\n你看我的手，比听我讲十遍有用。\n\n家长常问：孩子看示范能看懂吗？看一遍看不懂，看十遍就懂了。但看的时候要带着问题看，不能当视频刷。\n\n还有人问：为什么不边画边讲？因为一讲话，手就慢，颜色就干了。示范要一气呵成。\n\n看完你可以做一件事：把视频调成零点五倍速，跟着调一遍。\n\n有学生看完问我，老师你为什么不讲。我说我讲了，你就只看我的嘴，不看我的手。\n\n调色这件事，手比嘴诚实。同一个颜色，我说一百遍「偏冷一点」，你也不知道冷多少。你看我加了多少，一次就懂。\n\n所以这条视频，我建议你存下来。画色彩卡住的时候，翻出来看一遍，比问人快。\n\n有学生跟着调了一遍，调完说，原来我一直在盘子里搅。我说对，纸上调色，颜色才透气。\n\n他现在调色，先在纸上试一笔，再上画。盘子里只搅三下。就这一个动作，画面干净了很多。动作改对了，颜色就对了。", "shoot": ["全程俯拍调色盘和笔", "字幕只标颜色关系，不解说", "最后把画推远，停三秒"], "cost": "30 分钟", "tags": "#美术生 #央美附中 #美术生的日常 #画室"}, {"id": "C8", "cat": "C", "title": "学生作业里最常见的 3 个问题（打码）", "form": "视频", "hook": "三十张作业，问题只有三个", "copy": "我把这个班三十张作业铺在地上，看了一遍。\n\n问题只有三个。\n\n第一个，形不准。不是差很多，是差一点。罐子左边比右边高半厘米，苹果的投影方向不一致。单看每一张都还行，放在一起就露馅。\n\n形不准的根子，是起稿不看整体。很多人画局部的时候很准，一退远就歪。\n\n第二个，灰。画面从黑到白，只有中间那一段。该黑的地方不敢黑，该亮的地方不敢亮。\n\n灰的根子，是怕画错。怕画黑了改不回来，所以一层一层轻轻叠，最后叠成一团。\n\n第三个，碎。哪里都画得很用力，笔触到处跳，画面没有安静的地方。\n\n碎的根子，是不知道主次。什么都想画好，结果什么都抢。\n\n这三个问题，对应三种练法。形不准，练起稿和比例；灰，练黑白灰小稿；碎，练取舍，规定自己只能画三个重点。\n\n我一般不让孩子同时改三个。先改一个，改到稳定，再改下一个。\n\n家长常问：孩子每周画这么多，为什么问题还在？因为没人告诉他问题是什么。画得多，不等于改得多。\n\n还有人问：能不能把问题写在画上？能，而且有用。写一遍，比听十遍记得牢。\n\n三十张画，三个问题。改完这三个，画面就换一个样子。\n\n我把这三十张画拍了照，按问题分成三组，贴在墙上。每个孩子进来，先找自己的画在哪一组。\n\n有个孩子找了半天，说自己好像三组都占。我说对，那你先选一个改。\n\n改一个问题，比同时改三个快。因为注意力是有限的。\n\n下个月我还会再铺一次。到时候看，还有几张在原来的组里。\n\n这三组画我贴在墙上，标上问题。下个月再看，还在原组的，说明没改。\n\n有个孩子三组都占，我让他先选一个改。他说选不出来。我说那就选最容易的，先改碎。一个月后，他的画安静了。改一个，其他两个会跟着松，这是我这些年最信的一条。", "shoot": ["把三十张画铺在地上俯拍", "挑出三张，分别指出问题", "最后把三张并排放"], "cost": "30 分钟", "tags": "#美术生 #央美附中 #美术生的日常 #画室"}, {"id": "C9", "cat": "C", "title": "户外写生：兴隆山 / 祖山", "form": "视频", "hook": "上山写生，先学的不是画树", "copy": "带学生上山写生，第一天我不让他们画树。\n\n先学看光。\n\n在教室里画静物，光是不变的。上山不一样，云一过来，整个山坡暗下去，两分钟又亮回来。你按刚才的颜色画，画完就错了。\n\n所以我让他们先做一件事：坐十分钟，只看。看影子往哪边倒，看远处的山比近处的树灰多少，看树荫里的暗是不是纯黑。\n\n看完再动笔。\n\n第二件事，是学会概括。山上的东西太碎，树叶几万片，你不能一片片画。要把它当成几块颜色：受光的、背光的、中间的。\n\n有个孩子画了一上午，画面很丰富，但退远一看，整座山是平的。因为他每一块都画得一样清楚。远处要虚，近处要实，这是空间。\n\n第三件事，是选景。不是看到什么画什么。要找一个能站住的角度：前面有个东西，中间有个东西，后面有个东西。\n\n写生不是复制风景，是组织风景。\n\n家长常问：写生对考试有用吗？有。它练的是观察和概括，这两样在考场上直接用得上。\n\n还有人问：孩子写生画得不像，是不是没学好？写生不求像，求关系对。山不像山没关系，前后关系对就行。\n\n上山三天，画技涨多少不好说，但眼睛会变。\n\n下山那天，有个孩子跟我说，老师我以前画树，都是先画树干再画叶子。现在我知道，先看整片山的明暗。\n\n我说对，这就是写生。它不教你画什么，它教你怎么看。\n\n回到教室再画静物，他起稿比以前快，因为他知道先看大的。\n\n眼睛出去走一趟，手会跟着变。\n\n下山之后，有个孩子画静物，起稿快了。他说，山里看多了，知道什么是大的。\n\n有个孩子在山上画了一张，回来贴在墙上。他说这张不好，但我知道他看见光了。后来他画静物，知道光从哪来。写生教的不是景，是光。光对了，颜色就对了。这句话我跟每一届都说。", "shoot": ["山路上学生背着画板", "树荫下的光斑，镜头扫过", "学生坐在石头上画，风吹纸"], "cost": "30 分钟", "tags": "#美术生 #央美附中 #美术生的日常 #画室"}, {"id": "C10", "cat": "C", "title": "美术馆参观课", "form": "视频", "hook": "带学生看展，我让他们先别看画", "copy": "带学生看展，进门第一件事，我让他们别看画。\n\n先看展厅。\n\n看什么？看画挂得多高，看灯从哪个方向打，看每幅画之间留了多大空。这些决定了你第一眼看到什么。\n\n然后再看画。看一幅画，先退到它能完整进眼睛的距离，看整体：什么颜色占的面积大，画面的重心在哪，哪里最亮，哪里最暗。\n\n这一步只要三十秒，但大部分人跳过。\n\n接着再走近，看笔触。看画家怎么起笔，怎么收笔，哪里厚，哪里薄。油画能看到堆叠的厚度，这是印刷品看不到的。\n\n我常让学生做一件事：选一幅画，记三个细节，出门之后凭记忆说出来。说不出来，说明只是看过，没看进去。\n\n有个孩子在一幅静物前站了二十分钟。我问他看什么，他说看桌布。桌布的褶皱画得很松，但每一道都交代了下面是什么。\n\n这就是看进去了。\n\n家长常问：孩子看展看不懂怎么办？不用懂。先看，看得多了自然懂。看不懂还愿意看，就是审美在长。\n\n还有人问：看展要不要讲解？可以听，但先自己看。先听讲解，等于先看答案。\n\n看展不是上课，是养眼睛。眼睛养好了，手才跟得上。\n\n回程的车上，我让学生每人说一幅今天记住的画。有人说颜色，有人说笔触，有个孩子说，他记住的是一张画上的空白。\n\n那张画右下角什么都没画，但你觉得那里有东西。\n\n我说你记住这个，比记住十张画的构图都有用。\n\n看展看到最后，看的不是画，是画家在哪里停手。\n\n回程车上，我让他们每人说一幅记住的画。说不出来的，说明只是走了一圈。\n\n有个孩子在一幅画前站了二十分钟，我问他看什么。他说看空白。我说你看懂了。现在他画画，敢留白了。留白不是不画，是知道哪里不用画。这一点，展览教得比课堂快。所以我每年都带他们出来。", "shoot": ["美术馆门口，学生排队进", "站在一幅画前，先看整体", "手机拍局部，再退远"], "cost": "30 分钟", "tags": "#美术生 #央美附中 #美术生的日常 #画室"}, {"id": "C11", "cat": "C", "title": "静物摆放室是怎么布置的", "form": "视频", "hook": "摆一组静物，就是出一张卷子", "copy": "这组静物，我摆了四十分钟。\n\n摆静物不是把东西放上去，是出题。\n\n第一，高度。主体罐子放在哪儿，决定了构图是稳还是险。放中间，稳，但平；放偏一点，画面就活了，但也容易倒。\n\n第二，疏密。左边三个苹果挤在一起，右边就要留空。全挤满，孩子没地方呼吸；全散开，画面又散。\n\n第三，光位。侧光出体积，顶光出结构，逆光出氛围。考场上多半是侧光，所以平时练侧光多。\n\n第四，材质。陶罐、玻璃、金属、布，四种材质放在一起，考的其实是孩子能不能区分反光、高光和质感。\n\n我摆的时候会想一件事：这组东西，最容易画错的地方在哪。\n\n比如这个玻璃杯，放在深色罐子前面，边缘会消失。孩子如果照着一个轮廓画，一定画死。他得学会用背景的深浅去挤。\n\n再比如这块衬布，褶皱很多。全画，画面就碎；不画，又空。所以要挑三到四条主要的褶，其余概括。\n\n家长常问：孩子在家没有静物怎么办？苹果、杯子、台灯，三样就够。关键是光要单一。\n\n还有人问：摆得越复杂越好吗？不是。考试不会给你一堆东西，练的是关系，不是数量。\n\n一组好静物，会让不同水平的孩子都露出问题。这才是它该干的事。\n\n有家长参观的时候问我，这些东西是不是随便摆的。我说不是，每一件都有用。\n\n那个苹果放在罐子前面，是为了挡掉一部分罐子的底，让孩子学会画遮挡关系。那块布折起来，是为了出一道难题：褶皱怎么概括。\n\n甚至灯的高度都是固定的。高一点，投影短；低一点，投影长。投影的长度，决定构图的重心。\n\n孩子画的不是东西，是关系。摆的人要想清楚，这组关系里，哪一个是主，哪一个是次。\n\n有学生试着自己摆一组，摆完说，老师这比画还难。我说对，出题比答题难。", "shoot": ["俯拍静物台，从空到摆满", "调整一个罐子的位置，画面变化", "开灯，光位移动"], "cost": "30 分钟", "tags": "#美术生 #央美附中 #美术生的日常 #画室"}, {"id": "C12", "cat": "C", "title": "晚自习的教室", "form": "视频", "hook": "晚自习不是用来画新画的", "copy": "晚自习三个小时，我不让学生画新画。\n\n白天的画已经够了，晚上用来复盘。\n\n复盘做三件事。\n\n第一，改一张。挑白天画得最差的那张，不改全部，只改一个地方。形不准改形，灰了提亮，碎了做减法。\n\n第二，看一张。看同学画得好的那张，只看一个问题：他是怎么处理背景的，或者他怎么起稿的。看一个点就够，别贪多。\n\n第三，记一条。在本子上写一句话：今天我知道了什么。不许写「我要努力」这种，要写具体的，比如「苹果的投影要跟着桌面的颜色走」。\n\n三件事做完，大概两个小时。剩下一小时，画速写。\n\n为什么不让画新画？因为白天画的东西还没消化。再画新的，只是重复。\n\n有个孩子一开始不适应，说晚上不画新画，感觉浪费时间。我说你画了三个月新画，进步了多少？他就不说话了。\n\n一个月后他跟我说，晚上改一张，比白天画三张有用。\n\n家长常问：孩子每天画到很晚，是不是很努力？时间长短不代表什么，要看他有没有停下来想。\n\n还有人问：复盘要不要家长盯？不用。你只需要问一句：今天你改了什么。他答得出来，就是有效。\n\n晚上不是用来堆量的，是用来把白天的东西变成自己的。\n\n有家长问我，孩子晚上回来还要不要画。我说不用，回来就睡。\n\n一天里能专注的时间是有限的。白天用完了，晚上硬撑，画出来的都是废笔。\n\n真正拉开差距的，不是谁睡得晚，是谁白天那八个小时没有浪费。\n\n所以我看一个孩子有没有希望，不看他画到几点，看他白天画画的时候，眼睛是不是在画上。\n\n一个月后，那个说浪费时间的孩子的画，背景第一次画完整了。\n\n那个孩子后来跟我说，晚上改一张，比白天画三张有用。我说你现在知道了。他笑了笑，继续改。复盘这件事，一开始都难受，难受是因为要面对。", "shoot": ["晚上九点的教室，灯很亮", "学生把白天的画摊在桌上", "本子上写三行字，笔尖特写"], "cost": "30 分钟", "tags": "#美术生 #央美附中 #美术生的日常 #画室"}, {"id": "C13", "cat": "C", "title": "月考颁奖", "form": "视频", "hook": "月考颁奖，第一名不上台", "copy": "月考颁奖，我们不发第一名。\n\n第一名大家都知道是谁，不用发。\n\n我们发三个奖：进步奖、稳定奖、改画奖。\n\n进步奖给名次涨得多的。稳定奖给连续三次没掉档的。改画奖给这一个月改掉一个老毛病的。\n\n为什么要这么设？因为第一名只有一个，但每个孩子都能在某件事上被看见。\n\n有个孩子，排名一直在中游，拿了稳定奖。他上台的时候愣了一下，说这是我第一次上台。\n\n还有个孩子拿了改画奖。他改的是「画什么都爱勾边」这个毛病，改了两个月。奖状上写的就是这句话。\n\n他妈妈后来把奖状拍了照，发在家庭群里。\n\n我不是反对排名。排名有用，它让人知道自己在哪。但排名不能是全部的反馈。\n\n只发第一名，结果是大部分人觉得自己跟奖没关系。时间长了，就不争了。\n\n家长常问：发这些奖，会不会让孩子不在乎名次？不会。名次还在，只是多了一个看自己的角度。\n\n还有人问：奖状有用吗？对有些孩子，一张纸能记很久。\n\n一个班三十个人，第一名只有一个。剩下的二十九个，也得有光。\n\n有一年，一个孩子拿了三次进步奖。第四次没拿，他来找我，问是不是退步了。\n\n我说不是，是你已经到了一个新台阶，进步变慢了。\n\n他说那我还能拿什么奖。我说稳定奖。\n\n后来他拿了稳定奖，比拿进步奖还高兴。因为他知道，稳定比冲一次难。\n\n有个孩子连拿三次进步奖，第四次没拿，来找我。我说你到了新台阶，进步慢了。\n\n有个孩子拿了稳定奖，下台跟我说，老师我以为只有第一名才上台。我说台上站的不止一个人。后来他每个月都盯着稳定奖。稳定比冲一次难，也比冲一次值钱。我们班墙上贴的不是排名，是三个奖的名字。", "shoot": ["奖状摊在桌上，名字打码", "学生上台领奖的背影", "黑板上一列名字，只写进步"], "cost": "30 分钟", "tags": "#美术生 #央美附中 #美术生的日常 #画室"}, {"id": "C14", "cat": "C", "title": "心理测评档案是怎么用的", "form": "视频", "hook": "心理档案不是用来筛人的", "copy": "每个孩子入学，我们做一次心理测评。\n\n不是筛人，是提前知道谁在硬扛。\n\n测评内容不复杂：睡眠、食欲、情绪波动、对考试的态度、和家里的关系。填完，老师一对一聊二十分钟。\n\n为什么要做？因为画画这件事，状态比技巧影响大。\n\n有个孩子，九月测评的时候一切正常。十一月突然画什么都画不进去，线条发抖。我们翻出他的档案，发现他填过一句：一考不好，我妈就不说话。\n\n后来我们找他妈妈聊了一次。不是指责，是告诉她，孩子把「不说话」理解成了失望。\n\n她妈妈哭了。她说我只是不知道怎么安慰。\n\n这件事之后，孩子的状态慢慢回来了。\n\n如果没有那份档案，我们可能只会觉得他不努力。\n\n档案还有一个作用：让老师知道哪些话不能说。有的孩子怕被比较，有的孩子怕被放弃。知道了，就绕开。\n\n家长常问：填这些东西，隐私怎么保证？档案只在教学组内部，不带出画室，不给孩子看。\n\n还有人问：测评准吗？不准。它只是一个提醒，不是结论。\n\n我们不是心理机构。但孩子在画室待八个小时，有些事，老师比家长先看见。\n\n有个孩子填表的时候，在「最近睡得好吗」那一栏写了「还行」。聊的时候我问他，几点睡。他说两点。\n\n我说这叫还行？他笑了一下，说习惯了。\n\n很多孩子不会主动说自己不行。他们怕被当成矫情，怕被劝退。\n\n所以这张表的作用，不是得到真话，是给他一个开口的机会。\n\n测评表上有一栏：最近有没有不想说话。有个孩子填了有，我们才知道他病了。\n\n有个孩子填「最近有没有不想说话」，写了有。我们找他聊，才知道他家里出了事。后来我们给他减了课，让他先缓过来。成绩掉了一点，人回来了。这笔账，我觉得值。心理档案不是查人，是捞人。", "shoot": ["档案柜拉开，一叠文件夹", "表格局部，只拍栏目不拍内容", "老师和孩子在走廊说话"], "cost": "30 分钟", "tags": "#美术生 #央美附中 #美术生的日常 #画室"}, {"id": "C15", "cat": "C", "title": "文化课小班上课现场", "form": "视频", "hook": "专业过了，文化掉下来的人每年都有", "copy": "每年都有这样的孩子：专业不错，文化没过线。\n\n不是差很多，差十几分。\n\n十几分，复读一年。\n\n所以我们的课表里，文化课是固定的。每天一小时，不占专业课时间，也不额外加。\n\n一小时能干什么？做一套小题，背二十个词，或者把当天的错题过一遍。\n\n不多，但每天都在。\n\n有个孩子跟我说，老师我画画的时候脑子里全是英语。我说那你就把英语放下，画完再背。他说放不下。\n\n这就是问题。不是时间不够，是两件事在脑子里打架。\n\n我们的做法是，把文化课放在固定时段。到点就学，学完就收。不让它渗到画画的时间里。\n\n画画的时候只想画，学文化的时候只想学。分开，效率反而高。\n\n家长常问：孩子专业课这么忙，文化课要不要停？不能停。停了三个月，捡回来要六个月。\n\n还有人问：要不要报外面的补习班？可以，但别加量。孩子的时间已经满了，加量只会让他两头都做不好。\n\n专业决定你能不能进门，文化决定你能不能留下。\n\n有个孩子文化课一直不错，专业课也稳。他妈妈问我，要不要把文化课停了，全力冲专业。\n\n我说不要。你停三个月，手感就没了，捡回来要更久。\n\n后来他没停，最后专业和文化都过了。\n\n他说那一小时最难受，因为画画画到一半被叫走。但也正是那一小时，让他每天有个地方换换脑子。\n\n有个孩子文化课掉了二十分，专业课却涨了。我们停了三天专业课，先补文化。\n\n有个孩子专业很好，文化一直拖。他妈妈说，能不能先顾专业。我说不能，文化是门槛。后来我们每天加半小时英语，坚持了四个月。他考上了，文化超线十二分。十二分不多，但够进门。", "shoot": ["文化课教室，黑板上一道题", "学生边画边看单词本", "课表特写，专业和文化交替"], "cost": "30 分钟", "tags": "#美术生 #央美附中 #美术生的日常 #画室"}, {"id": "C16", "cat": "C", "title": "一对一改画", "form": "视频", "hook": "改画不是替他画", "copy": "一对一改画，我只改一笔。\n\n不是舍不得改，是改多了没用。\n\n我坐下来，先问三个问题：你觉得哪里不对？你想让它变成什么样？你打算怎么改？\n\n三个问题答完，我才动笔。\n\n有的孩子说不上来，我就指一个地方：你看这里，和那里比，哪个重？他看一会儿，说这里重。我说对，那你想让哪个重？\n\n大部分时候，他自己就知道怎么改了。\n\n我动笔的时候，只改一个地方，而且改完就停。让他看着这块，想明白为什么这么改。\n\n然后剩下的，他自己来。\n\n有家长不理解，说你都坐下了，怎么不多改点。我说我改十笔，他下次还是不会。我改一笔，他可能记一辈子。\n\n改画最怕的，是老师画得太好。孩子一看，觉得老师真厉害，然后更不敢画了。\n\n所以我改的时候，故意保留他的笔触。不画得比你好太多，让你觉得这是你能做到的。\n\n家长常问：孩子总让老师改，是不是依赖？是。所以要问他，不能直接给他。\n\n还有人问：改完还是画不好怎么办？正常。改一次是知道，改十次才是会。\n\n老师的手，不能代替学生的手。\n\n有个孩子，每次改画都要我坐旁边。我不坐，他就不动笔。\n\n后来我改了个规矩：我先看，说完问题就走开，十分钟后再回来。\n\n第一次他十分钟一笔没画。第二次画了两笔。第三次，他把问题改了。\n\n他说，老师你走了之后，我才发现我只能靠自己。\n\n这句话，比他画好一张画重要。\n\n第二天，他自己改了一张。改得不对，但那是他自己改的。\n\n有个孩子改完画，第二天自己又改了一遍。改得不对，但他敢改了。我说你今天这张，比昨天那张好。他说哪里好。我说你敢自己动笔了。改画这件事，最后要交回给他。老师改一百次，不如他自己改一次。", "shoot": ["老师坐下，笔停在画面前", "只改一小块，其余不动", "学生自己接着改"], "cost": "30 分钟", "tags": "#美术生 #央美附中 #美术生的日常 #画室"}, {"id": "C17", "cat": "C", "title": "央附模拟考现场", "form": "视频", "hook": "模拟考，连进考场都练", "copy": "模拟考，我们连进考场都练。\n\n提前十分钟到，排队，出示准考证，只带允许带的东西，坐下，等发卷。\n\n听起来很简单，但每年都有孩子在这里出问题。\n\n有人忘带准考证，有人把手机带进去，有人坐下才发现画笔没削。\n\n这些事在真考场上发生，后果比画不好严重。\n\n所以模拟考按真考试的流程走：进场、发卷、开考、提醒时间、收卷。中间不许说话，不许借东西，不许提前交。\n\n收完卷，老师当场评。评完，每个孩子拿到一张纸，上面写三件事：时间够不够，画面完整不完整，最大的问题是什么。\n\n有个孩子平时画得很好，模拟考只考了六十分。因为他在考场里一直看别人，看别人画到哪了，自己就慌了。\n\n这件事在平时上课发现不了，只有模拟考能发现。\n\n家长常问：模拟考成绩重要吗？不重要。模拟考是找问题，不是定水平。\n\n还有人问：要不要多考几次？三次就够。多了会疲。\n\n真考场上的意外，最好在模拟考里先发生一遍。\n\n模拟考结束，有个孩子哭了。不是因为画得差，是因为他发现自己在考场上把时间全花在起稿上。\n\n我说这是好事，你现在知道，比四月知道强。\n\n后来我们给他定了起稿时间，练了一个月。真考试的时候，他提前十五分钟画完。\n\n模拟考的意义，就是把错误提前。错得越早，改得越从容。\n\n模拟考后，每个孩子拿到一张纸：时间够不够、画面完整不完整、最大的问题是什么。\n\n模拟考完，有个孩子在走廊哭了。他说，老师我画不完。我说现在知道，比五月知道好。后来我们给他定了起稿时间，练了一个月。第二次模拟考，他提前十五分钟画完。他说，老师原来时间是可以练的。", "shoot": ["教室门口贴考场号", "学生排队进场，只带准考证", "计时器放在桌上，数字跳动"], "cost": "30 分钟", "tags": "#美术生 #央美附中 #美术生的日常 #画室"}, {"id": "C18", "cat": "C", "title": "考前动员", "form": "视频", "hook": "考前动员，我不讲鸡汤", "copy": "考前动员，我不讲鸡汤。\n\n我只讲三件可能出问题的事。\n\n第一，笔。考试前一天，把所有笔削好，装进笔袋，多带两支。别在考场上削笔，浪费时间，还容易断。\n\n第二，纸。发下来的纸，先检查有没有破损。有，立刻举手换。别将就，一张破纸会影响你一整场。\n\n第三，时间。开考先看表，把三个小时分成四段。每段结束，抬头看一次时间。不要等老师提醒，老师提醒的时候通常已经晚了。\n\n讲完这三件，我让他们每个人说一个自己担心的事。\n\n有人说怕画不完，有人说怕旁边的人画得好，有人说怕手抖。\n\n我一个一个答。画不完的，按时间段练；怕比较的，进场后只看自己的纸；手抖的，开考前用力握拳再松开，做三次。\n\n这些都不是大道理，但能让人稳一点。\n\n最后我说了一句：明天你们进去，画你们会的，别画你们不会的。\n\n家长常问：考前要不要鼓励孩子？要，但别说过头。说「正常发挥就行」，比说「你一定行」有用。\n\n还有人问：考前一晚要不要早睡？按平时的时间睡，别刻意提前。\n\n动员不是打鸡血，是把意外提前想一遍。\n\n有个孩子问我，老师我要是考砸了怎么办。\n\n我说考砸了就来复读，或者走统考，路不止一条。\n\n他愣了一下，说你不劝我一定要考上吗。\n\n我说我劝你尽力，但不劝你把一条路当成全部。人一觉得没有退路，手就会抖。\n\n后来他考得不错。出成绩那天他跟我说，老师你那句话让我进考场的时候没那么怕。\n\n考前一天，我把教室的钟调准了。所有钟一个时间，孩子抬头看见的，都一样。\n\n考前那天，我把教室的钟都调准了，所有钟一个时间。有孩子问，为什么。我说，你们抬头看见的，得是同一个时间。他笑了，说老师你太细了。我说考试这件事，细一点没坏处。", "shoot": ["教室前排坐满，灯开着", "黑板上写三个词：笔、纸、时间", "学生低头记，不拍正脸"], "cost": "30 分钟", "tags": "#美术生 #央美附中 #美术生的日常 #画室"}, {"id": "C19", "cat": "C", "title": "结业证书 / 收藏画作证书颁发", "form": "视频", "hook": "这张证书，不发给画得最好的", "copy": "结业这天，我们发两种证书。\n\n一种是结业证书，每个人都有。\n\n另一种是收藏证书，发给作品被画室留下的孩子。\n\n收藏证书不看画得最好，看这张画有没有记录他的某个时刻。\n\n有个孩子，画得不算拔尖，但他那张素描被留下了。因为那是他第一次不用橡皮画完一张画。\n\n还有个孩子，色彩一直很脏，结业前最后一张突然干净了。那张也被留下了。\n\n证书上不写名次，写一句话：这张画记录了你在几月几号做对了什么。\n\n有家长说，这张纸有什么用，又不能加分。\n\n我说没用，但它能让孩子记住，他曾经做到过。\n\n备考这件事很长，长到人会怀疑自己。一张证书不能改变结果，但能在某个想放弃的晚上，让他想起来：我做到过。\n\n家长常问：要不要办结业仪式？要，不用隆重。发个证书，拍张照，吃块蛋糕，就够了。\n\n还有人问：没被收藏的孩子会不会失落？会。所以我们每个人都有一句评语，写他这半年最大的变化。\n\n一张纸不重，但压得住半年的辛苦。\n\n去年结业，有个孩子拿到收藏证书，站在墙边看了很久。\n\n他妈妈说，这张画是他画得最差的一张，你怎么还留着。\n\n他说，这张是我第一次没擦。\n\n我在旁边听见了，没说话。\n\n有些东西，家长看的是好坏，孩子记的是那一刻。\n\n证书上那句话，我写了三遍才定：这张画记录了你在某月某日做对了什么。\n\n有个孩子拿到证书，问我，这张纸有什么用。我说没用，但十年后你翻出来，会想起今天。他说那我留着。后来他真留着，毕业的时候带走了。证书不值钱，值钱的是那句话：你做到过。备考太长了，长到人会忘。", "shoot": ["证书摊开，名字打码", "学生双手接过", "墙上挂着一排旧证书"], "cost": "30 分钟", "tags": "#美术生 #央美附中 #美术生的日常 #画室"}, {"id": "C20", "cat": "C", "title": "学生的灵感素材库长什么样", "form": "视频", "hook": "学生的素材库，比画册有用", "copy": "这个孩子的素材库，我看了很久。\n\n不是收藏了多少画，是他怎么分类。\n\n他分了五个文件夹：光、构图、颜色、手、失败。\n\n「光」里面全是不同时间的照片：早上教室的光、傍晚走廊的光、台灯下的手。\n\n「失败」里面是他自己画坏的画，每一张下面写了一句为什么坏。\n\n我说这个文件夹最有价值。\n\n大部分人存素材，只存好看的。存好看的，是为了模仿；存失败的，是为了不再犯。\n\n他跟我说，有一次画色彩，怎么画都灰。翻到「失败」里一张，下面写着：暗部用了三种颜色，糊了。他就知道问题在哪了。\n\n素材库不是收藏夹，是自己的病历本。\n\n我要求每个学生每周存五张，不用多。存的时候写一句话：我为什么存它。\n\n一句话写不出来，说明你只是觉得好看，没看懂。\n\n家长常问：孩子天天刷手机看图，算不算积累？不算。刷是消费，存是整理。看完能说出一句为什么，才算。\n\n还有人问：要不要买画册？要，但画册是精读，素材库是日常。两个都要。\n\n存图不难，难的是写那句为什么。\n\n有个学生问我，老师你的素材库存什么。\n\n我说存两样：看不懂的和看不厌的。\n\n看不懂的，过一年再看，可能就懂了；看不厌的，说明它里面有东西。\n\n他说那我存了很多看不厌的。我说那你试着写一句，为什么看不厌。\n\n他写了半天，写不出来。我说写不出来就删掉，说明你只是喜欢，还没看见。\n\n他翻到「失败」那一栏，说这张我到现在还记得。我说那就没白画。\n\n他后来把素材库导了一份给我。我翻了半天，说你这半年没白过。他说老师，我存的第一张是您课上放的画。我说那张我也存着。素材库这东西，存的是你看过的世界。看得越多，画得越有底。", "shoot": ["手机相册往下滑，分类清楚", "文件夹命名特写", "学生翻自己的素材本"], "cost": "30 分钟", "tags": "#美术生 #央美附中 #美术生的日常 #画室"}, {"id": "C21", "cat": "C", "title": "深夜的教学楼", "form": "视频", "hook": "十一点半，教学楼还剩三盏灯", "copy": "十一点半，教学楼还剩三盏灯。\n\n一盏是教研室的，老师在备明天的课。一盏是画室，有个孩子在补白天的画。还有一盏是办公室，我在算这个月的账。\n\n很多人以为画室晚上很热闹，其实不是。十点以后，走廊很静，能听见铅笔在纸上走的声音。\n\n我每天最后一个走。走之前要做三件事：看一遍教室的窗关没关，看一遍画架上的画有没有被动过，看一遍宿舍的灯是不是都灭了。\n\n为什么看画架？因为有的孩子晚上偷偷回来改画。改得好没事，改坏了，第二天他会更慌。\n\n有一年，一个孩子连着三天半夜回来画。我发现了，没说他，只在他画架上留了张纸条：明天早上来我办公室，我陪你改。\n\n第二天他来了。我们改了两个小时，把那张画救回来了。\n\n后来他考上了。走的时候跟我说，老师那张纸条我一直留着。\n\n家长常问：孩子晚上偷偷画，要不要管？先看为什么。是白天没画完，还是心里不踏实。前者调时间，后者要聊。\n\n还有人问：老师你每天这么晚，不累吗？累。但孩子在，我就得在。\n\n教学楼的灯一盏盏灭，这一天的工作才算完。\n\n有家长问我，你们老师几点下班。我说没有点，最后一个孩子走，我们才走。\n\n这不是什么值得夸的事。孩子在这儿，总要有人看着。\n\n但我也不赞成老师熬。老师熬垮了，课上不好，最后还是孩子吃亏。\n\n所以我们现在排班，晚上轮流守。守的人只做一件事：确保孩子安全，不讲课。\n\n关灯之后，走廊很黑。我拿手机照着下楼，一步一步。\n\n有个孩子问我，老师你每天几点睡。我说十二点。他说那你也挺晚。我说我晚，是因为我要等你们走。他说那你先走，我们关灯。后来他们真这么做了。我下楼的时候，教室的灯自己灭了。", "shoot": ["航拍或走廊尽头，只亮几间", "走近，从窗户往里拍", "关灯，走廊黑下来"], "cost": "30 分钟", "tags": "#美术生 #央美附中 #美术生的日常 #画室"}, {"id": "C22", "cat": "C", "title": "老师的备课桌面", "form": "视频", "hook": "老师的桌子上，没有一样是装饰", "copy": "这张桌子，是我每天待得最久的地方。\n\n上面没有装饰，全是东西。\n\n左边是教案，不是写给检查看的，是写给我自己的。每一节课，我要写三行：今天讲什么，学生可能卡在哪，讲完怎么验证他们听懂了。\n\n中间是范画。每一张上面都有批注，红笔写的是我讲课时要强调的地方，蓝笔写的是学生容易犯的错。\n\n右边是一摞小稿，巴掌大。这是我给学生改画之前画的。改之前先自己画一遍，才知道难在哪。\n\n抽屉里还有一叠纸条，是每个孩子的弱项。上课前翻一眼，讲到相关的地方，我就点他一下。\n\n有老师问我，教了这么多年，还用备课吗。用。每年学生不一样，卡住的地方也不一样。\n\n去年有个班，整体色彩偏灰。我翻了三个月的教案，发现是我讲冷暖的时候，例子用错了。后来换了组静物，好了很多。\n\n家长常问：老师备课认真不认真，怎么看？看他的范画有没有批注，看他能不能说出你孩子的具体问题。说得越具体，备课越深。\n\n还有人问：好老师是不是不用备课？越好的老师越备。因为他知道哪里会出问题。\n\n桌子乱，但每样东西在哪儿，我都知道。\n\n有家长看过我的桌子，说你这儿怎么这么乱。我说乱，但我知道每一张纸在哪。\n\n其实备课这件事，学生看不见。他们只看见你上课讲得顺不顺。\n\n讲得顺，是因为下面想了十遍。\n\n我常跟新老师说，你在课上省下的每一分钟，都是课下花一个小时换的。\n\n桌上那张纸，写的是明天要问的三个问题。问完，这节课才算备完。\n\n有家长问我，老师你每天备课到几点。我说不一定，看第二天讲什么。讲新课，备三小时；讲评课，备一小时。讲评课看起来轻松，其实最难，因为要看每个人的画。看得越多，第二天讲得越准。", "shoot": ["桌面俯拍，摊开的教案和笔", "翻到一页写满批注的范画", "抽屉里一摞学生小稿"], "cost": "30 分钟", "tags": "#美术生 #央美附中 #美术生的日常 #画室"}, {"id": "C23", "cat": "C", "title": "一张 85 分的速写，问题在哪", "form": "视频", "hook": "85 分的速写，差的那 5 分在哪", "copy": "这张速写，八十五分。\n\n家长问我，差的那五分在哪。我说不在画得少，在三个地方。\n\n第一，手脚。八十五分的人，身体能画住，手脚会含糊。手画成一块，脚没有朝向。考官一看就知道，这个人还没解决末端。\n\n第二，衣纹的来路。八十五分的衣纹，大体对，但经不起推敲。这道褶从哪来，压在哪，交代不清。九十分的人，每一道褶都能找到受力点。\n\n第三，画面的呼吸。八十五分的人，画得太满。该空的地方不空，该虚的地方不虚。整张画没有让人喘气的地方。\n\n这三样，都不是靠多画能解决的。\n\n手脚要单独练，一天二十只手，画一个月。衣纹要理解结构，知道布是挂在人身上的。呼吸要敢留白，敢把不重要的地方放松。\n\n有个孩子卡在八十五分卡了半年。后来我让他做一件事：每张速写只画七成，剩下三成留白。他一开始很难受，觉得没画完。两个月后，他的画反而高级了。\n\n家长常问：八十五分还要不要冲？要，但别用蛮力。先找到那五分丢在哪。\n\n还有人问：分数到九十是不是就到头了？不是。九十以上拼的是感受，那个教不了，只能养。\n\n八十五到九十，差的不是手，是取舍。\n\n有个孩子问我，老师我是不是天赋就到这了。\n\n我说你先把脚画对，再谈天赋。\n\n他练了一个月脚，速写涨了三分。\n\n很多时候不是天赋的问题，是有一个地方你一直绕着走。\n\n还有一件事，八十五分的人，画完不复盘。画完就翻页，下一张还是老样子。\n\n那个孩子后来画了一张九十分的。他说，老师我终于知道那五分在哪了。", "shoot": ["速写铺在桌上，手指点三个位置", "局部放大：手、脚、衣纹", "整张退远看"], "cost": "30 分钟", "tags": "#美术生 #央美附中 #美术生的日常 #画室"}, {"id": "C24", "cat": "C", "title": "同一组静物，5 个学生画出 5 种样子", "form": "视频", "hook": "同一组静物，五个人画出五个世界", "copy": "同一组静物，五个孩子画，出来五个样子。\n\n第一张，构图很稳，主体在正中间，但画面平。\n\n第二张，主体偏左，留白很大，画面有点险，但好看。\n\n第三张，颜色很重，暗部压得很低，气氛沉。\n\n第四张，颜色很淡，像蒙了一层雾。\n\n第五张，画得最像，但也最没意思。\n\n我让他们互相看，然后说一句：你最想拿走谁的哪一部分。\n\n有人说想拿第二张的构图，有人说想拿第三张的暗部。\n\n我说这就对了。你们看的不是谁画得好，是每个人做了什么选择。\n\n画画这件事，到最后拼的是选择。同样的东西，你决定强调什么，决定放弃什么，画面就成了什么样。\n\n第五张的孩子不服气，说我画得最像。我说像是基本功，不是目的。你把所有东西都画清楚了，等于什么都没强调。\n\n后来他试着把背景放松，主体加重。下一张，画面就活了。\n\n家长常问：孩子画得不像，是不是不好？不一定。先看关系对不对，再看像不像。\n\n还有人问：要不要让孩子学别人的风格？可以学，但别停在模仿。学完要问自己：我想强调什么。\n\n五张画挂在一起，比单独看一张，能学到更多。\n\n这五张画，我留了三年。每年新生来，我都拿出来给他们看。\n\n我说你们看，同样的东西，五个人画，没有一张是错的。\n\n但有一张，你会记住。为什么？因为它做了选择。\n\n画画到最后，不是比谁画得多，是比谁敢不要。\n\n五张画挂在一起，谁都没说话。后来有人说，原来画画是这么回事。\n\n有个孩子看完五张画，说老师我想把我的那张撕了。我说别撕，你先把别人的好记下来。他记了三条，回去改。下个月，他的画挂在了中间。不是他变了，是他看见了自己缺什么。看见，比夸有用。", "shoot": ["五张画并排，机位固定", "镜头依次推近每张的主体", "五个学生站在各自画前"], "cost": "30 分钟", "tags": "#美术生 #央美附中 #美术生的日常 #画室"}, {"id": "C25", "cat": "C", "title": "老师现场示范，学生跟画", "form": "视频", "hook": "跟着老师画，为什么一离开就不会", "copy": "老师在上面画，学生在下面跟。\n\n跟完，看着差不多。第二天自己画，全忘了。\n\n为什么？因为跟画的时候，你在抄结果，没学过程。\n\n老师画到哪，你画到哪。你不知道他为什么先画这里，为什么这一笔要重，为什么那里要停。\n\n所以我现在示范，会故意停下来。\n\n画到一半，我停笔，问：下一步该画什么？让他们说。说对了再画，说错了，我就把他们说的画出来，让他们看错在哪。\n\n这样慢，但记得住。\n\n还有一种办法：示范完，把画收起来，让他们凭记忆画一遍。画不出来的地方，就是没看懂的地方。\n\n有个孩子跟画跟得特别好，自己画就散。我让他试了一次凭记忆画，他说老师我脑子里是空的。\n\n我说对，你之前只是在复制。\n\n后来他改了方法：看示范只记三件事——先画什么，重点在哪，什么时候停。记住这三件，剩下的自己推。\n\n三个月后，他的画开始有自己的样子了。\n\n家长常问：孩子上课听懂了，回家就不会，为什么？听懂不等于会。要看他能不能独立走一遍。\n\n还有人问：要不要让孩子多临摹？要，但临摹要带问题。临一张，学一个点，比临十张强。\n\n跟画是学，独立画才是会。\n\n有家长问，孩子上课记不记笔记。我说记，但别记步骤。\n\n记步骤，你只会复制。要记判断：什么时候该停，什么时候该重，什么地方可以放。\n\n判断记下来，换个角度也能用。\n\n这才是带得走的东西。\n\n我让他凭记忆画一遍，他画到一半停了。我说停的地方，就是你没看懂的地方。\n\n我后来加了一条：跟画之前，先看三分钟，不许动笔。看完说一句：老师第一步画什么。说对了再开始。这个动作，让跟画变成了学。学，是带着问题看。不带问题看，看十遍也白看。", "shoot": ["老师示范，学生在旁边跟", "两张画对比，一张像一张散", "学生自己起稿，老师不插手"], "cost": "30 分钟", "tags": "#美术生 #央美附中 #美术生的日常 #画室"}, {"id": "C26", "cat": "C", "title": "从不会排线到能画完整石膏像", "form": "视频", "hook": "排线排得漂亮，石膏像还是画不出来", "copy": "这个孩子排线排得特别漂亮。\n\n一排一排，又直又匀。但一画石膏像，就完了。\n\n为什么？因为排线是手段，不是目的。\n\n石膏像考的是三件事：比例、结构、明暗。\n\n比例，是头、颈、胸、底座的关系。哪儿长哪儿短，哪儿宽哪儿窄。比例错了，排线再好也是错的。\n\n结构，是骨头在哪，转折在哪。石膏像没有肌肉，全靠骨点。颧骨、眉弓、下颌角，这几个点定住了，脸就立起来了。\n\n明暗，是光打上去之后，哪里亮、哪里暗、哪里过渡。明暗交界线不是一条线，是一段面。\n\n他排线好，说明手稳。但手稳不等于眼睛准。\n\n我让他停了两周排线，只做三件事：量比例、找骨点、分明暗。画得很难看，但结构对了。\n\n第三周再排线，画面一下子就不一样了。\n\n家长常问：孩子每天练排线，有用吗？有用，但只练排线没用。排线是基本功里最基础的一层，上面还有形和结构。\n\n还有人问：石膏像要画多久？一张完整的，四到六个小时。少了画不完，多了会腻。\n\n手稳是好事，但画画靠的是眼和脑。\n\n我见过排线排了两年的孩子，石膏像还是画不出来。\n\n不是他不努力，是方向错了。\n\n基本功不是把线排直，是能把一个东西画像、画立体、画得有空间。\n\n排线只是其中最表面的一层。\n\n他现在画石膏像，先量三遍比例，再动笔。前十分钟一张纸是空的，有人路过会觉得他在偷懒。他不解释。但石膏像这种东西，前面多想十分钟，后面少改一小时。\n\n量比例的时候，他量了三遍。第三遍手不抖了，才动笔。\n\n他现在画石膏像，先量三遍。第一遍量大的比例，第二遍量骨点，第三遍量明暗。三遍量完，才动笔。动笔之后，不再来回改。他跟我说，老师这样画慢。我说慢在前面，快在后面。", "shoot": ["一排排线练习，整齐但空", "石膏像起稿，比例线清楚", "最后完成，明暗交界线明确"], "cost": "30 分钟", "tags": "#美术生 #央美附中 #美术生的日常 #画室"}, {"id": "C27", "cat": "C", "title": "附中在读的学姐回来看老师", "form": "视频", "hook": "附中的学姐回来，说了一句实话", "copy": "附中的学姐回来看老师，我让她给现在的孩子讲两句。\n\n她没说附中多好，她说了一句实话：附中没人管你。\n\n早上几点起，晚上画到几点，画什么，全靠自己。老师上完课就走，你不问，他不找你。\n\n教室里安静了一下。\n\n有个孩子问，那不会荒废吗。她说会，第一年就有人荒废。\n\n她说她刚去的时候特别不适应。在画室，老师天天盯着，到了附中，一周没人看她一张画。她前两个月天天玩，月考直接掉到后面。\n\n后来她自己定了规矩：每天晚上必须画一张速写，画完拍照存档。没人检查，她自己检查。\n\n她说，附中教给她最重要的一件事，不是画技，是自己管自己。\n\n这句话，比任何动员都管用。\n\n家长常问：孩子自控力差，去附中会不会废？有可能。所以来之前要想清楚，孩子是想画，还是被推着画。\n\n还有人问：附中管得松，是不是不好？松有松的好处，它逼你自己长。\n\n学姐走的时候，有个孩子问她，最难的是什么。她说，是没人告诉你今天该干什么。\n\n她走之前，我问他，如果重来一次，你还会选附中吗。\n\n她说会，但会早点学会自己管自己。\n\n我把这句话转给了现在这届。\n\n有个孩子听完，第二天自己定了个作息表，贴在画板上。\n\n她现在在附中读高二，每周给我发一张画。前几天她发了一张速写，说老师你看，我现在会自己改了。我看完回她：你终于不用我盯着了。她说对，这句话我等了两年。\n\n她走的时候，有个孩子追出去问：学姐，你后悔吗。她说，后悔没早点学会自己管自己。\n\n她走之前，在黑板上写了一句话：附中没人管你，但你要管自己。写完她擦了，说别让你们老师看见。我看见了，没说话。后来那句话被一个孩子抄在本子上。抄的时候他问我，老师真是这样吗。我说是。", "shoot": ["学姐坐在画室，学生围一圈", "她翻自己的速写本", "学生听得入神，不拍正脸"], "cost": "30 分钟", "tags": "#美术生 #央美附中 #美术生的日常 #画室"}, {"id": "C28", "cat": "C", "title": "考前最后一周，教室里的样子", "form": "视频", "hook": "考前最后一周，我只让做三件事", "copy": "考前最后一周，我停了所有新课。\n\n只做三件事：熟、稳、睡。\n\n熟，是画自己最熟的东西。最熟的构图、最熟的角度、最熟的颜色。这一周不冒险，不试新方法。\n\n有个孩子想在这周练一个新构图，我不同意。他说万一考到呢。我说考到的概率，比你把熟的画砸的概率低。\n\n稳，是稳时间。每天按考试时间画一张，三个小时，不多不少。让身体记住这个节奏。\n\n睡，是睡够。十一点熄灯，不许熬夜。这一周熬夜，等于把前三个月的东西还回去。\n\n有家长问，最后一周要不要加课。我说不要。这一周加课，加的是焦虑，不是分数。\n\n还有家长问，孩子说紧张怎么办。我说紧张是对的，不紧张才奇怪。让他把紧张当成正常状态，别对抗。\n\n最后一周，我也做三件事：看每个孩子的状态，检查工具，跟家长打招呼——这几天别问成绩。\n\n考前的胜负，很多时候不在画上，在状态上。\n\n这一周，少做一点，比多做一点强。\n\n去年最后一周，有个孩子非要练新东西。我拦了，他不高兴。\n\n考试出来，他用的还是自己最熟的那套，考得不错。\n\n他后来跟我说，老师幸亏你拦了我。\n\n最后一周，守成比开疆重要。\n\n有个家长考前给我打电话，问要不要给孩子买新画具。我说不用，用旧的。新笔不顺手，新纸不适应，考场上任何一点陌生都是风险。她后来还是买了，孩子没用，带回来说，还是旧的好。考试这件事，熟悉比新鲜值钱。\n\n最后一周，教室很安静。没人问考不上怎么办，大家都在画。\n\n最后一周，我不讲新东西，只做三件事：看状态、查工具、跟家长打招呼。有家长问，要不要给孩子加课。我说不要。她说别人都加。我说别人加，你孩子不一定受得了。她后来没加，孩子考得不错。", "shoot": ["教室黑板写三个词：熟、稳、睡", "学生画自己最熟的角度", "晚上十点，宿舍灯灭"], "cost": "30 分钟", "tags": "#美术生 #央美附中 #美术生的日常 #画室"}, {"id": "C29", "cat": "C", "title": "学生说：我以为我画得很好了", "form": "视频", "hook": "他说：我以为我画得很好了", "copy": "这个孩子跟我说，老师，我以为我画得很好了。\n\n他说这话的时候，刚看完月考卷。\n\n我没安慰他。我把一张九十分的卷子放在他旁边，让他自己看。\n\n他看了五分钟，说，老师我知道了。\n\n知道什么？他说，我一直在一个小圈子里比。\n\n这句话很准。\n\n在班里排前几名，在画室被夸几句，就以为自己到位了。但考试是全国的，你比的不是同桌。\n\n我跟他说，这不是你的错。人都会高估自己，尤其是在一个小环境里。\n\n但你要做一件事：每隔一段时间，去看比你高两个档次的东西。不是看热闹，是看差距。\n\n看的时候别自卑，也别找借口。就找一个具体的问题：他的形比我准在哪，他的颜色比我稳在哪。\n\n他后来每周看一张高分卷，看完写一句话。\n\n三个月后，他的画变了一个样子。不是突然变好，是知道自己差在哪了。\n\n家长常问：孩子自我感觉太好，要不要打击？不用打击，给他看更高的标准就行。\n\n还有人问：孩子总觉得自己差，怎么办？反过来，让他看比自己低一档的画，找回信心，再往前看。\n\n知道自己在哪，比觉得自己行不行重要。\n\n他后来养成了一个习惯：每画完一张，自己先打分，再拿给我看。\n\n一开始他给自己打八十五，我打七十。差了十五分。\n\n三个月后，他打七十八，我打七十六。\n\n我说你现在能看见自己了。\n\n能看见自己，才谈得上进步。\n\n他后来自己打分，打七十八，我打七十六。他说，老师我现在能看见自己了。\n\n他后来每画完一张，自己先打分，再拿给我看。一开始他打八十五，我打七十。差了十五分，他有点不服。我说你再看看脚。他看完，说老师我懂了。三个月后，他打七十八，我打七十六。只差两分。", "shoot": ["学生站在自己画前，表情平静", "老师把一张高分卷放在旁边", "两张画同框，差距明显"], "cost": "30 分钟", "tags": "#美术生 #央美附中 #美术生的日常 #画室"}, {"id": "C30", "cat": "C", "title": "画室里的第一百个下午", "form": "视频", "hook": "第一百个下午，他还坐在同一个位置", "copy": "这个孩子，在这个位置坐了一百个下午。\n\n我拍了一张照片，和第一天的那张放在一起。\n\n第一天，他坐得很直，手不知道往哪放。画出来的东西，形是散的。\n\n第一百天，他还是坐得很直，但手很稳。画出来的东西，形站住了。\n\n中间发生了什么？没有奇迹。\n\n就是每天下午两点到六点，画三张。画完改，改完再画。有时候一张画改四遍。\n\n他也有过不想画的时候。第三个月，他跟我说，老师我想休息一周。我批了。\n\n一周后他回来，自己坐回这个位置，没说一句话，开始起稿。\n\n我问他，想明白了？他说，没想明白，就是想画。\n\n这句话我记了很久。\n\n很多人以为坚持是靠意志力。不是。是靠一件事：你发现自己还是想画。\n\n家长常问：孩子说不想画了，要不要逼？先让他停几天。真不想的，停完就不回来了；真想画的，停完自己会回来。\n\n还有人问：一百天能有这么大变化吗？能，但前提是每天都真的在画，不是坐着。\n\n第一百个下午，和第一个下午，看起来一样。\n\n但人已经不一样了。\n\n他结业那天，把这一百天的画摞在一起，比他的腰还高。\n\n他说老师我想把这些都带走。我说带走吧，但留一张给我。\n\n他留了第一张。\n\n那张画很丑。但他说，那张是他开始的地方。\n\n我问他，这一百天最难的是哪天。他说是第三十天，那天他画了一张，自己觉得特别好，拿给我看，我说不行。他说那一刻他想把画撕了。\n\n第一百零一天，他还是坐在那儿。我没拍照，因为故事已经不用照片了。\n\n有一天他没来。我打电话，他说发烧。第二天他来了，脸色不好，还是要画。我让他回去睡。他说老师我明天补。我说不用补，身体要紧。他走了，下午又回来了。他说睡不着。我给他搬了把椅子，让他坐着看别人画。", "shoot": ["同一个机位，拍学生画画", "墙上日历翻过很多页", "画纸摞起来，比人高"], "cost": "30 分钟", "tags": "#美术生 #央美附中 #美术生的日常 #画室"}, {"id": "E1", "cat": "E", "title": "初二，刚开始学，有机会上美院附中吗？", "form": "图文", "hook": "初二，刚开始学，还有机会吗", "copy": "这条是问大家的，也顺便说说我的看法。\n\n一个家长问我：孩子初二，刚开始学美术，想考央美附中，有机会吗？\n\n我说有机会，但要看三件事。\n\n第一，孩子是不是真想画。刚开始学，热乎劲儿还在，看不出真假。让他连着画一个月，每天两小时，还愿意画，才算。\n\n第二，每天能拿出多少时间。初二开始，到考试一年半，每天至少两小时，周末要加量。\n\n第三，文化课稳不稳。附中文化要过线，不能只顾专业。\n\n三条都行，可以试。缺一条，就要想清楚。\n\n你们家孩子是几年级开始学的？现在每天画多久？评论区说说，我挑几个典型的回。\n\n我见过一个初二下学期才起步的孩子。他每天放学画两小时，周末六小时，一年半没断过。最后专业过了，文化差一点，复读了一年。路走得慢，但走通了。\n\n另外说一句：初二开始，别急着报最贵的班。先看孩子坐不坐得住，再看老师对不对路。\n\n初二起步的孩子，最缺的不是时间，是每天稳定画两小时的习惯。习惯立住，一年半就够。", "shoot": ["初二学生的画", "画室课表", "评论区截图样式"], "cost": "10 分钟", "tags": "#美术生 #央美附中 #家长 #美术中考"}, {"id": "E2", "cat": "E", "title": "孩子说想考央美附中，我该支持吗？", "form": "图文", "hook": "孩子说想考附中，你敢支持吗", "copy": "一个妈妈问我：孩子说想考央美附中，我该支持吗？\n\n我没直接答。我问她三个问题。\n\n第一，孩子是说说而已，还是已经在画了？说了半年还在画的，是认真的；说了一个月就停的，是一时兴起。\n\n第二，家里能不能接受四年。附中是中专，四年制，不是三年高中。\n\n第三，如果考不上，家里有没有退路。有退路，支持起来才不慌。\n\n她想了想，说第一条符合，第二条能接受，第三条还没想。\n\n我说那就先想第三条。想清楚了，再谈支持。\n\n支持不是砸钱，是想清楚最坏的结果，还愿意陪他走。\n\n你们呢？如果孩子说想走这条路，你会怎么答？\n\n有个爸爸跟我说，他不支持，但也不拦。我说这就够了。孩子要的不是你替他决定，是你别在他失败的时候说风凉话。\n\n支持不等于马上交钱。先让孩子画三个月，每天两小时。三个月后还愿意画，再谈报班。\n\n还有个判断办法：看孩子能不能自己说出想考的理由。说得出，是认真；说不出，是跟风。理由越具体，走得越远。\n\n这一条，比任何保证都靠谱。", "shoot": ["孩子画画的背影", "家长在门口看", "简章封面"], "cost": "10 分钟", "tags": "#美术生 #央美附中 #家长 #美术中考"}, {"id": "E3", "cat": "E", "title": "你会为了考附中让孩子复读吗？", "form": "图文", "hook": "为了附中复读，你愿意吗", "copy": "问一个可能有点扎心的问题：你会为了考附中，让孩子复读一年吗？\n\n我见过两种家庭。\n\n一种是孩子自己不甘心。考完那天他说，妈，我想再来一年。这种复读，成功率比较高，因为他知道自己在干什么。\n\n另一种是家长不甘心。孩子说算了，家长说再试一次。这种复读，孩子往往提不起劲，第二年还是老样子。\n\n复读不是坏事，但要看是谁想复读。\n\n还有一个现实问题：复读一年，钱、时间、心理压力，都是成本。家里要先算清楚。\n\n如果是你，你会怎么选？评论区聊聊，不用写名字。\n\n我认识一个孩子，复读那年瘦了十斤。考上的那天他跟我说，老师，这一年我不是在画画，是在跟自己较劲。\n\n复读这件事，最怕的是家里勉强。钱花了，怨气也在。孩子能感觉到，画的时候手是紧的。\n\n我见过一个孩子，复读那年把手机交给了妈妈，一年没碰。他说不是戒手机，是戒分心。他跟我说，这一年最难的不是画，是不看别人。别人考上，别人放弃，都跟他没关系。", "shoot": ["复读生画画的背影", "两年成绩单", "空教室"], "cost": "10 分钟", "tags": "#美术生 #央美附中 #家长 #美术中考"}, {"id": "E4", "cat": "E", "title": "帮看看孩子这张画，能考附中吗？（长期征集）", "form": "图文", "hook": "发一张画，我帮你看方向", "copy": "开一个长期征集：把你孩子的画发在评论区，我帮你看方向。\n\n说清楚三件事，我才好判断。\n\n第一，孩子几年级，学了多久。\n\n第二，这张画画了多长时间，是临摹还是写生。\n\n第三，你想问什么：是形的问题、颜色的问题，还是该不该走这条路。\n\n我会挑典型的回，尽量说具体：问题在哪，怎么练，练多久。\n\n不评价天赋，不打击孩子。画得好不好，先看方法对不对。\n\n发的时候把名字遮掉，保护孩子隐私。\n\n来吧，评论区见。\n\n发图的时候顺便说一句：孩子自己喜不喜欢这张画。这句话比画面本身更能说明问题。喜欢，说明他在意；不在意，画得再好也难长久。\n\n如果孩子不愿意发，别勉强。尊重他，比得到一张画重要。画可以以后再看，信任断了很难补。\n\n发图的时候可以说说孩子画这张时的状态：是开心，是烦，还是硬着头皮画完的。状态比画面更能说明问题。我会按状态给建议，不只按画面。\n\n画得好不好，先放一边，先看孩子在不在画里。", "shoot": ["一张学生画，打码", "老师看画的侧影", "评论区样式"], "cost": "10 分钟", "tags": "#美术生 #央美附中 #家长 #美术中考"}, {"id": "E5", "cat": "E", "title": "画室老师说过的一句话，你印象最深的是哪句？", "form": "图文", "hook": "老师哪句话，你记到现在", "copy": "想收集一句话：你孩子学画这些年，老师说过哪句话，你到现在还记得？\n\n我先说我的。\n\n我小时候，老师跟我说：你画得太用力了，松一点。\n\n那时候不懂，觉得画得用力才是认真。后来才明白，他说的是画面要有呼吸。\n\n这句话我记了二十年，现在还在跟学生说。\n\n还有一句，是我自己跟学生说的：画不好没关系，别不画。\n\n有时候一句话，能改变一个人对一件事的态度。\n\n你记得的那句是什么？谁说的？评论区写下来。\n\n还有一句是学生跟我说的：老师，你总说放松，可我一放松就画不像了。那句话让我改了教法。有时候学生也在教老师。\n\n一句话的分量，有时候比一年的课重。好话记一辈子，难听的话也记一辈子。\n\n还有一句，是我刚学画的时候，一个老老师说的：你别急着画完，先画对。那时候我嫌他啰嗦，现在我也成了那个啰嗦的人。\n\n有句话我记到现在，是一个学生说的：老师，你让我别急，可我爸妈急。这句话让我开始给家长上课。有时候，慢下来的是大人。", "shoot": ["黑板上的字", "画室走廊", "学生低头画画"], "cost": "10 分钟", "tags": "#美术生 #央美附中 #家长 #美术中考"}, {"id": "E6", "cat": "E", "title": "备考附中，家长最焦虑的到底是什么？", "form": "图文", "hook": "备考附中，家长最怕什么", "copy": "问一句：备考附中这件事，你最焦虑的是什么？\n\n我猜有几个答案。\n\n怕考不上。两千人左右抢两百个名额，谁都会怕。\n\n怕选错画室。钱花了，时间花了，方向错了。\n\n怕孩子半途不想画。投入了那么多，突然说不干了。\n\n怕自己帮不上忙。不懂画，只能干着急。\n\n还有一个，很多人不说：怕别人问。\n\n亲戚朋友一句「考得怎么样」，能把人问崩。\n\n这些焦虑，我听过太多。\n\n你呢？最怕哪一个？评论区说说，我按最多的那个，单独写一条。\n\n有个妈妈跟我说，她最怕的是亲戚问。每次家庭聚会，她都说不出口孩子在考中专。后来孩子考上了，她第一个打电话给那个亲戚。\n\n焦虑不会因为别人劝就消失，但说出来会轻一点。评论区不用写名字，写事就行。\n\n有个妈妈说，她最怕的是钱花了，孩子还没考上，最后连个普通高中都没得上。我说这个怕是对的，所以要把退路想清楚。想清楚了，反而不怕。怕的是没想。", "shoot": ["家长在等候区", "手机里的成绩单", "夜晚的教室"], "cost": "10 分钟", "tags": "#美术生 #央美附中 #家长 #美术中考"}, {"id": "E7", "cat": "E", "title": "如果考不上央附，你会让孩子去哪？", "form": "图文", "hook": "考不上央附，你会让孩子去哪", "copy": "如果考不上央美附中，你会让孩子去哪？\n\n我把常见的几条路列在这。\n\n一是走统考，考综合类大学的美术专业。\n\n二是上普高美术班，文化课为主，美术特长。\n\n三是读美职，早点接触设计、动画这些方向。\n\n四是复读，第二年再考。\n\n每条路都有走通的人，也都有走不通的人。\n\n我个人建议：别在孩子考前想这个，考完再想。考前想退路，会影响状态。\n\n但家长自己心里要有数。有数，才不慌。\n\n你会选哪条？或者你已经在走了？评论区聊聊。\n\n有个孩子考完跟我说，老师，我其实早就想好了，考不上就去读设计。他说这话的时候很平静。那一刻我知道，他长大了。\n\n没有哪条路是废路，只有不适合的路。走之前想清楚，走上去就别回头。\n\n还有一条少有人提：先不急着定，让孩子去考一次，考完他自己会有感觉。\n\n有个家长说，她儿子考不上就去读美职，学动画。她说孩子自己选的，她支持。我说这就对了。孩子选的路，他才会走。家长选的路，他只会应付。", "shoot": ["几条路的清单", "统考考场", "普高门口"], "cost": "10 分钟", "tags": "#美术生 #央美附中 #家长 #美术中考"}, {"id": "E8", "cat": "E", "title": "孩子突然说不想画了，你会怎么办？", "form": "图文", "hook": "孩子突然说不想画了", "copy": "孩子突然说不想画了，你会怎么办？\n\n我见过三种处理方式。\n\n第一种，骂。说钱都交了，你说不画就不画。结果孩子更不想画，亲子关系也僵了。\n\n第二种，哄。说再坚持一下，考完就好了。孩子听多了，知道是敷衍。\n\n第三种，停。让他停一周，不碰画，也不提画。一周后看他什么反应。\n\n我一般建议第三种。\n\n真不想画的，停完就不回来了；真想画的，停完自己会回来。\n\n回来的时候，他会告诉你原因。可能是累了，可能是卡住了，可能是被老师说了一句。\n\n知道了原因，才谈得上解决。\n\n你遇到过吗？当时怎么处理的？\n\n有个孩子停了一周，回来第一句话是：老师，我手痒。我没接话，给他递了张纸。他画了一下午。\n\n孩子说不画了，先别急着解决。先听他说完，很多时候他说完就好了。\n\n有个孩子停了两周，回来第一件事是把画架擦干净。我问他为什么擦，他说看着舒服。我说那你画吧。他画了一下午。后来他跟我说，他不是不想画，是不想被逼着画。", "shoot": ["空画架", "孩子坐在窗边", "画到一半的画"], "cost": "10 分钟", "tags": "#美术生 #央美附中 #家长 #美术中考"}, {"id": "E9", "cat": "E", "title": "你家孩子一天画几个小时？", "form": "图文", "hook": "一天画几个小时，才算够", "copy": "你家孩子一天画几个小时？\n\n我先说我们这边的情况。\n\n集训期，专业课每天六到八小时，晚上还有一到两小时复盘。周末不休息，但会换科目。\n\n非集训期，每天两到三小时，周末加量。\n\n但我更想说另一件事：时长不等于有效。\n\n有的孩子坐八小时，画三张，张张有问题。有的孩子坐五小时，只画一张，但改透了。\n\n我判断有没有效，看三个信号：起稿有没有变快，改画次数有没有变少，能不能说出自己哪里没画好。\n\n三个都有，五小时就够。三个都没有，十小时也是熬。\n\n你们家一天画多久？孩子状态怎么样？评论区说说。\n\n我见过一个孩子，每天画十个小时，三个月没进步。后来发现，他十个小时里有四个小时在削笔、找橡皮、刷手机。\n\n时长是家长的安心剂，不是孩子的成绩单。看他画进去没有，比看他坐多久准。\n\n我现在不看孩子坐了多久，我看他一张画改了几次。改三次以上的，通常是真的在画。一次不改的，多半在应付。应付久了，手就废了。所以我更看重改。", "shoot": ["计时器", "画室里一排画架", "晚自习"], "cost": "10 分钟", "tags": "#美术生 #央美附中 #家长 #美术中考"}, {"id": "E10", "cat": "E", "title": "集训 vs 陪读，你选哪个？", "form": "图文", "hook": "集训还是陪读，你选哪个", "copy": "集训 vs 陪读，你选哪个？\n\n集训，孩子住校，统一管理，作息规律，但离家远，家长看不见。\n\n陪读，家长在身边，吃住放心，但孩子容易依赖，家长也累。\n\n我见过两种都成功的。\n\n集训的孩子，独立性长得快，第二年明显不一样。\n\n陪读的孩子，情绪稳定，有事能及时说。\n\n关键不在选哪个，在孩子适合哪个。\n\n自理能力弱的，先陪一段；能管住自己的，早点放手。\n\n还有一个折中方案：前期陪，后期撤。\n\n你会怎么选？为什么？\n\n有个家长陪了半年，后来跟我说，她发现自己在那儿，孩子反而不专心。撤回去之后，孩子状态好了。\n\n陪读不是爱得多，是放得晚。该放手的时候不放手，孩子长得慢。\n\n我见过一个折中的做法：第一个月陪，第二个月一周去两次，第三个月完全撤。孩子有个适应期，家长也有。\n\n有个孩子住校第一周天天打电话回家，第二周三天一次，第三周就不打了。不是不想家，是忙起来了。忙，是最好的适应，前提是他在做有意义的事。", "shoot": ["宿舍走廊", "出租屋书桌", "画室门口"], "cost": "10 分钟", "tags": "#美术生 #央美附中 #家长 #美术中考"}, {"id": "E11", "cat": "E", "title": "你们那儿画室一学期多少钱？", "form": "图文", "hook": "你们那儿画室，一学期多少钱", "copy": "想做个各地行情参考：你们那儿的画室，一学期多少钱？\n\n说的时候尽量带上几个信息：城市、班型、是否含住宿、是否含文化课。\n\n因为只报一个数字，没有可比性。\n\n有的价格含住宿和画材，有的只含课时。有的包文化课，有的另收。\n\n我见过家长只看总价，结果开学后一项项加钱，最后超预算。\n\n也见过贵的班，一个老师带三十个人，改画轮不到。\n\n所以比价格之前，先比包含什么。\n\n你所在的城市，一学期大概多少？评论区留个数，给后面的家长做个参考。\n\n有个家长图便宜，报了一个很便宜的班。上了两个月发现，老师是刚毕业的学生，没带过一届考生。省下的钱，后来补课又花回去了。\n\n价格可以比，但别只比价格。同样的钱，一个老师带十个和带三十个，是两回事。\n\n有个家长跟我说，他们那儿一学期两万，含住宿。另一个说，他们那儿四万，不含画材。同样的城市，差一倍。差在哪儿？班额、师资、课时、住宿。所以别只比数字。", "shoot": ["收费单，金额打码", "画材店", "教室"], "cost": "10 分钟", "tags": "#美术生 #央美附中 #家长 #美术中考"}, {"id": "E12", "cat": "E", "title": "孩子画到崩溃的时候，你会做什么？", "form": "图文", "hook": "孩子画到崩溃，你在旁边做什么", "copy": "孩子画到崩溃，把笔一摔，说我不画了。这时候你在旁边做什么？\n\n我见过几种家长。\n\n一种讲道理：你再坚持一下，别人都能坚持。\n\n一种跟着急：不画了？钱白花了？\n\n一种不说话，默默把纸捡起来。\n\n我个人觉得，第三种最好，但不够。\n\n捡完纸，可以加一句：我知道你烦。\n\n别说「没事」，也别急着分析。他现在听不进去。\n\n等他缓过来，再问：是哪里卡住了？\n\n崩溃通常不是因为画不好，是因为不知道怎么变好。\n\n你遇到过吗？当时说了什么？后来有用吗？\n\n有个孩子摔完笔，蹲在地上哭。他妈妈没说话，蹲下来陪他。哭了十分钟，他自己站起来，把画重新贴上墙。\n\n崩溃的时候，陪伴比道理有用。你坐在旁边，不说话，他也知道你在。\n\n有个孩子画到一半把画撕了。他妈妈没拦，等他撕完，递了一张新的。他说不想画了。她说那就明天再画。第二天他自己坐回去了。后来他跟我说，那天他最感谢的，是他妈没讲道理。\n\n陪伴不是解决问题，是让他知道有人在。", "shoot": ["揉皱的画纸", "孩子趴在桌上", "家长的手"], "cost": "10 分钟", "tags": "#美术生 #央美附中 #家长 #美术中考"}, {"id": "E13", "cat": "E", "title": "除了央美附中，你还知道哪些美院附中？", "form": "图文", "hook": "除了央美附中，你还知道哪几所", "copy": "除了央美附中，你还知道哪些美院附中？\n\n我列几个常见的：中国美院附中、鲁迅美院附中、广州美院附中、西安美院附中、中央工艺美院附中、中国戏曲学院附中、南京艺术学院附中。\n\n每所的学制、考试科目、文化要求都不一样。\n\n有的偏造型，有的偏设计，有的方向更具体。\n\n很多家长只知道央美附中，其实选择不止一个。\n\n但选择多，不代表都要试。每所的训练方向不同，同时准备容易两头空。\n\n你知道几所？有没有考虑过别的？评论区补充，给后面的家长做个参考。\n\n有个家长把七所附中的简章打印出来，做了张对比表。她说看完才发现，自己原来只盯着一个方向。\n\n多知道一所，就多一个选择。但别因为选择多，就哪个都想试。\n\n比如国美附中在杭州，鲁美附中在沈阳，广美附中在广州。城市不同，生活和考试的成本也不同，这些都要算进去。\n\n有个家长问我，考附中是不是只能去北京。我说不是，但每所的训练方向不一样。先选方向，再选城市。顺序反了，白折腾。", "shoot": ["附中名单", "各地地图", "学校门口"], "cost": "10 分钟", "tags": "#美术生 #央美附中 #家长 #美术中考"}, {"id": "E14", "cat": "E", "title": "说一个孩子在阿祖的变化（老粉征集）", "form": "图文", "hook": "说一个孩子在阿祖的变化", "copy": "想收集一些真实的变化，给正在犹豫的家长看看。\n\n如果你家孩子在阿祖学过，欢迎在评论区说一个具体的变化。\n\n不用说「进步很大」这种。说具体的：以前画不完，现在能按时交；以前不敢下笔，现在敢画重颜色；以前一改画就哭，现在自己会改。\n\n越具体，越有用。\n\n我会挑几条，征得同意后整理出来。\n\n不想露脸的，可以只说事，不说名字。\n\n这条不删，长期有效。\n\n也可以说一件小事：他第一次主动加画是什么时候，他第一次说想考是什么时候，他第一次自己改画是什么时候。这些小事，比分数真实。\n\n真实的变化，不需要修饰。你说得越具体，别的家长越能对上号。\n\n也可以说一件他最近才做到的事：第一次主动加画，第一次自己改画，第一次说想考。\n\n有个家长写：孩子以前一画不好就哭，现在会说，我再改一遍。我看到这条，比看到考了多少分高兴。因为「再改一遍」这四个字，是他自己要说的。", "shoot": ["学生画画的背影", "两张画对比", "教室全景"], "cost": "10 分钟", "tags": "#美术生 #央美附中 #家长 #美术中考"}, {"id": "E15", "cat": "E", "title": "你会后悔让孩子走美术这条路吗？", "form": "图文", "hook": "你会后悔让孩子走美术吗", "copy": "最后一个问题：你会后悔让孩子走美术这条路吗？\n\n我问过很多家长。\n\n说不后悔的，大多有一个共同点：孩子自己喜欢。\n\n说后悔的
