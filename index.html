，也大多有一个共同点：当初是家长决定的。\n\n美术这条路，投入大，周期长，结果不确定。如果孩子不喜欢，很难撑。\n\n但如果孩子喜欢，你会发现他画一下午不觉得累，说起画来眼睛发亮。\n\n那种状态，别的东西给不了。\n\n所以后不后悔，不取决于考没考上，取决于这条路是谁选的。\n\n你呢？后悔吗？为什么？评论区说说，给还在犹豫的家长一点真实参考。\n\n有个妈妈跟我说，她最后悔的不是让孩子学画，是在孩子最想画的时候，她说了一句「画画能有什么出息」。这句话她记了十年。\n\n路是孩子走的，后悔不后悔，也该他自己说。家长能做的，是别替他后悔。\n\n有个爸爸说，他不后悔，但他心疼。孩子画到凌晨，他帮不上忙。我说你能做的，是别在门口催。他说那我能做什么。我说，给他留一盏灯。灯亮着，他就知道家里有人等。", "shoot": ["画室夜晚", "一摞画纸", "家长背影"], "cost": "10 分钟", "tags": "#美术生 #央美附中 #家长 #美术中考"}, {"id": "D1", "hook": "19岁创业，我后悔了吗", "shoot": ["坐在画室老位置，背景是画架，一镜到底", "中间插 1 秒旧照片（第一间教室）", "说到「做错了」时停半拍"], "copy": "19 岁那年，我在燕郊租了第一间房。六楼，没电梯，画架是二手的。\n\n第一年只有十几个学生，全是我附中的学弟学妹。我们一起摊模特费，画到半夜，谁也没想过这能变成一门生意。那时候最奢侈的事，是晚上收工去吃一碗加蛋的板面。\n\n十年过去，画室从居民楼搬到夏威夷，成本从几十万涨到快九百万。有人问我，后悔吗。\n\n不后悔。但有几件事，我当年做错了。\n\n第一件，我以为规模就是成绩。学生从十几个到一百多个，我一度觉得这就是成功。后来发现，一百个学生里有一半是不该来的，我把精力摊薄了，谁都教不好。\n\n第二件，我接过太多「再试试」的孩子。家长说再试试，我就收了。结果一年过去，孩子没考上，文化课也落下，我还得劝退。这笔账，我算了很多年才算明白。\n\n第三件，我以为自己可以既当老板又当老师。后来发现不行。当老板要算账、要招人、要处理关系；当老师要静下心改画。这两件事在我身上打架，最后是我先垮。\n\n现在我把高中部停了，只做附中一个方向。学生少了一半，成本没降，但我每天还能坐下来画两个小时。\n\n有人觉得这是退步。我觉得这是把路走窄了，才走得深。\n\n如果你也在纠结要不要把一件事做小，我的建议是：先想清楚你到底想做成什么样，再决定要多大的盘子。\n\n我是阿祖，画室开了十年，还在画。\n\n第一年冬天，有个学生退学了。\n\n他妈妈来搬画架，跟我说了一句话：孩子说在这儿画得开心，但看不见前途。\n\n那句话我记了十年。开心和前途，很多时候是两件事。\n\n后来我做课程，第一件事就是把前途讲清楚：考什么、怎么考、考不上怎么办。讲完再谈开心。\n\n十九岁的我，只会说「跟着我画就行」。三十岁的我知道，跟着画不够，得让人看见路。\n\n如果见到十九岁的自己，我想跟他说：别急着招人，先把一个孩子送出去。", "cat": "D", "form": "视频", "cost": "30 分钟", "tags": "#美术生 #央美附中 #画室 #校长", "title": "19 岁创业办画室，十年后我后悔了吗"}, {"id": "D2", "hook": "校长的一天，从六点半开始", "shoot": ["跟拍一天，手机竖屏，多拍碎片", "固定三个机位：办公室、教室门口、画架前", "保留真实的停顿和喘气，不要摆拍"], "copy": "六点半到画室，天还没亮。\n\n先上一圈楼，看昨天的作业交了没有。有的孩子画到十二点，画完了放在桌上，我一张张翻。翻到第三张我就知道，昨天那堂课没讲透。\n\n七点半在食堂站着吃两个包子。八点巡课，我不进教室，先在门口站两分钟。听老师怎么讲，听学生有没有人接话。教室里安静是好事，太安静就是没听懂。\n\n上午改画。有孩子拿着画过来，我不接，先问他：你觉得哪儿不对。他答得上来，我才动笔；答不上来，我就先讲。\n\n中午见家长。有的家长坐下来第一句是「多少钱」，有的第一句是「我孩子行不行」。我更愿意听第二种，因为说明他真的在想这件事。\n\n下午开会、面试老师、回消息。手机里永远有一百多条未读，大部分是家长问「我家孩子最近怎么样」。\n\n晚上学生走了，我自己画一张。不画手会生，这是我给自己定的规矩。\n\n十一点关灯。关灯前我会在走廊站一会儿，看还有没有教室亮着。\n\n一天里真正属于「管理」的时间不到两小时，剩下的都在看画和看人。\n\n有人说当校长就是当老板。我不这么觉得。老板管的是账，校长管的是人。\n\n有一次一个家长问我，你每天这样，不烦吗。我说烦。但教育这件事本来就是重复的：你今天讲的东西，明天还得再讲一遍，因为换了一批孩子听。\n\n我是阿祖，这是我的一天。\n\n有一次，一个家长问我，你一天最累的是哪一段。\n\n我说是中午。\n\n上午改画，累的是手；中午见家长，累的是嘴。一个问题要解释十遍，每一遍都得认真，因为对每个家庭来说，那都是第一次。\n\n有家长问我，孩子能不能少画一点。我说可以，但你要接受他考不上。她就不说话了。\n\n中午那两个小时，我经常吃不上饭。后来食堂师傅给我留一份，放在保温桶里。\n\n我常常是下午三点才吃。吃的时候已经凉了，但我觉得挺好，至少有人记得我没吃。", "cat": "D", "form": "视频", "cost": "跟拍半天", "tags": "#美术生 #央美附中 #画室 #校长", "title": "校长的一天"}, {"id": "D3", "hook": "新老师第一课，我坐最后一排", "shoot": ["最后一排视角：老师背影 + 学生后脑勺", "面试片段只拍手和桌面", "复盘两人对坐，侧机位"], "copy": "新老师来，我不先看他画得多好。\n\n画得好的人太多了，能把别人教好的人很少。\n\n第一周我不给他排课，只让他跟课。跟课不是坐着听，是站在学生后面看，看谁在走神，看谁在抄。\n\n第二周他上第一节课，我坐最后一排。我不看他讲得对不对，我看学生有没有回头。\n\n学生回头，说明他讲的东西学生没接住；学生不回头，说明他被带进去了。\n\n有一次，一个刚来的老师讲色彩，讲了三十分钟理论，学生一个都没回头。下课我问他：你自己画的时候，是先想理论还是先动手？他愣了一下。第二天他改了讲法，先画，画到一半再讲。\n\n第三周我才跟他复盘。复盘只问三个问题：今天谁没听懂？你怎么知道的？下次怎么改？\n\n我不喜欢「你要多练」这种话。练是当然的，但新老师最缺的不是练，是有人告诉他，学生在哪里断掉了。\n\n我们这儿有个规矩：新老师前三个月，每节课我都听。听完不点评，只记录。三个月后一起看记录，他自己就明白了。\n\n还有一个细节：新老师上课，我会录下来。不是为了考核，是为了让他自己看。人看自己的录像，会脸红，也会记住。录像是面镜子：有的老师讲课时一直在抖腿，自己不知道；有的老师整节课没看学生一眼，自己也不知道。这种事我说十遍，不如他自己看一遍。\n\n带老师跟教学生是一回事：你不能替他画，你只能让他看见问题。\n\n我带过一个新老师，画得非常好，学生也喜欢他。\n\n第三个月，他跟我提离职。我问他为什么。他说，教不会。\n\n他说，有个孩子画了两个月，形还是不准，他每天讲，讲到自己也怀疑。\n\n我说，你再带一个月。一个月后，那个孩子的形准了。\n\n他没走。\n\n后来他跟我说，那天他差点放弃的，不是那个孩子，是他自己。\n\n带新老师，最难的不是教方法，是在他想放弃的时候，让他再等一个月。", "cat": "D", "form": "视频", "cost": "30 分钟", "tags": "#美术生 #央美附中 #画室 #校长", "title": "新老师入职，我们怎么带"}, {"id": "D4", "hook": "他们为什么离开大画室", "shoot": ["老师在自己工位上说，别在会议室", "背景要有画和颜料", "说到「叫出名字」时给一个改画特写"], "copy": "我们这儿有几位老师，原来在很大的画室。\n\n走的时候有人问他们为什么。答案很朴素：在大画室，一个老师带八十个学生，改画只能改前三排。\n\n前三排是画得好的，后五排是画得差的。中间那批不上不下的，最容易被忽略。可偏偏中间那批，才是大多数。\n\n有个老师跟我说，他在大画室干了一年，最难受的不是累，是每天下班都记不住自己改过谁的画。\n\n来我们这儿，一个老师带十几个，每个人的画都能改到。钱少一点，但手上是有活儿的。\n\n还有一件事：在大画室，老师是流水线上的一环，教案是统一的，进度是统一的。你只是一个执行的人。在这儿，老师要自己定这个孩子这周练什么。\n\n我问他，那你后悔吗。他说不后悔。\n\n他说，教了十年，第一次知道每个学生叫什么。\n\n这话我记了很久。因为一个画室好不好，不看它有多大，看它的老师能不能叫出学生的名字。\n\n我们这儿老师不多，但每个人都能说出班上十几个孩子的毛病：谁形不准，谁色偏灰，谁一到考试就手抖。\n\n后来我总结了一句话：大画室卖的是体系，小画室卖的是注意力。体系可以复制，注意力不能。注意力就是：这个孩子这个月卡在哪，我知道。知道，才能改；不知道，只能让他多画。\n\n这些东西，八十个人的班，记不住。\n\n有个老师从大画室来，第一个月很不适应。\n\n他说，以前学生画完就交，他改完就下一个，一天能改六十张。现在一个班十几个人，他反而不会改了。\n\n我说，以前你改的是画，现在你改的是人。\n\n改画只要动手，改人要动嘴，还要等。\n\n他花了半年才适应。适应之后，他跟我说了一句话：以前我一天改六十张，现在一天改十张，但我记得每一张是谁的。\n\n这句话，我后来写在了教研室的墙上。\n\n他后来把家搬到了燕郊，说离学生近一点。", "cat": "D", "form": "视频", "cost": "30 分钟", "tags": "#美术生 #央美附中 #画室 #校长", "title": "老师为什么离开大画室来阿祖"}, {"id": "D5", "hook": "请附中老师，一年花多少", "shoot": ["老师在教室上课的实拍（不拍正脸也可）", "白板写「课时费 2-3 倍」，手写体", "口播坐姿，背景是教室"], "copy": "我们这儿有几位老师，是从央美附中出来的，其中有人在附中教过书。\n\n请他们来上课，成本比普通老师高不少。具体数字我不方便说，但可以给个比例：一个这样的老师，课时费差不多是普通老师的两到三倍。\n\n有人问我值不值。\n\n我给你算另一笔账。一个孩子集训一年，学费加住宿加生活，十几万。这十几万里，如果老师的钱省下来，可能省两万。但这两万省掉的是什么？是「这个方向对不对」的判断。\n\n附中的评分标准，和外面画室的标准，不是一回事。同一张画，附中老师给 80，外面老师可能给 90。差这十分，就是孩子考不考得上的差别。\n\n我们有一年，一个孩子画得特别「漂亮」，外面的老师都说好。附中出来的老师看了一眼，说这张画方向错了，越画越远。当时家长不信。后来实考出来，专业分很低。\n\n从那以后，我就认定这笔钱不能省。\n\n贵的东西不一定对，但在「判断方向」这件事上，便宜往往是最贵的。\n\n我们现在的老师配置是：专业老师里，有附中背景的占一半以上；每个班一个主教、一个助教；每周一次教研，统一评分口径。\n\n有人算过一笔账：一个附中老师一年能带多少学生。算下来，他带来的不是课时，是判断力。判断力这东西，没法按小时计价。\n\n这些都不便宜。但一个孩子只有一次初三。\n\n请附中老师来上课，我们不是让他们代课。\n\n他们一个月来两次，一次讲评，一次教研。\n\n讲评的时候，学生把画摆一地，他一张一张看，看完分档，讲为什么。\n\n教研的时候，只对老师，不对学生。讲这个月的评分口径，讲哪些地方我们放宽了。\n\n有一次，他把我们评的二档全部降了一档。老师说太严了。他说，附中就是这么严。\n\n那天晚上，教研室的灯亮到十二点。\n\n这笔钱买的不是课时，是标准。标准一松，孩子就松。", "cat": "D", "form": "视频", "cost": "30 分钟", "tags": "#美术生 #央美附中 #画室 #校长", "title": "请附中老师来上课，我们为此花了多少钱"}, {"id": "D6", "hook": "一年900万，花在哪", "shoot": ["桌上摊开一张成本表（数字可打码，只露结构）", "手指逐行划过，镜头跟手", "结尾停在「老师工资」那一行"], "copy": "很多人以为画室很赚钱。我给你算一笔账。\n\n一年成本接近九百万。\n\n最大的一块是老师工资，占到四成多。我们老师多，师生比一比八，一个班十几个人配两个老师。这块我从来不压。\n\n第二块是场地和宿舍。燕郊的房租不便宜，宿舍要按人配，空一间就是纯亏。\n\n第三块是食堂、水电、画材损耗。画材是大头，一个集训的孩子一个月能用掉好几支白，颜料一盒一盒地开。\n\n还有一块外人看不见：空置。一个班招不满，教室照样要开灯、要有人、要排课。招生季没招满，这一年就得扛着。\n\n所以这个行业不是暴利，是重资产。你看到的学费，先要填这些坑。\n\n能省的地方很多：装修可以简单，设备可以二手，宣传可以少做。\n\n但有两块我不动：老师工资，和心理室。\n\n省老师工资，最后省掉的是学生；省心理室，最后省掉的是人。\n\n其他的都可以将就，这两样不行。\n\n有人问我，那你一年能剩多少。我说剩不了多少，钱基本都又投回去了。\n\n我们这行最贵的是人。一个好老师一年能带出十几个孩子，也能耽误十几个。钱花在人身上，不亏。\n\n我们一年到头，账上能剩下的钱，不够买一套北京的房。所以我不太敢跟人说这行赚钱。真赚钱的，不会这么算账。\n\n投在哪儿？投在下一届老师身上，投在下一间教室上。这门生意，赚的是慢钱。\n\n一个孩子一年到底花掉多少钱，我算过。\n\n学费是一部分，住宿是一部分，老师的课时摊到他头上又是一部分。\n\n一个班十几个人，配两个老师，老师的工资摊下来，每个孩子身上就是一笔不小的数。\n\n再加上场地、水电、画材、食堂。\n\n算完你会发现，学费里真正变成利润的，没有想象中多。\n\n所以我们不太敢做低价班。低价意味着要么减老师，要么减课时，要么减别的。\n\n减到最后，减的都是孩子。", "cat": "D", "form": "视频", "cost": "30 分钟", "tags": "#美术生 #央美附中 #画室 #校长", "title": "画室一年要花多少钱（重资产账本）"}, {"id": "D7", "hook": "21年，我停掉了高中部", "shoot": ["办公室，桌上放一份旧文件（可打码）", "口播到「砍掉」时停一拍", "插入空教室的空镜"], "copy": "2021 年，我把高中部停了。\n\n那几年高中部是赚钱的。高考集训客单价高、周期长、复购好，一个学生能带来三个学生的转介绍。所有人都说，你应该扩。\n\n那年也有人来找我谈，想收购、想注资，条件不差。谈得很客气，办公室的茶换了两泡。\n\n但我心里一直有个疙瘩：两个方向一起做，老师会被抽走。高考集训出分快、提成高，好老师自然往那边走。附中这边剩下的人，标准就会被稀释。\n\n还有一件事，我没跟别人说过。有一次我去高中部巡课，看见一个孩子在画一张特别「应考」的画，画得很熟，但眼睛里没有东西。我当时就想，如果我为了赚钱把这儿做成这样，那我当初为什么要开这个画室。\n\n所以我砍掉了更赚钱的那一半。\n\n很多人不理解，说你是不是傻。我说不傻，我只是不想把这件事做脏。\n\n现在只做附中一个方向，学生少了一半，收入也少了。但我每天还能坐下来画两个小时，还能记住每个孩子的名字。\n\n这个交换，我觉得值。\n\n有时候我也会想，如果当年扩了，现在会是什么样。可能会更大，也可能早就不是我在管了。\n\n但如果再来一次，我还是会停。有些钱赚了，晚上睡不着。睡不着的人，教不好孩子。\n\n后来有同行问我，你怎么忍住不扩的。我说，不是忍住，是想明白了：一个人一辈子能把一件事做透，已经很不容易了。\n\n停高中部那天，我把高中部的老师叫到会议室。\n\n我说，这个方向我们不做了，你们可以选择留下来带附中，也可以走，工资结到月底。\n\n没人说话。\n\n后来有两个人留下来，从高中课转到附中课，重新学了一遍评分标准。剩下的人走了。\n\n我送他们到门口，一个人说，老板你这一步走得太狠。\n\n我说是狠，但不走这一步，两边都做不好。\n\n那天晚上我一个人在高中部教室坐了很久。桌椅还在，人没了。", "cat": "D", "form": "视频", "cost": "30 分钟", "tags": "#美术生 #央美附中 #画室 #校长", "title": "我为什么停办高中部"}, {"id": "D8", "hook": "每年劝退 30 个交钱的家长", "shoot": ["办公室对坐，模拟谈话（家长可打码/背影）", "口播时手边放一支笔，转笔的小动作保留", "结尾给一个空镜：走廊"], "copy": "去年一年，我劝退了大概 30 个孩子。有家长当场就翻脸，说你这是不是看不起我们家孩子。\n\n不是看不起，是不想让你花冤枉钱。\n\n有个家长，去年 3 月带着孩子来，说要插班考央附。我看了孩子之前画的画，直接说来不及了，不收。家长特别不理解——离考试还有三个月，你为什么不收我的钱。\n\n因为我知道三个月能做到什么，做不到什么。这孩子的造型基础得从头纠，三个月连纠错的时间都不够。我收了这个钱，三个月后孩子考不上，你损失的是一年，我损失的是良心。\n\n我们画室有个规矩：当月你觉得阿祖不好，下个月随时走，一天的费用都给你退。办学到现在，我没用学费绑架过任何一个家庭。\n\n也有家长问我，那你劝退这么多，不赚钱了吗。\n\n赚。但我算的是另一笔账：你把一个不适合的孩子送进附中备考的路，他在这儿耗两年，考不上，回头连文化课都落下了——这个损失，比我的学费贵多了。\n\n所以我们从来没保证过谁能考上。我只保证一件事：孩子来之前，我会告诉你真实的情况。\n\n劝退这件事，做得越多，越不敢做得太顺。因为每一次说不，都可能伤到一个家庭。\n\n说这句话的时候，我一般不看家长的眼睛。因为我知道他接下来会说什么，而我没法给他想要的答案。\n\n有人劝我，话别说这么死，不好招生。我说，说死一点好，省得以后大家都不好看。\n\n劝退的孩子里，有一个后来回来了。\n\n第二年秋天，他妈妈带着他站在门口，说孩子想再试一次。\n\n我看了他的画，比去年好很多。我收了。\n\n他妈妈问我，你去年不是说他不适合吗。\n\n我说，去年不适合，不代表今年不适合。人是会变的。\n\n他后来考上了。\n\n这件事让我明白，劝退不是判决，是那个时候的判断。判断可以改，只要人变了。\n\n所以我现在劝退，都会加一句：如果你还想画，一年后可以再来。", "cat": "D", "form": "视频", "cost": "30 分钟", "tags": "#美术生 #央美附中 #画室 #校长", "title": "我为什么劝退学生"}, {"id": "D9", "hook": "8000 块，发给月考前五", "shoot": ["教室颁奖，正面机位", "红包/信封特写", "念名字时切学生反应（需授权，否则拍手）"], "copy": "我们每个月考完，前五名有奖学金，一共 8000。\n\n不是发给「进步最大」的，是发给前五名。\n\n有人问，这样对基础差的孩子是不是不公平。我说，考场本来就不公平。附中录取是按专业排名，不是按进步幅度。你进步 30 名，但排在第 60，还是考不上。\n\n所以奖学金的逻辑，就是考场逻辑：只看排名。\n\n发钱的时候我会念名字。有一次我故意最后念第一名，全场笑了一下，气氛就松了。我不想把这件事搞得太严肃，好像发的是奖金，其实是给孩子一个具体的坐标——你现在在哪儿。\n\n有个孩子第一次拿奖学金，拿了 2000，回去跟他妈说，这是我画出来的第一笔钱。\n\n钱不多，但它让「考好」这件事变得具体。比讲十句「你要努力」有用。\n\n也有人说，你这是用钱激励，太功利。我说，考试本身就是功利的。我们做的不是兴趣班，是备考。\n\n但我加了一句：拿不到也别灰心，这个月没拿到，下个月还有。\n\n后来有个孩子毕业回来，说当年那 2000 块他没花，一直留着。我听完没说话。\n\n那个孩子后来考上了。我不知道跟那 2000 块有没有关系，但我愿意这么想。\n\n钱不多，但它让一个孩子知道，画得好是有回报的。这个认知，比钱重要。\n\n奖学金不是目的，是让每个月的努力有个回声。\n\n八千块，五个人分，一人两千。\n\n有人问，为什么不给一个人八千。\n\n我说，一个人拿八千，其他四个人会觉得跟自己没关系。五个人分，前五名都有份，竞争的面就大了。\n\n发钱那天，我会让每个人说一句这个月做了什么。\n\n有人说改了起稿，有人说练了色彩。说完再发。\n\n钱是结果，话是过程。\n\n我希望他们记住的不是两千块，是自己说出口的那句话。\n\n有个孩子把钱存着，毕业才花。他说想留着，提醒自己拿过。", "cat": "D", "form": "视频", "cost": "30 分钟", "tags": "#美术生 #央美附中 #画室 #校长", "title": "每月 8000 元的奖学金给了谁"}, {"id": "D10", "hook": "双陪，陪学生也陪家长", "shoot": ["白板画两条线：学生 / 家长", "口播 + 手指白板", "插入家长群消息截图（打码）"], "copy": "很多机构说「陪跑」，其实只陪学生。我们的双陪，是两条线。\n\n陪学生四条。\n\n第一，定目标。不是定「考上央附」，是拆到每个月。这个月解决形体，下个月解决色调，再下个月卡时间。目标太大，孩子会慌。\n\n第二，养习惯。每天几点到、画几个小时、什么时候休息，都排出来。备考拼的不是灵感，是稳定性。\n\n第三，分层教学。一月一考，一人一方。同一个班，有人练结构，有人练色稿。\n\n第四，全程陪跑。从考学，到高中，到大学，到职业。这条最长，也最不像生意。\n\n陪家长两条。\n\n第一，消认知差。每天在群里反馈学习情况，不是发一句「今天很好」，是发他今天画了什么、卡在哪。\n\n第二，深沟通。不搞形式化的家长会，只解决问题。家长问「我孩子行不行」，我不能只回答「挺好的」。\n\n为什么要陪家长？因为备考这一年，家长比孩子更焦虑。家长乱了，孩子一定乱。\n\n我们做过统计，家长情绪稳定的家庭，孩子的月考波动明显更小。\n\n双陪最难的从来不是设计，是坚持。每天反馈，一年三百多天，断一天，家长就不信了。\n\n有一年我断了三天。一个家长直接打电话来问：是不是不打算管我们了。从那以后，我再没断过。\n\n所以说到底，双陪不是服务项目，是把一个家庭拉进同一条战线。\n\n每天的反馈，我们有一个固定格式。\n\n三句话：今天画了什么，卡在哪里，明天怎么改。\n\n不发「今天很好」，也不发「继续努力」。家长看不懂，孩子也用不上。\n\n有老师嫌麻烦，说每天发三句，一年就是一千多句。\n\n我说，一千多句换一个家长安心，值。\n\n后来有个家长把一年的反馈打印出来，订成一本，毕业的时候送给孩子。\n\n孩子翻了几页，哭了。\n\n那本东西不厚，但它是这一年。\n\n双陪最难的是每天，不是设计。", "cat": "D", "form": "视频", "cost": "30 分钟", "tags": "#美术生 #央美附中 #画室 #校长", "title": "\"双陪计划\"到底是什么"}, {"id": "D11", "hook": "「嫡系教学」是不是噱头", "shoot": ["办公室，语速稍快，有情绪", "插入老师上课片段", "结尾直视镜头 2 秒"], "copy": "有人说，「嫡系教学」是噱头。\n\n我认同一半。如果只是挂个名，那确实是噱头。\n\n但我们的老师里，有人是央美附中毕业的，有人在附中教过书，有人是我当年的班主任。\n\n这不是血统，是信息差。\n\n附中怎么判卷？一张素描，先看形体准不准，再看关系整不整，最后看完成度。这三条的权重，外面的人只能猜，在里面待过的人知道。\n\n我举个具体的。有一年，一个孩子画得特别细，细节抠得非常漂亮，外面的老师都说好。我们附中出来的老师看了一眼，说这张画方向错了——附中要的是整体关系，不是细节堆砌。后来实考出来，专业分确实不高。\n\n这件事之后我才明白，「嫡系」不是一个标签，是一套判断标准。\n\n你要说这是噱头，那你来解释一下：为什么同一张画，他们给的分数和我们给的不一样？\n\n我不否认行业里有人拿这个词骗人。但你不能因为有人骗人，就说这个词本身是假的。\n\n判断方法很简单：问他老师叫什么、在哪教过、现在还在不在教。答不上来的，就是噱头。\n\n所以别听我们怎么说，去看我们的老师是谁、教了多久、学生画成什么样。这三件事骗不了人。\n\n我们每年都有人来看，看完有的留下了，有的走了。走了的我也认，至少他是看了真东西才走的。\n\n我们这边，老师名字、履历、排课，都可以拿出来对。对不上的，你转身就走。\n\n有一次教研，两个老师为一张画吵起来。\n\n一个说这张画结构对，可以上二档。一个说画面太闷，只能三档。\n\n吵了二十分钟，谁也没说服谁。\n\n最后我们把附中近几年的高分卷翻出来，一张一张对。对完，大家都不说话了。\n\n那张画确实只能三档。\n\n从那以后，我们定了个规矩：争论不下的时候，不看谁资历老，看高分卷。\n\n标准这东西，吵不出来，只能对出来。", "cat": "D", "form": "视频", "cost": "30 分钟", "tags": "#美术生 #央美附中 #画室 #校长", "title": "一场关于\"嫡系教学\"的争论"}, {"id": "D12", "hook": "带你逛一圈阿祖", "shoot": ["一镜到底走动拍摄，手机稳定器", "每个空间停 3 秒，报一句用途", "不要配激昂 BGM，用环境声"], "copy": "很多人只在网上看画室的照片。今天带你走一圈。\n\n进门是接待和咖啡厅。家长等孩子的时候可以坐，有咖啡，也有热水。这块不赚钱，但家长一天要在门口等好几个小时。\n\n二楼是专业课教室。墙上贴的是这个月的作业，不是精选，是全班的。好的差的都贴，孩子自己会看。\n\n再往里是静物间。摆一组静物要花一个小时，高低、疏密、光影方向都要设计。同一堆东西，摆法不同，考题难度完全不同。\n\n然后是美术馆。不大，但每届都会换展。孩子的画挂上去，和贴在墙上，是两回事。\n\n心理咨询室在最里面。有沙发，有纸巾，窗帘是厚的。这一年孩子崩掉是常事，得有个地方让他坐一会儿。\n\n最后是宿舍和食堂。宿舍四人间，食堂每天有汤。\n\n一圈走下来你会发现，一个画室该有的样子，不是装修多好，是每个空间都有人在用。\n\n空着的房间再漂亮，也是摆设。\n\n如果你来看，最好挑一个上课的日子。空着的时候，哪个画室都好看。\n\n最后补一句：我们这儿没有样板间。所有你看到的东西，学生每天都在用。用旧了才换，不为了好看换。\n\n如果你来，我带你走一圈。走完你再决定要不要留下，我不催。\n\n我们这儿最贵的不是装修，是那些一直在用的东西：用秃的笔、贴满画的墙、坐塌了的沙发。\n\n参观的人问得最多的，是心理咨询室。\n\n有人问，这么小一间屋子，有用吗。\n\n我说，你去问用过的人。\n\n有个孩子在里面坐了三个下午，第四天回去上课了。他没跟我说过一句话，但我知道那间屋子有用。\n\n还有人问，为什么不把心理室改成教室，能多招几个人。\n\n我说，多招几个人，可能就多几个人撑不住。\n\n这间屋子不赚钱，但它让别的地方赚的钱，花得下去。\n\n参观完，有人问租金。我说不便宜，但每个房间都在用。", "cat": "D", "form": "视频", "cost": "跟拍半天", "tags": "#美术生 #央美附中 #画室 #校长", "title": "画室参观 vlog（美术馆 / 咖啡厅 / 心理室 / 宿舍 / 食堂）"}, {"id": "D13", "title": "咖啡厅为什么开在画室里", "hook": "画室为什么要开咖啡厅", "copy": "有人问我，画室开咖啡厅是不是不务正业。\n\n其实是给家长用的。\n\n陪读的家长，一天要在门口等好几个小时。总不能一直站着，也不能每次都去外面找地方坐。有个能坐、能喝口热水的地方，家长才待得住。\n\n后来发现，很多重要的谈话都发生在这儿。\n\n在办公室谈，家长是紧张的，坐得笔直，说话也客气。在咖啡厅，一人一杯，聊着聊着就说真话了。有个妈妈在这儿哭了半小时，说她把工作辞了来陪读，怕孩子考不上，怕自己白辞。这种话，在办公室她不会说。\n\n所以咖啡厅不是配套，是缓冲带。\n\n它不产出成绩，但它让家长有一个可以喘气的地方。备考这一年，家长比孩子更需要喘气。\n\n我们咖啡厅的墙上没挂宣传，挂的是学生画的画。有家长说，坐在这儿看画，心能静一点。\n\n咖啡不贵，十几块一杯。有的家长一天喝三杯，我也没劝。这一年他们太紧绷了，能坐下来喝完一杯，已经不容易。\n\n有个家长在这儿坐了一年，从孩子入学坐到考试。她说她不是来喝咖啡的，是来听别人家孩子怎么样的。人需要一点同类的声音。\n\n后来她孩子考上了，走的那天她把最后一杯的钱结了，说以后不来了。我送到门口，没说什么。\n\n也是因为这个，我才坚持不把它外包。外包出去，就变成一个卖咖啡的地方了。\n\n咖啡厅最忙的时候，是晚上八点。\n\n家长等着接孩子，一人一杯，坐着刷手机。\n\n有个爸爸，每天晚上来，坐最角落那张桌子，不喝咖啡，只要一杯热水。\n\n坐了一个月，我问他，你怎么不喝咖啡。\n\n他说，喝了睡不着，明天还要上班。\n\n后来我让厨房给他备了茶。\n\n他坐了一年，孩子考上了。走的那天，他把那张桌子的位置拍了张照。\n\n有些地方，人走了还会记得。\n\n那张角落的桌子，后来一直留着。", "shoot": ["咖啡厅实拍，拉花特写", "家长坐着的背影", "口播在吧台边"], "cat": "D", "form": "视频", "cost": "30 分钟", "tags": "#美术生 #央美附中 #画室 #校长"}, {"id": "D14", "title": "心理咨询室是干什么用的", "hook": "画室里的心理咨询室", "copy": "备考这一年，孩子崩掉是常事。\n\n月考掉了三十名、画到一半突然哭、晚上睡不着、说不想画了——这些不是矫情，是压力。\n\n所以我们有一间心理咨询室。不是为了出事才用，是每个月都过一遍。\n\n每个孩子入学做一次心理测评，之后每月更新。不是贴标签，是看他这个月状态有没有变。有的问题从画上看不出来，从档案上能看出来：线条突然变紧、颜色突然变灰、画面越画越空。\n\n有个孩子，连续两次月考都在往下掉。我把他叫到心理室，没谈画，问他昨晚几点睡。他说三点。再问，才知道他爸妈在闹离婚。这件事如果只看画，永远看不出来。\n\n我们还有心理课，每周一节，不讲大道理，讲怎么跟焦虑相处。\n\n有人问，这些跟考上有什么关系。关系很大。考场上，手抖一下，一张画就废了。\n\n我见过太多画得好的孩子，最后输在心态上。\n\n画得好不好是一时的，人垮了是一辈子的。\n\n心理老师不是我们自己的员工，是从外面请的，按小时算钱。贵，但专业。她每周来两次，一次上课，一次单独聊。\n\n有的孩子不愿意去，我不逼。我只说一句：那儿有沙发，你可以去坐十分钟，不说话也行。\n\n有些人觉得心理室是摆设。我不这么看。一个孩子在这儿坐十分钟，回去能画下去，这十分钟就值。\n\n这间屋子不产出成绩，但它接住过好几个差点垮掉的孩子。这就够了。\n\n心理室第一次用，是一个男孩。\n\n他进来不说话，坐了二十分钟，走了。\n\n第二天又来，还是不说话。\n\n第三天，他开口了，说，老师我觉得我画不下去了。\n\n我说，那就先不画。\n\n他愣了一下，说，可以吗。\n\n我说可以，今天你就在这儿坐着。\n\n他坐了一下午。第四天回去上课了。\n\n后来他考上了。走的时候跟我说，那天你说可以，我才敢停下来。\n\n有时候，允许一个人停，比催他跑有用。", "shoot": ["心理室实拍：沙发、纸巾、窗帘", "口播坐着说，语气放慢", "不要拍学生"], "cat": "D", "form": "视频", "cost": "30 分钟", "tags": "#美术生 #央美附中 #画室 #校长"}, {"id": "D15", "title": "咖啡拉花 vs 画色彩，校长的双面人生", "hook": "拉花和画色彩，是一回事", "copy": "我白天教色彩，晚上偶尔在咖啡厅拉花。\n\n有人觉得这是两个爱好。其实是同一个东西——控制。\n\n拉花控制的是奶泡的流速，画色彩控制的是水的多少。手一抖，两边都废。\n\n拉花最难的是收尾。一个心形，前面都好说，最后那一提，力度不对就散了。画色彩也一样，最后那几笔，决定画面是「整」还是「碎」。\n\n我拉花拉了两年，最大的收获不是会拉花，是手更稳了。以前画色彩，一笔下去重了，只能改；现在下手之前，手会先停半秒。这半秒，就是控制。\n\n有学生问我，老师你怎么什么都画。我说不是什么都画，是同一件事换了个方式练。\n\n拉花不能改，画错了只能重来。这一点比画画残酷，也比画画诚实。\n\n画画有橡皮，拉花没有。所以拉花逼着你一次到位，逼着你想清楚再动手。\n\n所以我不觉得这是放松。这是换一种方式练手。\n\n有学生学我拉花，拉了一个月全是歪的。我说正常，我拉了半年才拉出一个像样的心。\n\n手艺这东西没有捷径，只有次数。次数到了，手自己就记住了。\n\n现在我画色彩，收笔比以前稳。学生看不出来，但我知道。有些功夫，是别处练来的。\n\n你要是也在学画，可以找个类似的事练——不是为了好玩，是为了让手在没有橡皮的时候，也敢下笔。\n\n说到底，手稳了，画才稳。这两件事，我都是靠时间换的。\n\n拉花我失败过很多次。\n\n有一次，一个家长坐在吧台前，看我拉了五杯，全是歪的。\n\n她说，你这手艺不行啊。\n\n我说是不行，再练。\n\n第六杯，拉出一个勉强能看的心。她拍了照，发朋友圈，说校长拉的。\n\n后来她孩子考上了，走的时候跟我说，那杯咖啡是她这一年喝得最安心的一杯。\n\n我说那杯是歪的。她说歪的也好喝。\n\n手艺不行的时候，有人愿意等，这件事比拉花本身重要。", "shoot": ["左右分屏：拉花手部 / 调色手部", "同一段 BGM，节奏对齐", "结尾两个成品并排"], "cat": "D", "form": "视频", "cost": "30 分钟", "tags": "#美术生 #央美附中 #画室 #校长"}, {"id": "D16", "title": "画室哪一笔钱最不该省", "hook": "这笔钱，我一分不省", "copy": "画室能省的钱很多。\n\n装修可以简单，设备可以二手，宣传可以少做，办公室的沙发我坐了六年没换。\n\n但有两笔我不动。\n\n一是老师工资。我们这儿老师的课时费，比同城高出一截。有人劝我，你压一压，一年能省几十万。我说不压。省这笔钱，最后省掉的是学生。老师心里有气，课上就少讲两句；少讲两句，孩子就少会一点。这笔账，算不到报表上，但算得到成绩上。\n\n二是心理室。它不产出成绩，一年还要花不少钱。但它接住过好几个差点垮掉的孩子。有个孩子在这儿坐了三个下午，第四天回来上课了。\n\n其他的都可以将就，这两样不行。\n\n我见过太多画室，钱花在门面上，老师换了一茬又一茬。门面是给家长看的，老师是给孩子用的。\n\n家长看完门面就走了，孩子要在这儿待一年。\n\n我算过一笔账：一个老师一年少拿五万，他可能还在，但心不在了。心不在了，课上就少讲两句。\n\n少讲两句，一个班十几个人，就是几十个知识点没讲。这个账，怎么算都不划算。\n\n我们有个老师，孩子生病他先垫钱。这种老师你压他工资，他嘴上不说，心里会记。人心里有账，比纸上那本账重要。\n\n所以我的排序很简单：先保老师，再保孩子，最后才是门面。\n\n所以别问我怎么省钱，问我钱花在哪。我的答案只有四个字：人和孩子。\n\n有一年，我想省一笔钱。\n\n我把一个班的助教撤了，让主教一个人带。\n\n省了一个人的工资，一个月省几千。\n\n两个月后，那个班的改画次数掉了一半。孩子开始排队等老师，等到最后，有人不问了。\n\n期末月考，那个班整体掉了。\n\n我把助教请回来了，工资还涨了一点。\n\n从那以后，我再没动过老师这块。\n\n有些钱省下来是数字，花出去才是成绩。\n\n门面可以旧，老师不能将就。", "shoot": ["办公室算账，笔尖停在两行", "插入老师上课、心理室空镜", "口播短，别解释太多"], "cat": "D", "form": "视频", "cost": "30 分钟", "tags": "#美术生 #央美附中 #画室 #校长"}, {"id": "D17", "title": "宿管阿姨眼中的孩子们", "hook": "宿管阿姨比我知道得多", "copy": "宿管阿姨姓宋，她比我更了解这些孩子。\n\n谁几点睡、谁半夜还在画、谁三天没洗头、谁偷偷哭过——她都知道。\n\n有一次她给我发消息：302 今天没吃饭。我上去看，孩子月考掉了三十名，一个人坐在床上。\n\n很多问题不是从画上看出来的，是从生活里看出来的。\n\n孩子不会跟校长说「我撑不住了」，但他会不吃饭、会不洗头、会在被子里哭。这些事，只有天天在楼道里的人看得见。\n\n所以我们每周有一次碰头，宿管、教务、班主任坐一起，聊的不是成绩，是状态：谁最近不对劲。\n\n有一次宋阿姨说，有个孩子连续一周凌晨两点还亮着灯。我们查了，是在偷偷画，因为白天跟不上。后来给他调了进度，人才缓过来。\n\n一个画室好不好，不只看老师，也看这些「不教课的人」。\n\n宋阿姨在这儿干了七年。她儿子也在我们这儿学过画。她说她看着这些孩子，就像看着自己儿子。\n\n所以她的话我信。有些事老师看不出来，是因为老师只看画；她看得出来，是因为她只看人。\n\n她跟我说过一句话：孩子在这儿，最怕的不是考不上，是没人管。我记到现在。\n\n他们不产出分数，但他们知道谁快撑不住了。而撑不住这件事，往往比画不好更致命。\n\n一个画室真正的底，不是老师，是这些不教课的人。他们在，孩子才在。\n\n宋阿姨有一个本子。\n\n上面记着谁几点回宿舍，谁晚上没吃饭，谁这两天没说话。\n\n她不识字多，字写得歪歪扭扭，但记得很清楚。\n\n有一次她跟我说，302 那个孩子，这星期天天最后一个回。\n\n我去看，孩子在教室里画到十一点，画的是同一张画。\n\n我问他为什么，他说，这张画不好，我不敢交。\n\n后来我们陪他改了两个晚上。\n\n那个本子，比很多表格有用。因为它记的是人，不是数据。\n\n她记的不是违纪，是谁不对劲。", "shoot": ["宿管阿姨在楼道说话（需本人同意）", "走廊、门牌特写", "口播穿插，不要全程她讲"], "cat": "D", "form": "视频", "cost": "30 分钟", "tags": "#美术生 #央美附中 #画室 #校长"}, {"id": "D18", "title": "食堂每天吃什么（固定栏目）", "hook": "今天食堂吃什么", "copy": "食堂这件事，家长比孩子在意。\n\n集训期我要求每天有汤，因为孩子上火。荤素搭配，一周不重样。有孩子只打一个菜，我会让厨房加一份肉——不是心疼，是怕他下午画不动。\n\n画画是体力活。一天坐十个小时，看着不动，其实很耗。手要稳，眼睛要盯，脑子要转。吃不饱，下午第三个小时手就开始抖。\n\n所以我们食堂的标准不是「好吃」，是「扛得住」。\n\n早饭必须有鸡蛋，午饭必须有两个荤，晚饭清淡一点，晚上加一顿夜宵。\n\n有家长问我，伙食费能不能省。我说可以省，但省下来的是孩子的体力。\n\n也有孩子吃不惯，我们就单独做。南北口味差得远，一个广西孩子和一个东北孩子，吃不到一个锅里。\n\n吃得好不好，最后会反映在状态上。\n\n食堂师傅是本地人，做了二十年。他记得每个孩子的口味：谁不吃辣，谁不吃香菜，谁要加饭。\n\n这些事没人要求他做，他自己记的。有一年毕业，几个孩子专门去后厨跟他合影。\n\n有孩子毕业两年还回来吃饭，师傅记得他，多给一勺。这种地方不多，但值得有。\n\n这一年他们要扛的东西已经够多了，至少在吃饭这件事上，别再让他们将就。\n\n食堂不产出成绩，但它决定孩子能不能扛到考试那天。这件事没法量化，但每天都在发生。所以我们家的伙食费，从来不按最低标准走。\n\n食堂的菜单，我每周看一次。\n\n不是看贵不贵，是看有没有重复。\n\n连着三天土豆，孩子就不想吃了。吃不下，下午就画不动。\n\n师傅知道我挑剔，后来自己会把菜单排好，拿给我看。\n\n有一周他排了七天不重样，我问他怎么想的。\n\n他说，孩子离家在外，吃饭是他们一天里少数能自己选的事。\n\n这句话我记住了。\n\n所以食堂不是后勤，是孩子一天里少有的主动权。\n\n孩子吃得下，才画得动。\n\n这句话我常跟师傅说。", "shoot": ["打饭窗口、餐盘特写", "学生吃饭的背影", "每周固定同机位，做成系列"], "cat": "D", "form": "视频", "cost": "30 分钟", "tags": "#美术生 #央美附中 #画室 #校长"}, {"id": "D19", "title": "为什么学生放假还想回来", "hook": "放假了，他们还想回来", "copy": "放假第一天，就有学生在群里问：老师，我能回来画吗。\n\n不是因为我们管得松，是因为在这儿有人一起画。\n\n一个人在家画，画两小时就困了。在这儿，旁边有人在抠细节，你就不好意思停。\n\n环境这个东西，比自律管用。\n\n我见过太多孩子，在家计划得好好的，一天画八张，结果一张都没画完。不是懒，是没有参照。人需要一个「别人还在画」的气氛。\n\n所以我们假期也开着教室，不排课，谁想来谁来。\n\n有一年春节，大年初三，教室里有五个孩子。我没赶他们走，给他们点了外卖。\n\n后来这五个孩子，四个考上了。\n\n我不知道这跟他们假期来画有没有关系。但我知道，愿意在别人休息的时候坐下来的人，通常不会差。\n\n有个孩子放假回来，第一件事不是拿笔，是把自己的画从墙上取下来，重新贴了一遍。\n\n他说在家看不到自己的画，心里空。我听完没说话，给他换了个更好的位置。\n\n所以我从不把假期教室关掉。灯开着，就有人愿意来。灯一关，人心就散了。\n\n这也是我一直不想把画室做成「上课的地方」的原因。它得是一个能待住的地方。\n\n一个人画和一群人画，是两回事。前者靠意志，后者靠气氛。我们能给的，就是这个气氛。灯开着，总有人愿意来，这句话我信了整整十年，现在还是信的。\n\n那年春节，五个孩子在教室。\n\n我点了外卖，六个人围着画桌吃。\n\n有人问我，老师你怎么不回家。\n\n我说我家就在这儿。\n\n其实我家不在这儿。我只是觉得，他们都在这儿，我走了不像话。\n\n吃完，他们继续画。我在旁边看了一会儿，回办公室了。\n\n十二点，我上去关灯，还有两个人在画。\n\n我说，明天再画。他们说，再十分钟。\n\n我没关灯，坐在门口等。\n\n那十分钟，我记了很多年。\n\n灯开着，总有人愿意来。", "shoot": ["空教室 + 几个学生（假期）", "学生画画的手部特写", "口播在教室后排"], "cat": "D", "form": "视频", "cost": "30 分钟", "tags": "#美术生 #央美附中 #画室 #校长"}, {"id": "D20", "title": "从居民楼到夏威夷，十年画室变迁", "hook": "十年，搬了 8 次家", "copy": "第一间教室在居民楼六楼，没电梯，画架是二手的。\n\n搬一次家，就要重新布光、重新摆静物、重新让学生认路。有一次搬完，光调了一个星期，因为新教室的窗户朝北，光变了，画出来的颜色全偏。\n\n后来搬到夏威夷，一次一次扩，前后搬了八次。\n\n每次搬家都像重新开一次业。押金、装修、消防、桌椅、空调，一样一样来。最麻烦的是画室不能停课，学生还在上课，我们只能晚上搬。\n\n有人说你们现在挺像样。我说是啊，但最怀念的还是六楼那间——那时候没人管我们，画得特别野。\n\n现在条件好了，反而画得谨慎了。\n\n这十年，房子越搬越大，学生越来越多，成本从几十万涨到九百万。但有些东西不能变：老师得能改到每个孩子的画，孩子得能在这儿待得住。\n\n最后一次搬家，我在旧教室坐了一个下午。墙上还有学生留下的字，用铅笔写的，擦不掉。\n\n我没让人刷，就那么留着。新教室什么都好，就是没有那些字。\n\n新教室的墙是白的，什么都没有。我打算让学生重新往上写。十年后，又是一面墙。\n\n搬家搬到最后，我明白一件事：画室的面积不重要，重要的是里面的人在干什么。\n\n搬了八次，我才明白一件事：地方不重要，人在干什么才重要。这句话，我用了十年才懂。下一个十年，我希望这面墙还在。\n\n最后一次搬家，我们搬了整整一个星期。\n\n白天上课，晚上搬。画架、石膏、静物、书，一车一车拉。\n\n有个学生晚自习结束没走，帮我搬了一晚上画框。\n\n搬完他问我，老师，我们以后就在这儿了吗。\n\n我说是。\n\n他说，那挺好。\n\n后来他考上了，走的时候跟我说，他记得那个搬家的晚上。\n\n我说我都不记得了。他说，你当时一直在数画框，怕丢。\n\n有些记忆，你以为是自己的，其实是别人替你留着的。\n\n墙上的字，我留着没刷。", "shoot": ["新旧照片对比（老照片翻拍）", "现在的空镜推轨", "口播时手里拿一张老照片"], "cat": "D", "form": "视频", "cost": "30 分钟", "tags": "#美术生 #央美附中 #画室 #校长"}, {"id": "S1", "title": "考前一晚，我在办公室排考场", "hook": "考前一晚，我在排考场", "copy": "考前一晚，我把名单摊在桌上，一个一个排。\n\n排考场这件事，看起来是体力活，其实是心理活。\n\n谁坐窗边，谁坐门口，谁不能跟谁挨着——都得想。有两个孩子关系好，平时总说话，我就把他们分开。有个孩子一紧张就爱看别人，我让他坐最里面。\n\n还有几个孩子，上次考试坐门口，风一吹就分神。这次我都挪到了里面。\n\n排完已经十一点。第二天早上七点，我再去把座位贴一遍。贴的时候手会抖，怕贴错。\n\n这些事没人看见。家长看到的是孩子走进考场，孩子看到的是桌上有个名字。\n\n但它决定孩子坐下来那一刻，心里稳不稳。\n\n我带过一届，有个孩子平时画得很好，考试那天座位在门口，人来人往，他一上午没画进去。后来复读，我第一件事就是把他安排在最里面。\n\n第二年他考上了。\n\n考场这件事，我们能控制的很少。能控制的，就尽量做到。\n\n顺便跟家长说一句：考前一晚，别改孩子的作息。有的家长想让孩子早睡，八点就关灯，孩子反而一夜没睡着。平时几点睡，那天就几点睡。还有，第二天别问「考得怎么样」，问「中午想吃什么」。\n\n家长最常问三个问题。\n第一，座位能不能挑？不能，但可以跟我说孩子的特殊情况，我会考虑。\n第二，考前一晚睡不着怎么办？别硬躺，起来画两笔，困了自然睡。\n第三，要不要陪考？如果孩子主动说不用，就别去。他需要一次自己走进考场。\n\n排座位之前，我会先做一张表。\n\n表上三列：孩子的特殊情况、上次考试坐在哪、这次要避开什么。\n\n有的孩子怕风，有的孩子怕人走动，有的孩子一抬头就能看见钟，看见钟就慌。这些事家长不说，我们不知道；说了，我们能调。\n\n所以每年考前一周，我会在家长群发一句话：孩子有什么特殊情况，私信我。\n\n收到的往往不多，但每一条都有用。\n\n有一年，一个妈妈说孩子左耳听力不好，想坐右边。我调了。考完她说，这是她第一次觉得，画室真的在看她孩子。\n\n排考场这件事，做到最后，排的不是座位，是谁被看见。\n\n座位表贴完，我会拍一张照，存在手机里。第二天早上对照一遍，怕贴错一行。有一年真贴错过，一个孩子的名字贴到了隔壁考场，开考前十分钟才发现。从那以后，我贴完一定再看一遍。", "shoot": ["桌上摊开名单，手写标注", "夜里台灯，只拍手和纸", "结尾给一个空教室"], "cat": "D", "form": "视频", "season": "10-11月", "cost": "30 分钟", "tags": "#美术生 #央美附中 #画室 #校长", "win": "10/20–10/26"}, {"id": "S2", "title": "考完当晚，我一个人先看一遍卷子", "hook": "考完当晚，我先看一遍", "copy": "考完当天晚上，学生都走了，我一个人把卷子过一遍。\n\n不是打分，是看方向——这一个月练的东西，有没有落到画上。\n\n打分是第二天的事，而且有标准。看方向这件事，只有我能做，因为我知道这个月课上讲了什么。\n\n有一年我翻到第三张就停住了。因为发现全班都在犯同一个错：明暗交界线画得太硬。\n\n那不是学生的问题，是我讲的问题。我讲的时候只说了「要清楚」，没说「清楚不是死黑」。\n\n那天晚上我连夜改了第二天的课，把三张画并排放，让他们自己看差别。\n\n第二天讲评，我没说谁错，只问了一句：这三张，问题是不是同一个。全班点头。\n\n那一刻我才算把这堂课上完。\n\n所以考完那一晚，比考试本身重要。它决定了下一个月往哪儿走。\n\n家长最容易犯的一个错，是考完当晚追着问分数。孩子刚从考场出来，脑子里还是那张画，你一问，他就开始复盘，一晚上睡不好。分数第二天才出，那一晚让他空着。\n\n家长常问：考完要不要让孩子估分？我的建议是不要。估出来的分，十有八九比实际低，孩子会先崩一次。等成绩出来，再一起看画，那时候看的是问题，不是情绪。\n还有人问，什么时候复盘最合适。我的答案是：成绩出来后的第三天。第一天高兴或难过，第二天缓一缓，第三天才能谈事。\n\n我看卷子的时候，手边放一张纸，记三列。\n\n第一列，时间够不够。第二列，画面完整不完整。第三列，硬伤在哪。\n\n三列记完，一个班的共性问题就出来了。\n\n有一年，三列记完，我发现一半人败在时间上，不是画得不好。第二天我就把课改了，不讲技法，讲时间分配。\n\n还有一年，第三列写满的都是「灰」。我才意识到，那个月我讲色彩讲得太虚，学生没听懂。\n\n看卷子这件事，表面看学生，实际看老师。\n\n你讲什么，卷子上就有什么；你没讲透的，卷子上也没有。\n\n所以我看卷子的时候，最怕看到的不是差画，是我讲过但没讲透的东西。\n\n这张纸我留着，下个月再看，能看出改没改。教学这件事，靠记性不行，得靠纸。所以我的办公桌上，永远有一摞这样的纸，按月份夹好。", "shoot": ["深夜，一沓卷子摊开", "只拍手翻卷、笔尖", "口播压低声音"], "cat": "D", "form": "图文", "season": "10-11月", "cost": "15 分钟", "tags": "#美术生 #央美附中 #画室 #校长", "win": "10/20–10/26"}, {"id": "S3", "title": "讲评课，我先把最差的三张放出来", "hook": "讲评，先看最差的三张", "copy": "讲评课我有个习惯：先放最差的三张。\n\n不是羞辱谁，是因为好画大家都看得懂，差画才需要讲。\n\n放的时候不说是谁的。讲完再问一句：这三张，问题是不是同一个。\n\n全班点头的时候，这堂课才算开始。\n\n有一次，三张画放出来，全班都笑了。我没笑，我说：这三张里有一张是我画的。教室一下就安静了。\n\n那是我故意画的，我想让他们知道，犯错不丢人，看不出错才丢人。\n\n后来有个孩子跟我说，那堂课之后他敢问了。以前他怕问 dumb question，怕别人笑。\n\n讲评课最怕的，不是学生画得差，是学生不敢把差画拿出来。\n\n所以顺序很重要：先讲最差的，再讲最好的。先让他们知道错在哪，再让他们知道对在哪。\n\n反过来讲，前面讲得再好，后面讲差的，没人听得进去。\n\n家长看孩子的画，习惯找好的地方夸。我建议反过来：先问他「你自己觉得哪儿不对」。他答得上来，说明他在进步；答不上来，说明他还没看懂。看懂比画好更重要。\n\n家长常问：公开讲最差的画，会不会伤孩子自尊？我从不说是谁的。而且我告诉全班，那三张里有一张是我画的。\n孩子怕的从来不是被指出问题，是被当众认领。这两件事差得很远。\n所以讲评课的第一条规矩是：只讲画，不讲人。\n\n讲评课讲到最后，不是为了分高低，是为了让他们敢把画拿出来。\n\n讲评课的最后十分钟，我固定做一件事：让每个人写一句「今天我听懂了什么」。\n\n不许写「要认真」「要多练」，要写具体的。\n\n收上来，我挑三张念。念完不问对错，只问全班：这句话，你同意吗。\n\n同意的举手，不同意的说理由。\n\n有时候会吵起来。吵起来是好事，说明他们在判断，不是在记答案。\n\n有一次，一个孩子写：我今天才知道，灰不是颜色浅，是不敢重。\n\n这句话我记了很久。因为它是他自己想出来的，不是我灌进去的。\n\n讲评课讲到这个份上，才算讲完。\n\n后来我把这个环节固定下来，每节课最后十分钟，不许讲，只许写。写不出来的人，说明这节课他没听懂。下一节，我先讲他没写出来的那个。", "shoot": ["黑板/投影前三张画", "学生后脑勺反应", "口播站在画旁边"], "cat": "D", "form": "视频", "season": "10-11月", "cost": "40 分钟", "tags": "#美术生 #央美附中 #画室 #校长", "win": "10/20–10/26"}, {"id": "S30", "hook": "从第 8 名掉到第 38 名", "win": "10/20–10/26", "shoot": ["成绩单局部，名次清楚", "两副碗筷，不拍脸", "第二天教室里的画板"], "copy": "这次月考，有个孩子从第 8 名掉到第 38 名。\n\n出成绩那天，他没来上课。我打电话，他说不想画了。\n\n我说先别想画的事，出来吃顿饭。\n\n吃饭的时候他一句话不说。我也不问。吃到一半，他自己开口了：老师，我是不是不适合。\n\n我说不是。你这次退，是因为你换了一种画法。\n\n他愣住了。\n\n上个月他跟我说，想试试另一种起稿方式。我说可以，但会有阵痛。他试了，月考就掉了。\n\n掉 30 名，不是因为退步，是因为在改。\n\n第二天他回来上课，画得比之前慢，但形准了很多。\n\n这件事我没在班里说。说了，别的孩子会拿「改画法」当借口。\n\n家长常问：孩子排名掉了要不要紧？先看原因。是松懈，还是在改。两个原因，处理方式完全不一样。\n\n还有人问：那怎么判断？问老师。别问分数，问这个月他在做什么。\n\n后来他妈妈给我发了条消息，说孩子回家第一句话是：老师没骂我。我说我骂他干什么，他已经自己骂过自己了。\n\n排名是结果，原因是过程。家长盯结果，老师盯过程。\n\n这顿饭吃到九点。结账的时候他抢着付，我没让。我说等你考上，你请。\n\n他说行。那天晚上他回画室了，画到十点半，我关的灯。\n\n第二天早上，他比平时早到了二十分钟。有时候孩子不是不想画，是不知道还能不能画。\n\n那顿饭之后，我给他定了一个月的规矩：每周只盯一件事。\n\n第一周盯起稿，第二周盯明暗交界线，第三周盯时间，第四周什么都不盯，只看他画得顺不顺。\n\n一个月后，他的排名回来了一些，但更重要的是，他不再一掉名次就说不画了。\n\n我跟他说过一句话：排名是天气预报，不是判决书。下雨了带伞，不是原地不动。\n\n他后来把这句话写在了画板上。\n\n家长常问：孩子掉名次，要不要马上加课？先别加。先弄清楚他是怎么掉的，再决定加什么。加错了，等于往反方向推。\n\n他后来问我，老师你是不是早就知道我会掉。我说知道。他说那你怎么不拦我。我说拦了，你还是会试。有些跟头，得自己摔一次。\n\n排名会变，人不会因为一次排名就定型。", "cat": "D", "form": "视频", "season": "10-11月", "cost": "20 分钟", "tags": "#美术生 #央美附中 #画室 #校长", "title": "月考掉了 30 名，我先请他吃饭"}, {"id": "S4", "title": "成绩出来，我先在家长群发了一条消息", "hook": "成绩出来，我先发了一条", "copy": "成绩出来，我先在家长群发一条消息，不是分数，是一句话：\n\n这次掉队的，别急着骂孩子，先看他这一个月睡够没有。\n\n然后才是成绩单。\n\n顺序很重要。先给情绪一个出口，家长才听得进数字。\n\n我见过太多家庭，成绩一出来，第一句话是「你怎么考成这样」。孩子本来就在自责，这一句下去，接下来一个月都缓不过来。\n\n有一次，一个孩子掉了四十名。他妈在群里没说话，私信我：是不是他不适合。\n\n我回：他这一个月每天画到十二点，不是不适合，是方法不对。\n\n后来我们调了训练重点，下个月回到前二十。\n\n成绩单是冷的，但发成绩单的人可以是热的。\n\n这一条消息，我每次都发。发完之后，群里会安静十分钟，然后才有人问分数。\n\n那十分钟，就是家长在消化。\n\n成绩出来那天，家长的第一句话，决定孩子接下来一个月的心态。你骂他，他接下来一个月都在证明自己不行；你说「我们一起看看问题在哪」，他才敢把画拿出来。\n\n家长常问：孩子考砸了，第一句话该说什么？\n我的建议是：先别说话，给他倒杯水。等他自己开口。\n他如果不说，你就说一句「我知道了」。四个字，够了。\n孩子那时候最怕的不是被骂，是被失望。你先稳住，他才敢说话。\n\n这一条消息我每次都发，五年没断过，因为我知道那十分钟有多重要。\n\n那条消息发出去，群里一般会安静十分钟。\n\n十分钟后，第一个说话的，往往不是考得好的家长，是考得差的。\n\n有一年，一个爸爸私信我：老师，我不知道怎么跟他说话。\n\n我说，你先别说话，陪他吃顿饭。\n\n第二天他发来一张照片，父子俩在面馆，谁都没看镜头。\n\n后来那个孩子跟我说，那天他爸没问成绩，他心里反而过意不去，自己把卷子拿出来了。\n\n成绩出来那一天，家里最该做的，不是复盘，是让孩子知道：你还在。\n\n有个妈妈后来跟我说，那条消息她截了图，存在手机里。孩子每次考砸，她就翻出来看一遍。我说那不是给你看的，是给我自己看的。提醒我，成绩出来那天，先当个人，再当老师。", "shoot": ["手机屏幕特写，打字过程", "发送键按下的瞬间", "口播在办公室"], "cat": "D", "form": "图文", "season": "10-11月", "cost": "10 分钟", "tags": "#美术生 #央美附中 #画室 #校长", "win": "10/27–11/02"}, {"id": "S5", "title": "一个孩子从 B 班调到 A 班，他妈发了条消息", "hook": "从B班到A班，他妈妈发来一条", "copy": "月考完，有个孩子从 B 班调到 A 班。\n\n当天晚上他妈妈发来一条消息，很长，我没看完就回了两个字：应该的。\n\n第二天她来送孩子，站在门口没进来，眼睛是红的。\n\n分班这件事，对我们只是名单上挪一行，对一个家庭是半年。\n\n这个孩子在 B 班待了三个月。第一次月考，他排在 B 班倒数十名。他妈妈每周来接他，都在门口站很久。\n\n有一次她问我：老师，他是不是就这样了。\n\n我说不是。他手上是有东西的，只是画得慢。\n\n后来我们给他加了速写，每天多画二十张。三个月，他追上来了。\n\n调班那天，我没在群里说，只在班上念了他的名字。\n\n他站起来的时候，全班鼓掌。他低着头，耳朵是红的。\n\n分班不是为了分层，是为了让每个孩子在合适的速度上跑。\n\n但家长不看这个，家长只看「我孩子在哪一层」。\n\n分班这件事，家长最容易过度解读。进了 A 班不代表稳了，掉到 B 班也不代表完了。它只是一个阶段性的位置，下个月还能动。别把一次分班，说成对孩子整个人的判断。\n\n家长常问：分到 B 班是不是就没希望了？\n不是。分班看的是这个月的状态，不是这个人的上限。我们这儿有个孩子，在 B 班待了半年，最后考上了。\n还有家长问，要不要跟孩子说「你被降班了」。我说，说「你换了个班」就行。同一件事，两种说法，孩子接收到的完全是两回事。\n\n分班这件事，我们每月做一次，规则提前说清楚。\n\n月考成绩占七成，平时作业和改画占三成。名单出来，先跟孩子谈，再跟家长谈。\n\n为什么要先跟孩子谈？因为他是要去那个班上课的人。\n\n有一年，一个孩子从 A 班掉回 B 班，谈的时候他说，老师我早就知道会掉，我这两个月没画进去。\n\n他自己知道，比我们说一百句都强。\n\n分班不是给人贴标签，是给努力换一个匹配的环境。\n\n掉下去不可怕，可怕的是掉下去之后，没人告诉他为什么。\n\n分班名单我一般晚上发，不发群里，一个一个私信。发完关手机。因为接下来会有很多问题，我需要第二天有精神回答。", "shoot": ["手机消息截图（打码）", "门口送孩子的背影", "口播在走廊"], "cat": "D", "form": "图文", "season": "10-11月", "cost": "10 分钟", "tags": "#美术生 #央美附中 #画室 #校长", "win": "10/27–11/02"}, {"id": "S8", "title": "早上六点半，教室已经有人了", "hook": "六点半，教室已经有人", "copy": "早上六点半，我推门进去，已经有人在画了。\n\n不是我叫的，是他自己来的。\n\n我问他几点到，他说六点。我说你怎么不睡会儿，他说睡不着。\n\n这种孩子你不用管，你只要别打扰他。\n\n我给他倒了杯热水，放在旁边，没说话。\n\n后来我才知道，他每天五点五十起，因为他说早上脑子最清楚，画结构最准。\n\n这个孩子最後考上了，专业排名很靠前。\n\n但我记住的不是他的成绩，是他六点半坐在那儿的背影。教室里就一盏灯，他一个人，画得很安静。\n\n我见过很多努力的孩子，但真正让我记住的，是那种不需要人催的。\n\n努力这件事，装不出来。你可以在老师面前画一下午，但你不会为了装，早上六点起床。\n\n所以我看一个孩子能不能考上，不看他画得多好，看他几点来。\n\n看到别人家孩子六点起床，别回头就骂自己孩子。每个人的节奏不一样，有人早上清醒，有人晚上清醒。你要找的是他的高效时段，不是复制别人的时间表。\n\n家长常问：孩子起不来，要不要逼？\n我的建议是：先定一个他能做到的时间，比如七点，坚持两周，再往前调。一上来就定六点，三天就崩了。\n习惯是长出来的，不是逼出来的。\n还有人问，要不要陪着早起。如果他能自己起，你就别陪；陪，是给他一个依赖。\n\n所以我从不统计谁来得早，我只记谁坚持得久。\n\n早到不等于有效，这是我后来才想明白的。\n\n有个孩子也六点半到，但他在画室里削笔、翻手机、看别人画，一早上画不了半张。\n\n所以我不再只看谁来得早，我看谁画完了第一张。\n\n我们后来定了个规矩：早到的人，先画一张速写，画完再吃早饭。\n\n一张速写二十分钟，画完手就热了，一天的状态都不一样。\n\n早起这件事，本身不值得夸。夸的是他把早起的时间用在了哪儿。\n\n家长常问：孩子起得早，是不是就努力？不一定。看他那一个小时干了什么。\n\n六点半的教室，我后来装了一个小灯，暖光的。早上来得早的孩子，不用开整间教室的大灯。一盏灯，一个人，一张画，那个画面我看了很多年。我不打扰，是因为我知道，那种安静很难得。", "shoot": ["清晨空镜，窗户光", "学生背影 + 画架", "环境声，别配乐"], "cat": "D", "form": "视频", "season": "10-11月", "cost": "15 分钟", "tags": "#美术生 #央美附中 #画室 #校长", "win": "10/27–11/02"}, {"id": "S6", "title": "降温第一天，我去宿舍翻被角", "hook": "降温第一天，我去翻被角", "copy": "降温第一天，我去宿舍，一个一个掀被角。\n\n看被子够不够厚，看有没有人还盖着夏凉被。\n\n有个孩子说不用，他不冷。我摸了一下他的手，是凉的。\n\n当天晚上，后勤加了被子。\n\n这件事我每年都做。因为孩子不会说「我冷」，他会说「还行」。尤其是男生，觉得说自己冷很丢人。\n\n还有一次，一个孩子发烧到三十八度五，还在画。我把他拽去医院，他一路说没事。\n\n回来他跟同学说，校长比我妈还烦。\n\n我听见了，没生气。\n\n集训这一年，孩子离家几百公里。他们不会照顾自己，也不愿意承认需要照顾。\n\n所以这些事得有人做。不是职责，是常识。\n\n一个画室冷不冷，不看空调，看有没有人掀你的被角。\n\n孩子在外地，家长能做的其实不多。别每天问「吃了吗」，问「今天画得顺不顺」。前者他会敷衍你，后者他会跟你说真话。还有，寄东西别寄零食，寄双厚袜子更实在。\n\n家长常问：孩子总说「不冷」，怎么判断真假？\n摸手，别摸脸。手凉就是冷，嘴硬没用。\n还有人问，生病了要不要接回家。我的建议是：发烧超过三十八度就接走。别让他硬扛，扛一次，后面一个月都缓不过来。\n\n这些事不在课表上，也不在成绩单上，但它们在。家长记住一个画室，往往不是记住教了什么，是记住这些。\n\n降温那几天，我有一张清单。\n\n被子够不够厚，袜子够不够，热水袋有没有，窗户漏不漏风，洗澡水热不热。\n\n五件事，一间一间看。\n\n有一年，一个家长寄来一床薄被，说孩子怕热。我摸了一下，那被子在燕郊的十一月不够。我让后勤加了一床，没跟家长说。\n\n后来孩子妈妈来，看见床上两床被子，问我是不是孩子要的。我说是我加的。\n\n她愣了一下，说了句谢谢。\n\n这些事不大，但孩子在外地，能靠的就是这些不大不小的事。\n\n清单上的五件事，我每年都看。看久了会发现，孩子不说冷不冷，但被子的厚度不会骗人。有一年降温特别快，我一晚上跑了三层楼，加了七床被子。第二天没人感冒，我觉得值。这些事没人写进总结，但它们决定孩子能不能坐得住。", "shoot": ["宿舍，手掀被角", "走廊暖气/窗户", "口播在宿舍门口"], "cat": "D", "form": "视频", "season": "10-11月", "cost": "30 分钟", "tags": "#美术生 #央美附中 #画室 #校长", "win": "11/03–11/09"}, {"id": "S7", "title": "食堂开始每天加一锅汤", "hook": "天一冷，食堂加一锅汤", "copy": "天一冷，食堂就开始每天加一锅汤。\n\n不是为了好喝，是因为集训期孩子上火、嘴裂、嗓子哑。\n\n有的孩子不喝，我就站在旁边看着他喝完。\n\n他嫌麻烦，我说你喝完了我就不站了。\n\n这些事跟成绩没关系，但跟能不能坚持到考试有关系。\n\n我带过一届，十二月有个孩子连续感冒三次，一次一周。一个月没画出完整的东西。后来他妈来，说在家从不生病。\n\n不是水土不服，是累的。一天画十个小时，免疫力就下来了。\n\n所以食堂的汤里放了什么，我不管。我只要求每天有，热的，管够。\n\n有家长问我，你们伙食费多少。我说这个不重要，重要的是孩子这一年别倒下。\n\n考试的战场在五月，但身体是十一月就开始消耗的。\n\n一锅汤不值钱，但它是一个信号：有人在意你冷不冷、累不累。\n\n家长总怕孩子吃不好，其实更该怕的是睡不够。集训期孩子一天画十个小时，睡眠不足，免疫力就下来了。你与其寄补品，不如跟老师确认一句：他几点睡。\n\n家长常问：孩子吃不下饭怎么办？\n先看是不是压力大。集训期吃不下，多半不是菜的问题，是心里有事。\n还有人问，要不要寄补品。我的建议是别寄。孩子缺的不是营养，是睡眠。\n最后一个问题：食堂卫生怎么样。这个我不解释，你随时可以来看。\n\n汤这件事，我后来做成了一个固定动作：每天晚饭，班主任站在汤桶旁边。\n\n不催，也不说话，就站着。\n\n孩子过来，自己盛一碗。不想喝的，绕过去，也不拦。\n\n奇怪的是，站了一个月，喝汤的人越来越多。\n\n不是因为汤好喝，是因为有人在那儿。\n\n集训期的孩子，最缺的不是营养，是有人惦记。\n\n一锅汤，就是一个看得见的惦记。\n\n汤的种类不重要，重要的是每天都有。今天是萝卜，明天是紫菜，孩子记不住，但身体记得。有一年我出差三天，回来发现汤停了。我问为什么，说没人安排。从那以后，我把这件事写进了后勤的表里。制度比人可靠，人走了，汤还得在。\n\n食堂的事，家长看不见，但孩子每天在吃。你可以不问，我不能不做。这就是后勤。", "shoot": ["大锅、盛汤、热气", "学生端碗的手", "口播在食堂"], "cat": "D", "form": "图文", "season": "10-11月", "cost": "10 分钟", "tags": "#美术生 #央美附中 #画室 #校长", "win": "11/03–11/09"}, {"id": "S9", "title": "双十一，我给学生囤了一批画材", "hook": "双十一，我囤了一堆画材", "copy": "双十一，我给学生囤了一批画材。\n\n颜料、纸、笔，都是消耗品。集训期一个学生一个月能用掉好几支白，颜料一盒一盒地开，纸一天几张。\n\n有家长说不用买，家里有。我说家里的和考场上的不是一回事。\n\n考场上用的是你练了一年的那支笔、那一牌颜料。平时换来换去，考场上手会认生。\n\n工具这件事，不能将就。\n\n我见过一个孩子，平时用便宜颜料，考试前家长给买了贵的，结果考场上调不出平时的颜色，因为贵的颜料覆盖力强，他手重，一下就糊了。\n\n这不是颜料的问题，是换工具的时间不对。\n\n所以我们的做法是：开学就统一，一年不换。要换，等考完。\n\n家长常问：要不要给孩子买贵的画材？我的建议是：先按老师说的买，别自作主张升级。工具是手的延伸，换得太勤，手会乱。\n\n还有人问：双十一囤一年够不够？够，但别囤太多。颜料放久了会干，纸放久了会潮。\n\n买画材这件事，省钱不是目的，稳定才是。\n\n家长常问：画材是不是越贵越好？不是。是越稳定越好。孩子的手是认工具的，换一次，要重新适应一周。这一周，可能就是月考的一周。\n\n还有两个问题。第一，画材要不要统一买？要，我们开学就统一，一年不换。第二，孩子自己挑行不行？可以挑，但要挑同一个牌子，别今天这个明天那个。\n\n开学的时候，我们会给每个孩子一张工具清单。\n\n铅笔哪几支，橡皮哪一种，颜料哪几个色号，纸什么克数。\n\n清单上写清楚：一年内不要换。\n\n为什么？因为手是有记忆的。你换了纸，笔感就变；换了颜料，覆盖力就变；换了橡皮，擦出来的边就变。\n\n考场上，你带的是练了一年的工具，不是新买的工具。\n\n有家长觉得，买贵的总没错。我说贵不是问题，换才是问题。\n\n工具这件事，稳定比升级重要。\n\n清单我们每年开学发一次，家长签字，孩子贴在本子上。不是形式，是让他知道，这一年工具不换。有人问，用完了怎么办。用完了买同款，不是买更好的。手认的不是价格，是熟悉。这一点，很多家长想不到。\n\n工具稳定，手才稳定。", "shoot": ["拆快递，堆成小山", "颜料管、纸的特写", "口播坐在画材堆旁"], "cat": "D", "form": "视频", "season": "10-11月", "cost": "10 分钟", "tags": "#美术生 #央美附中 #画室 #校长", "win": "11/03–11/09"}, {"id": "S25", "hook": "两条路，不能一起走", "win": "11/03–11/09", "shoot": ["办公室桌上摊开两张招生简章", "手指点在「考试科目」上", "结尾镜头停在孩子的画上"], "copy": "十一月的咨询，十个家长有六个问同一句话：统考和央美附中，能不能一起准备。\n\n我说能，但要有主次。\n\n统考考的是三科，标准化，判卷看档位。央美附中考的是造型能力，看的是基本功和感受。两个方向，训练方法不一样。\n\n一起准备的结果，通常是两边都沾一点，两边都不深。\n\n我见过一个孩子，统考考了 260 多，附中初试没过。也见过附中过了的，统考只考了 220。不是谁高谁低，是两条路的评价标准不一样。\n\n所以每年这个时候，我都会让家长和孩子坐下来，选一条主路。\n\n怎么选？看三件事：孩子想不想、文化课够不够、家里能不能接受多读一年。\n\n想清楚这三件，路就清楚了。\n\n我一般不劝人选附中。附中难，四年，出来还要考大学。但如果孩子真的喜欢画，附中给的东西，别的地方给不了。\n\n家长常问：选了附中，统考还要不要考？要，保底。但训练以附中为主。\n\n还有人问：能不能先考统考，考完再准备附中？可以，但只剩三四个月，很紧。\n\n去年有个女孩，统考模考 250，附中模拟考也不错。她妈想两条都保。我跟她说，保不了，精力是有限的。最后选了附中，统考只上了个本科线。她现在在附中读高二，上周回来，说值。\n\n两条路都能走，但不能同时走。选一条，走到底，另一条当保底，不当退路。\n\n两条路的时间也不一样。\n\n统考一般在十二月，附中考试在五月。\n\n如果你主攻附中，十二月统考当一次练兵，考完立刻回到附中的训练。中间不要停超过两周。\n\n如果你主攻统考，附中的内容可以放一放，但素描石膏像还是要练，那是通用的底子。\n\n最怕的是十二月考完统考，觉得松了一口气，一月二月松过去，三月才发现附中的东西没练。\n\n两条路都能走，但时间表要提前排好。\n\n去年那个女孩，最后统考只上了本科线，附中过了。她妈后来跟我说，早知道就不该两头抓。我说不是两头抓的问题，是没早点选。选路这件事，越早越省力。拖到十一月，两条路都只剩半条。她现在在附中读高二，回来还说，值。", "cat": "D", "form": "视频", "season": "10-11月", "cost": "15 分钟", "tags": "#美术生 #央美附中 #画室 #校长", "title": "统考和附中，别一起准备"}, {"id": "S28", "hook": "三十个格子，一人一格", "win": "11/03–11/09", "shoot": ["柜子全景，编号清楚", "早上学生排队放手机", "晚上开柜门的手"], "copy": "十一月我在教室门口装了个柜子，三十个格子，一人一格，早上交手机，晚上拿。\n\n装之前，有老师反对，说学生会反感。\n\n我说先试一个月。\n\n第一个星期，真有人不适应。有个孩子晚上来跟我要手机，说要查资料。我给了，站在旁边看他查。他查了两分钟，开始刷视频。\n\n第二个星期，没人来要了。\n\n为什么？因为大家发现，画画的时候不看手机，一节课能多画半张。\n\n半张不多。但一天两节，一周六天，一个月就是二十四张。\n\n我不是反对手机。我自己也刷。但在画室里，手机是最大的干扰源。\n\n有家长问我，这样管，孩子会不会逆反。会，头一周会。第二周就习惯了。\n\n家长常问：回家要不要收手机？不用。家里的事家里管，画室只管画室这八个小时。\n\n还有人问：那孩子有事找家里怎么办？柜子旁边有座机，随时能打。\n\n有个孩子跟我说，交了手机之后，晚上回宿舍不知道干什么。我说正好，早点睡。他后来跟我说，那是他这半年睡得最好的一个月。\n\n手机不是敌人，随时能拿到手机才是。\n\n我们没装信号屏蔽器，也没搜身。规矩摆在那儿，愿意守的留下，不愿意的，我也不想为一部手机天天吵架。\n\n有老师说，这样太松。我说不是松，是把选择权还给他。他连一部手机都管不住，考场上也管不住自己。\n\n手机柜用了一个月，我让老师记了一个数：每人每天画完几张。\n\n第一个星期，平均每人每天两张半。第四个星期，三张半。\n\n多出来的一张，不是靠催，是靠少了那几十次拿起手机。\n\n有家长担心，孩子会不会偷偷带第二个手机。有，抓到过。\n\n我没没收，也没当众批评，只让他把第二个也放进去。\n\n规矩是给愿意守的人定的。不愿意守的，你装十个柜子也没用。\n\n有个家长问我，孩子要是偷偷带手机怎么办。我说带就带，抓到了也不骂，让他自己放进去。教育不是抓贼，是让他自己选。后来那个孩子真被抓到一次，自己放回去了。第二次没再带。规矩立住，不是靠罚，是靠他自己认。\n\n手机管不住的人，时间也管不住。先从手机开始。", "cat": "D", "form": "图文", "season": "10-11月", "cost": "15 分钟", "tags": "#美术生 #央美附中 #画室 #校长", "title": "我在教室门口装了手机柜"}, {"id": "S10", "title": "有孩子说「我怎么越画越差」", "hook": "他说，我怎么越画越差", "copy": "有孩子跟我说：老师，我怎么越画越差。\n\n我说这是好事。\n\n因为你现在能看出自己差了。三个月前你看不出来，那时候你觉得每张都挺好。\n\n眼高手低不是退步，是眼睛先长上去了，手还没跟上。\n\n再画一个月。\n\n这个阶段最难熬。孩子会怀疑自己，家长会怀疑老师，老师会怀疑方法。三方都在动摇。\n\n我带过很多届，几乎每个孩子在第三四个月都会经历一次。有的人熬过去了，有的人没有。\n\n熬过去的分两种：一种是硬扛，一种是有人陪着扛。\n\n我们能做的是第二种。不谈大道理，就陪他画。他画一张，我改一处。改完他自己看，看懂了，信心就回来一点。\n\n家长常问：孩子说自己越画越差，是不是方法不对？我的建议是：先别换方法。这个阶段换方法，等于把前面的积累全推翻。\n\n还有人问：要不要给孩子减压？减，但别停。停一周，手就凉了。\n\n眼高手低是好事，说明他在长。真正可怕的是眼低手低，还觉得自己挺好。\n\n家长常问：孩子说自己越画越差，是不是该换个老师？我的建议是：先别换。这个阶段换，等于把积累推翻。先陪他熬过去，熬不过去再谈。\n\n还有个问题：这个阶段要多久？一般一到两个月。短的一个月，长的三个月。熬过去的人，后面会很稳；熬不过去的人，会在这个阶段放弃。\n\n这个阶段，我会做一件事：把他三个月前的画翻出来，和现在放在一起。\n\n不评价，只让他自己看。\n\n大部分人看完会说：以前这里不对，以前那里也不敢画。\n\n我说对，你现在能看出来了。\n\n看出来，就是进步。\n\n眼高手低这四个字，重点在「眼高」。眼不高，手永远不会高。\n\n所以这个阶段，我不让他改画法，只让他多看、多改、多问。\n\n熬过这一两个月，手会慢慢追上来。\n\n我后来给这个阶段起了个名字，叫「长眼睛」。眼睛先长，手后长。长眼睛的时候，人会特别难受，因为他第一次看见自己的差。看见，是好事。我带过的孩子里，进步最快的，都是在这个阶段没跑的。\n\n眼高了，手才有方向。这个阶段，别催。\n\n这个阶段，家长能做的是别催。话说多了，反而乱。", "shoot": ["走廊谈话，侧机位", "学生低头的手", "口播短句，语速慢"], "cat": "D", "form": "视频", "season": "10-11月", "cost": "20 分钟", "tags": "#美术生 #央美附中 #画室 #校长", "win": "11/10–11/16"}, {"id": "S11", "title": "我把全班拉到操场上跑了两圈", "hook": "我把全班拉到操场跑两圈", "copy": "有一天下午，我把全班拉到操场上跑了两圈。\n\n没人想跑。跑完有人蹲在地上喘。\n\n我说：你们现在这个状态，画什么都画不进去。先把自己弄累，再回来画。\n\n那天晚上，教室特别安静。\n\n为什么这么做？因为那段时间，班里有一种说不出的浮。不是不努力，是努力得很急。每个人都在赶，但没人画进去。\n\n这种状态，讲道理没用。你让他静心，他更躁。不如让他累一次，身体的累会把心里的躁压下去。\n\n跑完那天，有个孩子说，这是他一个月来第一次脑子是空的。\n\n空下来，才装得进东西。\n\n家长常问：孩子压力大，要不要让他休息几天？我的建议是：休息不等于躺着。躺着刷手机，压力更大。让他去跑、去走、去出点汗，比睡一天管用。\n\n还有人问：这样会不会耽误时间？两个小时，换一个能画进去的晚上，值。\n\n备考拼的不是时长，是有效时长。\n\n还有两个问题。第一，多久跑一次？一个月一次，别多。第二，不跑步行不行？可以，打球、跳绳都行，只要让他喘。\n\n所以我不怕他们跑不动，我怕他们坐不住。身体累一点，心反而能静下来。\n\n这个习惯后来留下了：每月月考完，挑一个下午把全班拉出去动一动。不是为了锻炼，是为了让他们从画里抬起头。\n\n跑完那两圈，我没有马上让他们回教室。\n\n我让他们在操场边坐了十分钟，不许说话。\n\n十分钟后，有人开始看天，有人开始看自己的手。\n\n那十分钟，比跑两圈有用。\n\n后来这个动作固定下来：月考完的下午，先动，再静。\n\n动是把身体里的躁放出去，静是把脑子里的东西收回来。\n\n一放一收，人才回得来。\n\n操场那十分钟，我后来加了一句话：谁也不许说「我不行」。可以说累，可以说烦，不可以说不行。因为「不行」是结论，累和烦是状态。结论一下，人就停了。这句话我后来也用在自己身上。累的时候不做决定，睡一觉再说。\n\n跑两圈解决不了问题，但能让人有力气面对问题。后来我发现，孩子不是不想静，是身体里没地方放那股躁。动一动，就放下了。放下了，才坐得住。", "shoot": ["操场，跑动的背影", "跑完喘气、蹲下", "回教室的空镜"], "cat": "D", "form": "视频", "season": "10-11月", "cost": "20 分钟", "tags": "#美术生 #央美附中 #画室 #校长", "win": "11/10–11/16"}, {"id": "S12", "title": "一个学生想请假，我批了三天", "hook": "他要请假，我批了三天", "copy": "一个学生来请假，说想回家。\n\n按规矩我该问原因、该劝。我没问，直接批了三天。\n\n他走的时候我加了一句：回来的时候，带一张你在家画的画。\n\n三天后他回来了，带了一张。画得不好，但人回来了。\n\n为什么批？因为我知道，一个孩子开口请假，已经在心里挣扎很久了。你再劝，他只会更想走。\n\n批了，他反而会想：老师这么信我，我得回去。\n\n这三天他在家画了一张，虽然不好，但那是他自己想画的，不是被逼的。\n\n有时候，退一步是为了让他自己走回来。\n\n家长常问：孩子想请假，该不该批？我的建议是：先问一句「你是想休息，还是想逃」。这两个答案，处理方式完全不同。\n\n想休息，批；想逃，陪他聊。\n\n还有人问：请假会不会落下进度？会。但落下的进度能补，断掉的信心补不回来。\n\n还有个问题：请假回来跟不上怎么办？补。我们会有老师单独给他补，但不会当众提。孩子要面子，你给他面子，他才给你里子。\n\n这件事之后我改了个规矩：请假不问原因，先批。原因等你回来再聊。\n\n人在想走的时候，任何追问都是推。你松一下手，他反而会回来。\n\n他带回来的那张画，我看了很久。\n\n画的是他家窗户外面的树，线条很乱，颜色也脏。\n\n但我问他：这张画，你画了多久。他说，两个下午。\n\n我说，两个下午，你一个人，画完了。\n\n他点头。\n\n我要的不是这张画有多好，我要的是他知道：没人盯着，他也能画完。\n\n这件事，比补三天课有用。\n\n后来我总结了一下，请假的孩子分两种。一种是真累了，一种是想逃。真累的，批；想逃的，批了也会回来，但回来之后要聊。怎么分？看他请假的时候说不说原因。说得清楚的，是真累；支支吾吾的，多半是想逃。但不管是哪种，先批。因为一个孩子开口请假，已经在心里挣扎很久了。你拦一次，他下次就不说了，直接不来。所以我现在不问原因，先批三天。三天后回来，再谈。谈的时候也不追问，只问一句：这三天，你想明白了什么。\n\n请假这件事，批的是三天，给的是信任。信任比规矩管用。", "shoot": ["办公室签字特写", "门口送走背影", "口播在办公桌后"], "cat": "D", "form": "视频", "season": "10-11月", "cost": "15 分钟", "tags": "#美术生 #央美附中 #画室 #校长", "win": "11/10–11/16"}, {"id": "S13", "title": "我给每个孩子写了一张纸条", "hook": "我给每个孩子写了张纸条", "copy": "月考完，我给每个孩子写了一张纸条。\n\n不是评语，是一句话——你这一个月，最该改的一个毛病。\n\n写了两天。有的孩子看完折起来放进口袋，有的贴在画板上。\n\n有个孩子把纸条贴了三年，毕业还带着。\n\n为什么不发微信？因为纸条能留下来。微信会被刷走，纸条会在他画不下去的时候，从画板缝里露出来。\n\n写纸条比发消息难。发消息可以复制，纸条必须一个人一个人想。我写的时候会翻他的画，翻他这一个月的变化。\n\n写到第四十张，手是酸的，但脑子是清楚的。\n\n家长常问：老师能不能多给孩子一些反馈？我们的反馈其实不少，只是不在群里。群里发的是共性问题，纸条上写的是他自己的。\n\n还有人问：为什么只写一个毛病？因为写三个，他一个都记不住。写一个，他能改。\n\n教育这件事，少即是多。\n\n家长常问：老师能不能在群里多反馈？群里发的是共性问题，纸条上写的是他自己的。有些话，只能一个人看，不能当着全班说。\n\n还有两个问题。第一，纸条写多长？一句话，不超过二十个字。第二，能不能打印？不能，必须是手写。手写的东西有温度。\n\n写纸条这件事我坚持了五年，每年大概六百张。有人说太慢，我说慢的东西才留得住。\n\n纸条不值钱，但它证明我看过他的画，而且只对他一个人说过话。\n\n纸条我一般这么写。\n\n「你这张画的形已经站住了，别再用手蹭。」\n\n「你起稿太快，慢五分钟。」\n\n「你画暗部的时候不敢重，试着压下去。」\n\n一句话，指出一个动作，不评价人。\n\n有孩子把纸条贴在画架侧面，画到一半看一眼。\n\n也有孩子当场塞进口袋，我知道他是不好意思。\n\n没关系。纸条的价值，不在于他当场看，在于他某一天翻出来的时候，知道有人认真看过他。\n\n写纸条这件事，我后来带新老师一起做。新老师一开始写「继续努力」，我让他重写。努力不是动作，改什么才是动作。写到第三年，他自己也能一句话指出问题了。这就是带人的方法：不是教他写，是逼他看画。看多了，话就准了。\n\n一句话，一个人，一张纸。", "shoot": ["笔尖写字特写", "纸条递过去的手", "学生看纸条的侧脸（需授权）"], "cat": "D", "form": "图文", "season": "10-11月", "cost": "20 分钟", "tags": "#美术生 #央美附中 #画室 #校长", "win": "11/10–11/16"}, {"id": "S26", "hook": "去年这时候，他也觉得自己稳了", "win": "11/10–11/16", "shoot": ["空教室，一把椅子放在前面", "复读生的手和现在的学生同框", "结尾拍墙上两张画"], "copy": "上周我把去年复读的一个孩子请回来，给现在这届讲了一节课。\n\n我没让他讲方法，只让他讲一件事：去年这个时候，他在干什么。\n\n他说，去年十一月，他觉得自己画得挺好，月考排名也靠前。十二月开始松，觉得稳了。三月考试，色彩差了 4 分。\n\n差 4 分，复读一年。\n\n教室里很安静。\n\n他讲完，有个学生问他：那你后悔吗。他说后悔，但不是后悔没多画，是后悔当时没人告诉他，排名不代表考试。\n\n这句话我记住了。\n\n我们每个月排名，排的是画室内部。附中的考场，是全国的。你在班里第一，可能是全国第两百。\n\n所以我把复读生请回来，不是吓人，是让他们知道：现在觉得稳，是最危险的时候。\n\n家长常问：我孩子现在班里前十，是不是稳了？不稳。前十只是在这个班。\n\n还有人问：那要不要给孩子压力？不用加压力，把真实的位置告诉他，就够了。\n\n这几年我请回来过三个复读生。有一个讲完，班里有孩子当晚就去找老师改画。也有一个讲完，没人动。第二天我问为什么，一个学生说：他说得太远了，我现在还没到那一步。\n\n后来我明白了，复读生讲的不是方法，是一面镜子。照不照得见，看他自己。\n\n所以我不指望一节课能改变谁。能有一个孩子听进去，这节课就没白上。\n\n那个复读生讲完，我补了一句。\n\n我说，他去年这个时候，也觉得自己稳了。\n\n教室里没人说话。\n\n后来有个孩子问我：老师，那我怎么知道自己是不是也松了？\n\n我说三个信号：起稿越来越快，改画越来越少，问问题越来越敷衍。\n\n三个里中两个，就是松了。\n\n松不是玩，是心里觉得差不多了。\n\n备考这件事，最危险的不是不会，是觉得会了。\n\n那天课结束，有个孩子在走廊问我：老师，我现在松了吗？我说你自己觉得呢。他想了半天，说有一点。我说那就从明天开始，每天多画一张速写。他做到了。一个月后他跟我说，老师，多画一张其实不难，难的是承认自己松了。承认，是改的开始。\n\n觉得自己稳了，就是最该警惕的时候。稳是感觉，不是事实。", "cat": "D", "form": "视频", "season": "10-11月", "cost": "25 分钟", "tags": "#美术生 #央美附中 #画室 #校长", "title": "我把去年的复读生请回来了"}, {"id": "S29", "hook": "十点半，我去关灯", "win": "11/10–11/16", "shoot": ["走廊尽头还亮着的教室", "手按开关，灯一排排灭", "空画架，窗外是黑的"], "copy": "每天晚上十点半，我去教室关灯。\n\n不是催他们走，是赶。\n\n有孩子不走，说再画十分钟。我说不行，明天还要上课。\n\n他们觉得我不近人情。有家长也觉得，孩子愿意多画是好事。\n\n但我知道，十点半以后画的，第二天早上全忘。人困的时候，手是机械的，画的都是废笔。\n\n我们这儿有个规矩：十点半关灯，十一点熄宿舍大灯。\n\n刚开始有孩子偷偷在厕所画。我抓到过两次，没骂，把画收了，让他回去睡。\n\n后来没人了。\n\n为什么这么严？因为备考是半年的事，不是一晚上。熬夜的孩子，第三个月一定垮。\n\n我见过太多这样的：前两个月拼命，第三个月生病，第四个月状态全无。\n\n家长常问：孩子说画不完怎么办？画不完是安排问题，不是时间问题。让他白天少发会儿呆。\n\n还有人问：那考试前能不能熬夜？不能。考前熬夜，等于提前交卷。\n\n有个家长给我打电话，说孩子回家抱怨，说画室管得像高中。我说对，我们就是按高中管的。\n\n半年时间，能管住作息，就管住了一半。\n\n我不指望每个孩子都理解。他现在恨我关灯，考完会明白。不明白也没关系，身体是他的。\n\n十点半的教室，我关过三年。每年都有人跟我磨，每年到最后，十点半教室都空了。\n\n灯一灭，走廊就安静了。那是我一天里最踏实的时刻。\n\n关灯这件事，我也犹豫过。\n\n有家长说，孩子愿意多画，你为什么不让他画。\n\n我说，因为他第二天还要画。\n\n备考是半年，不是一晚上。今晚多画一张，明天少画三张，这笔账不划算。\n\n后来我把每个孩子的入睡时间记了一个月。\n\n睡得早的那批，第二个月的作业完成度明显高。\n\n这不是我说的，是记出来的。\n\n所以我现在关灯，关得很坚决。\n\n有个孩子被我关了三天灯，第四天跟我说，老师我睡不着。我说睡不着就躺着，别起来画。他说躺着难受。我说难受几天就习惯了。后来他跟我说，那是他第一次知道，睡觉也是一种任务。备考这件事，睡够比多画重要。\n\n灯关了，人睡了，第二天才画得动。这话我每年都说，说到他们信。", "cat": "D", "form": "视频", "season": "10-11月", "cost": "15 分钟", "tags": "#美术生 #央美附中 #画室 #校长", "title": "晚自习十点半，我关灯赶人"}, {"id": "S14", "title": "家长会开场，我先放了一张空教室的照片", "hook": "家长会，我先放了一张空教室", "copy": "家长会开场，我没放成绩，先放了一张空教室的照片。\n\n我说：这是晚上十一点的教室。你们的孩子的画，就是在这种灯光下画出来的。\n\n会场安静了几秒。\n\n然后我才开始讲这一个月的情况。\n\n为什么先放照片？因为家长会最容易变成「报数会」：多少分、多少名、多少人过线。数字听多了，人会麻。\n\n照片不一样。照片让他们看见孩子在哪、在干什么、几点还在。\n\n有个妈妈看完哭了。她说她一直以为孩子在这儿挺轻松的。\n\n家长常问：家长会能不能多讲点提分方法？方法我们会讲，但先让他们看见。看不见，方法就是空的。\n\n还有人问：为什么不放孩子画得好的作品？因为好作品人人有，日常才是真的。\n\n一场家长会，能让他们记住一张照片，就够了。\n\n还有两个问题。第一，照片能发群里吗？不能，那是孩子晚上的样子，不该被围观。第二，家长会开多久？一小时，超过一小时，人就疲了。\n\n所以我们家长会只讲三件事：孩子现在在哪、接下来做什么、家里能配合什么。讲完就散，不拖。\n\n拖长了，家长会就变成诉苦会，什么问题都解决不了。一小时，真的够了。\n\n那张空教室的照片，是我早上六点拍的。\n\n桌椅摆得整整齐齐，画架空着，光从窗户进来。\n\n家长会开场，我没说话，先放了这张照片。\n\n放了一分钟。\n\n然后我说：这是你们孩子每天坐的地方。今天他们不在，我想让你们先看看。\n\n有家长后来跟我说，看到那张照片，突然就理解了孩子为什么累。\n\n家长会不是成绩汇报会。先让家长看见孩子每天在哪儿，再谈分数。\n\n那张照片我每年都拍，每年都不一样。有一年教室里多了一盆绿植，有一年墙上多了几张画。家长看到的是同一个角度，我看到的是这一年。后来有个家长说，她每年最期待的就是这张照片，因为那是她孩子每天待的地方，她一次都没进去过。家长会开到最后，我一般会留十分钟，让家长坐在孩子的位子上。坐一次，很多话就不用说了。\n\n家长会开到最后，是让家长看见孩子，不是看见分数。看见了，才谈得上理解。", "shoot": ["投影幕布 + 空教室照片", "会场全景（家长背影）", "口播在讲台侧"], "cat": "D", "form": "视频", "season": "10-11月", "cost": "10 分钟", "tags": "#美术生 #央美附中 #画室 #校长", "win": "11/17–11/23"}, {"id": "S15", "title": "我在家长会上讲「什么样的孩子不该来」", "hook": "家长会：什么样的孩子不该来", "copy": "家长会上，我讲了一页 PPT，标题是「什么样的孩子不该来」。\n\n三种：自己不想画的、家长只想找个地方看着的、指望花钱买结果的。\n\n讲完有人不舒服。但每年都有人会后过来跟我说：你讲得对，我们家就是第一种。\n\n先把丑话说在前面，后面才好办事。\n\n为什么要在家长会上讲这个？因为来咨询的家长，十个里有三个是不该来的。他们不是坏，是不知道。\n\n不知道这条路有多苦，不知道孩子要付出什么，不知道考不上意味着什么。\n\n我把这些讲清楚，他们自己会判断。\n\n家长常问：你这么说，不怕把学生吓跑吗？会吓跑一些。但留下来的，都是想清楚的。\n\n想清楚的家庭，后面好带。\n\n还有人问：那你们还招不招生？招。我们招的是想清楚的人，不是被吓住的人。\n\n一个画室的口碑，不是招了多少人，是劝退了多少不该来的人。\n\n还有两个问题。第一，讲这些会不会显得不自信？恰恰相反，敢说不收谁，才说明知道自己收谁。第二，会后要不要单独聊？要，但只聊具体的孩子。\n\n有个家长会后跟我说，她本来想报名，听完不报了。我说谢谢，你省了钱，我也省了事。\n\n敢劝退，才敢收人。这是同一件事的两面。\n\n我在家长会上讲的「不该来」，有三类。\n\n第一类，不想画的。第二类，坐不住的。第三类，家里撑不住的。\n\n讲完，有个家长站起来说，老师你这么说，不怕招生少吗。\n\n我说怕，但招错了更麻烦。\n\n教室里有人笑。\n\n后来散会，有三个家长留下来，说谢谢我把话说清楚。\n\n把丑话说在前面，后面的合作才轻松。\n\n讲完那三类，我停了一会儿。教室里很安静。然后我说，如果听完你觉得自己孩子是其中一类，别急着否定，回去跟他聊一次。聊完还这么想，再来找我。后来真有几个家长来找我，说聊完发现不是孩子不想画，是怕考不上。怕，和不想，是两回事。怕的人还有救，不想的人救不了。所以我把「不想画」放在第一类，因为那一类最难办。剩下的，都能谈。\n\n把丑话说在前面，是尊重，不是劝退。是筛选，也是负责。", "shoot": ["讲台正面，一镜到底", "PPT 特写（只拍标题）", "会场反应的空镜"], "cat": "D", "form": "视频", "season": "10-11月", "cost": "30 分钟", "tags": "#美术生 #央美附中 #画室 #校长", "win": "11/17–11/23"}, {"id": "S16", "title": "会后五个家长留下来没走", "hook": "会后，五个家长没走", "copy": "家长会结束，人走得差不多了，还有五个家长站着没走。\n\n他们不是要报名，是想问一句：我家孩子这样，还有没有希望。\n\n我一个个答，答到十点半。\n\n这五个人，后来有三个成了我们的学生。\n\n他们问的其实不是「有没有希望」，是「你能不能给我一个准话」。\n\n我给不了。我只能告诉他们：孩子现在什么水平、还差什么、大概要多久。剩下的，看孩子。\n\n有个爸爸听完说，你是第一个不跟我说「没问题」的人。\n\n我说，说「没问题」的人，是在卖东西；说「不确定」的人，才是在做事。\n\n家长常问：你怎么判断一个孩子有没有希望？我看三件事：他想不想、他坐不坐得住、他改不改得动。\n\n三件都有，就有希望。缺一件，就得谈。\n\n还有人问：那你们为什么不收「有希望但不努力」的？因为那样的孩子，最后恨的是你。\n\n还有两个问题。第一，聊到十点半不累吗？累。但这五个人，是真的在纠结。第二，要不要留电话？不留，留个微信就行，别让人有压力。\n\n这五个人里，有一个后来没来。第二年他又来了，说当时没钱。我说现在有钱了？他说没有，但想清楚了。\n\n想清楚这件事，比有钱重要。\n\n会后留下来的五个家长，问的其实是同一件事。\n\n我的孩子，到底行不行。\n\n我没给结论。我给他们看画，看三个月前的和现在的。\n\n看完，有人说，原来他进步了。\n\n我说对，只是你看的是分数，我看的是画。\n\n家长最容易忽略的，是过程里的变化。分数一个月才出一次，画每天都在变。\n\n那五个家长走的时候，表情比来的时候松。\n\n那五个家长里，有一个是爸爸。他全程没说话，最后问了一句：老师，我能做什么。我说三件事：别问分数，别拿别人家孩子比，周末带他出去吃顿饭。他说就这么简单？我说就这么简单。难的是做到。后来他真做了。那个孩子月考涨了十几名。不是吃饭有用，是孩子知道家里不只看分数。家里的态度，会变成孩子画画时的手感。松一点，画就松一点。紧一点，画就紧一点。这话不玄，你去看画就知道。\n\n家长稳住，孩子才敢说真话。", "shoot": ["散场后的空椅子", "走廊谈话背影", "口播在空会场"], "cat": "D", "form": "视频", "season": "10-11月", "cost": "10 分钟", "tags": "#美术生 #央美附中 #画室 #校长", "win": "11/17–11/23"}, {"id": "S17", "title": "有家长问我「你们和 XX 画室有什么不一样」", "hook": "家长问：你们和别家差在哪", "copy": "有家长问我：你们和 XX 画室有什么不一样。\n\n我没说别人不好。我只说三件事。\n\n第一，我们的老师你能查到是谁、在哪教过。名字、履历、排课，都拿得出来。\n\n第二，我们的月考按附中标准判。不是自己出一套卷子自己打分。\n\n第三，我们劝退过学生。每年大概三十个。\n\n前两条别人也能说，第三条很少有人敢做。\n\n为什么敢做？因为收一个不合适的孩子，最后损失的是他一年，不是我的学费。\n\n家长听完沉默了一会儿，说：那你们是不是很难报。\n\n我说不是，我们挑的不是钱，是孩子想不想。\n\n家长常问：你们和别家比，到底强在哪？我的回答是：不敢说强，只能说清楚。你能问出细节，我才答得上来。\n\n还有人问：那你们有什么缺点？有。我们贵，我们管得严，我们劝退。这三条，能接受再来。\n\n家长选画室，最该问的不是「你们好不好」，是「你们敢不敢说不」。敢说不的，通常不会骗你。\n\n还有两个问题。第一，能不能试听？能，但试听看不出什么，最好来一天。第二，能不能对比价格？能，但先对比老师。\n\n后来那个家长报名了。报之前她说了一句话：你是第一个不急着让我交钱的人。\n\n这句话我记了很久。因为做生意最容易的，是顺着人说话。\n\n做生意最难的，是明明想赚，还要说不。\n\n家长问我「你们和别家有什么不一样」，我一般反问一句：\n\n你最在意什么？\n\n他说成绩，我就讲名单；他说管理，我就讲作息；他说老师，我就讲履历。\n\n不先问，直接讲一堆，讲不到他心里。\n\n有一次，一个家长说，他最在意孩子会不会被忽视。\n\n我带他去看教室，看一个班多少人，看老师一天改几次画。\n\n他看完说，行。\n\n不一样不是说出来的，是问出来的。\n\n还有一个问题，家长很少问，但最该问：你们打算怎么教我的孩子。不是你们怎么教，是怎么教我的孩子。这两个问题差很远。前者听理念，后者听方案。答不出方案的，理念再好也落不到地上。所以我现在接待家长，先看孩子的画，再谈方案。方案对了，再谈钱。", "shoot": ["办公室对坐，正面", "说到第三条时停一拍", "结尾不解释"], "cat": "D", "form": "视频", "season": "10-11月", "cost": "15 分钟", "tags": "#美术生 #央美附中 #画室 #校长", "win": "11/17–11/23"}, {"id": "S18", "title": "寒假班简章，我改了七版", "hook": "寒假班简章，改了七版", "copy": "寒假班的简章，我改了七版。\n\n前六版都在删——删掉「名师」「保障」「逆袭」这些词。\n\n第七版只剩三页：我们是谁、孩子会经历什么、什么时候该来。\n\n简章不是广告，是把话说清楚。\n\n第一版我写了「名师团队」，后来删了。因为「名师」这个词，谁都能写。我改成老师名字和履历，谁教的、教了几年、在哪教过。\n\n第二版我写了「提分保障」，也删了。因为没人能保障。我改成去年多少人考、多少人没考，两个数字都写。\n\n第三版我写了一堆课程安排，也删了。家长不看课程表，家长只看「我孩子来了会变成什么样」。\n\n改到第七版，只剩三页。印刷厂的人问我，这么薄，是不是印错了。\n\n我说没印错。话说清楚了，就不用厚。\n\n家长常问：简章能不能写点吸引人的？能吸引人的，往往是不能兑现的。我们只写能兑现的。\n\n还有人问：那你们怎么招生？靠来过的人说。\n\n家长看简章，先看它敢不敢写「不适合谁」。只写好的，多半有水分。\n\n还有两个问题。第一，简章能不能寄？能。第二，能不能只看不报？能，看完再说。\n\n简章发出去，有人打电话来问：你们是不是不打算招人。\n\n我说招，只是不想招错的。\n\n薄的那本，反而有人从头看到尾。厚的那些，通常翻两页就放下了。\n\n简章改到第七版，我删掉了三样东西。\n\n删掉「名师团队」，换成老师名字和履历。\n\n删掉「提分保障」，换成去年的报考人数和录取人数。\n\n删掉「课程安排」，换成孩子一天怎么过。\n\n印刷厂的人问我，这么薄，是不是印错了。\n\n我说没印错。\n\n家长翻简章，不是来上课的，是来判断的。判断需要事实，不需要形容词。\n\n第七版印出来，我先给三个家长看。一个说太薄，一个说太直，一个说看完心里没底。我说没底就对了，因为我把该说的都说了，没给你留想象空间。后来那个说没底的家长，报名了。她说，至少你们没骗我。这句话，比任何广告都值钱。简章不是用来吸引人的，是用来筛人的。看懂的人，才留得下。\n\n薄，是因为不绕弯。不绕弯，才看得清。", "shoot": ["桌面七版摊开", "手指翻页", "口播在桌后"], "cat": "D", "form": "图文", "season": "10-11月", "cost": "10 分钟", "tags": "#美术生 #央美附中 #画室 #校长", "win": "11/17–11/23"}, {"id": "S27", "hook": "半年，300 张", "win": "11/17–11/23", "shoot": ["纸上写算式，镜头从上往下", "一摞画纸搬上桌", "手指翻到最上面一张"], "copy": "昨天有个家长问我，半年时间够不够。我没回答，拿了张纸算了一遍。\n\n从十一月到四月，大概 26 周。一周六天，一天三张，是 468 张。去掉月考、放假、状态差的日子，实际能画 300 张左右。\n\n300 张里，真正能拿出来当作品的，不到 30 张。\n\n我说的作品，是能完整画完、构图站得住、颜色说得过去的那种。剩下的，都是练习。\n\n家长听完愣了一下，说这么多。\n\n对，这么多。所以孩子说累，是真的累。\n\n但我也跟家长说，300 张不是目的。目的是在这 300 张里，把同一个错误改掉。\n\n有的孩子画 300 张，错 300 次。有的孩子画 100 张，改了 20 个错。后一种进步更快。\n\n所以数量要够，但光有数量没用。\n\n家长常问：那每天画几张合适？三张。多了是熬，少了不够。\n\n还有人问：画不完怎么办？画不完就画不完，别熬夜补。熬夜补出来的，第二天全还回去。\n\n我把这张纸贴在了家长等候区的墙上。有家长看完，问我：那我孩子现在一天画几张？我说你先别问几张，问他一节课有没有画完一张。\n\n数字是给家长看的，不是给孩子压的。孩子只需要知道今天这张，比昨天那张好在哪。\n\n300 张是个平均数。有人画得到，有人画不到。画不到的那个，问题不在手，在安排。\n\n三百张这个数，我是按有效张数算的。\n\n什么叫有效？画完了，改过，知道问题在哪。\n\n坐着画三个小时，最后没画完，也没改，那张不算。\n\n所以有的孩子一年画了五百张，有效的一百张。有的孩子画了三百张，有效两百张。\n\n后一种进步快。\n\n家长常问：怎么数有效张数？看背面。每张画背面写日期和一句话：今天改了哪里。\n\n写不出来，就是没改。\n\n有家长问，三百张是不是太多了。我说不多，一年三百六十五天，只画三百张，平均一天不到一张。他说那怎么够。我说够，因为一张画三个小时，不是三分钟。关键不是张数，是每一张有没有改。不改，画一千张也是重复。\n\n有效，比数量重要。记住这一句就行。", "cat": "D", "form": "图文", "season": "10-11月", "cost": "10 分钟", "tags": "#美术生 #央美附中 #画室 #校长", "title": "半年，一个孩子要画多少张"}, {"id": "S19", "title": "为什么先行班要提前半年", "hook": "先行班，为什么提前半年", "copy": "很多人问：为什么先行班要提前半年。\n\n因为半年不是用来学新东西的，是用来纠错的。\n\n一个孩子带着错误的习惯来，前三个月基本都在改。等改完，只剩三个月冲刺。\n\n晚来半年，不是少学半年，是少了改错的时间。\n\n我举个具体的。有个孩子，在地方画室学了两年，画得很「熟」。但起稿全靠感觉，形体一错，后面全错。\n\n他来的时候，我们让他从几何体重新画。他不服，说我都画两年了。\n\n画了一个月，他自己服了。因为他发现，以前那些「熟」，是错的熟。\n\n改一个错误习惯，比教一个零基础难三倍。因为手已经记住了错的。\n\n所以先行班不是提前学，是提前改。\n\n家长常问：孩子基础好，还需要先行班吗？基础好更要来。基础越好，错得越深，改起来越疼。\n\n还有人问：能不能只来三个月？能，但那是冲刺班，不是先行班。\n\n家长最容易犯的错，是觉得「反正都是画，晚点来一样」。不一样。改错的成本，比学新的高得多。\n\n还有两个问题。第一，先行班多久？半年。第二，能不能中途来？能，但改错时间会被压缩。\n\n所以先行班的名额，我从来不催。来得早的，是听懂了；来得晚的，自己会后悔。\n\n我不喜欢用「晚了就来不及」吓人。但这句话，有时候是真的。\n\n早来的孩子，改完还有时间冲刺；晚来的，改完就上考场了。\n\n先行班第一个月，我只做一件事：改起稿。\n\n不教新东西，不讲风格，就改起稿。\n\n怎么定大形，怎么量比例，怎么在十分钟内把位置定住。\n\n一个月后，很多孩子的画还是不好看，但位置对了。\n\n位置对了，后面才有得谈。\n\n有家长问，一个月就学这个，是不是太慢。\n\n我说，起稿错了，后面全错。慢，是因为在打地基。\n\n先行班结束，我会给每个孩子一张纸，上面写他改掉了哪个习惯。有的写「起稿不再反复擦」，有的写「敢画重颜色了」。这张纸不带回家，贴在画室墙上。为什么贴墙上？因为习惯这东西，说出来才守得住。他自己写的，比我说的管用。下个月再看，还在不在。不在，就再改。", "shoot": ["白板画时间轴：半年 / 三个月", "手指点在「纠错」上", "口播站白板前"], "cat": "D", "form": "视频", "season": "10-11月", "cost": "15 分钟", "tags": "#美术生 #央美附中 #画室 #校长", "win": "11/24–11/30"}, {"id": "S20", "title": "我劝一个家长别急着交钱", "hook": "我劝他别急着交钱", "copy": "有个家长来，说想先交钱占个位置。\n\n我说别急，先让孩子来画一天。\n\n画完再说。如果他坐不住、不想画，这钱交了也是退。\n\n家长愣了一下，说别家都催着交。\n\n我说我们不催。\n\n为什么？因为收了钱再退，比不收更麻烦。家长的期待已经被拉起来了，孩子却没准备好，最后三方都难受。\n\n我们有过教训。有一年招生季，一个家长当天就交了全款，孩子来了三天，天天哭。第四天退费，家长说我们没教好，孩子说不想画。其实谁都没错，就是不该来。\n\n从那以后，我定了个规矩：先看孩子，再谈钱。\n\n家长常问：那你们不怕跑单吗？怕。但跑单比退费省事。\n\n还有人问：先交钱有什么好处？有，能占位。但我们位子不紧张，你不用抢。\n\n家长交钱之前，最好让孩子先坐一天。他坐得住，钱才不白花；坐不住，早退早省心。\n\n还有两个问题。第一，占位费收不收？不收。第二，能不能先交定金？可以，但我们不建议。\n\n后来那个孩子来画了一天，坐住了。家长第二天才交钱。\n\n交钱的时候她说：你们这样，我反而不怕了。\n\n我们这儿没有销售。接待的人就是老师，老师不会催你交钱，他只会告诉你孩子现在什么水平。这个规矩，省了我们很多麻烦。\n\n有家长说我们不会做生意。可能吧。但我们活得比很多会做生意的久。\n\n先看孩子再谈钱，这个规矩我们执行了很多年。\n\n有家长来了三次才交钱。第一次看环境，第二次带孩子画一天，第三次才定。\n\n我们不催。\n\n因为催来的单，退费的概率高。\n\n有一年招生季，一个家长当天就要交全款，我让他等一天。他第二天来，说回去跟孩子聊了，孩子不想来。\n\n钱没收到，但我省了一个退费。\n\n做生意和做教育，有时候是反的。\n\n先看孩子再谈钱，还有一个原因：孩子来了，我们才知道该怎么教。没见孩子就报价，报的是班型，不是他。有家长说，别家都能电话报价，你们怎么这么麻烦。我说麻烦一次，省得后面退费。他后来还是来了，带着孩子。孩子画了一天，他自己说想留下。\n\n不急，是因为不靠这一单活着。", "shoot": ["办公室，把卡推回去的手部特写", "家长手部（不拍脸）", "口播正面"], "cat": "D", "form": "视频", "season": "10-11月", "cost": "15 分钟", "tags": "#美术生 #央美附中 #画室 #校长", "win": "11/24–11/30"}, {"id": "S21", "title": "倒计时 180 天，我在黑板上写了个数字", "hook": "倒计时 180 天", "copy": "离考试还有 180 天，我在黑板上写了个数字。\n\n没讲励志的话，只说了一句：这 180 天，你们会有一半时间觉得自己在退步。\n\n下面有人笑。\n\n我说别笑，到时候记得今天这句话。\n\n为什么这么说？因为我知道接下来会发生什么。\n\n第一个月，进步很快，因为新鲜。第三个月，开始卡，因为问题暴露了。第五个月，有人崩，因为看不到尽头。\n\n每年都一样。\n\n我提前告诉他们，是为了让他们在崩的时候知道：这是正常的，不是你不行。\n\n家长常问：最后半年还能提多少？看基础。基础好的，提 10 分；基础差的，提 30 分。但前提是别停。\n\n还有人问：现在开始还来得及吗？来得及，但别等到 100 天。\n\n家长这半年最该做的，是别添乱。别天天问分数，别拿别人家孩子比，别在考前改计划。\n\n还有两个问题。第一，180 天怎么算？从今天到 5 月 1 日。第二，中间有没有假期？有，但很短。\n\n180 天听着很长，其实去掉假期、月考、状态差的日子，真正能用的不到 120 天。\n\n我在黑板上写 180，是想让他们知道：数字会一天一天少。\n\n数字写上去那天，有个孩子在底下小声说：还有 180 天啊。我听见了，没接话。\n\n我见过太多孩子，前面松，后面急。最后 30 天才开始拼，拼的不是画，是心态。\n\n一百八十天，我把它分成三段。\n\n前六十天，补基础。哪里缺补哪里，不怕慢。\n\n中间六十天，上强度。按考试时间画，按考试标准评。\n\n最后六十天，调状态。不学新的，只把会的画稳。\n\n三段里，最容易浪费的是第一段。很多人一上来就冲刺，冲到一月就疲了。\n\n所以我每年都在黑板上写这个数字，不是倒计时，是提醒：现在在哪一段。\n\n黑板上那个数字，我每天擦掉重写。不是为了制造紧张，是为了让他们知道，数字在动。有孩子说，老师你别写了，看着烦。我说烦就对了，烦说明你在意。后来他自己也开始在速写本上写天数。写到最后一天，他画了一张画，送给我。\n\n数字会少，人会变。", "shoot": ["黑板写字，写完转身", "学生抬头", "定格在数字上"], "cat": "D", "form": "视频", "season": "10-11月", "cost": "10 分钟", "tags": "#美术生 #央美附中 #画室 #校长", "win": "11/24–11/30"}, {"id": "S22", "title": "我跟老师说：接下来别再教新东西了", "hook": "我跟老师：别再教新的了", "copy": "教研会上我跟老师说：接下来别再教新东西了。\n\n剩下半年，只做三件事——把会的画稳、把错的改掉、把时间卡准。\n\n新东西会让孩子兴奋，也会让他乱。考场上不需要惊喜。\n\n有老师不理解，说不教新的，学生会不会觉得没进步。\n\n我说，进步不是学新东西。一个孩子能把已经会的东西稳定画出来，就是最大的进步。\n\n我们见过太多孩子，平时什么都学过，一上考场就乱。不是不会，是不稳。\n\n所以最后半年，我们只做减法。\n\n家长常问：不学新的，会不会落后？考试考的是那几样，学太多反而杂。\n\n还有人问：那老师做什么？改画、卡时间、盯状态。这三件事，比讲课累。\n\n家长常问最后半年要不要加课。我的建议是：别加。加课加的是时间，不是分数。\n\n还有两个问题。第一，不教新的，学生会不会无聊？不会，改画比学新累。第二，家长能不能要求加课？能，但我们会劝。\n\n老师听完，有人点头，有人沉默。沉默的那几个，后来课上得最好。\n\n因为他们是真在改，不是在应付我。\n\n有个老师问我，那不教新的，我上课干什么。我说，你去看每个孩子的画，找出他一直在犯的那个错，然后只改那一个。这件事，比讲新课难。\n\n减法比加法难。加法是老师在讲，减法是老师在忍。最后半年，谁都能多讲一点，敢少讲的没几个。\n\n不教新东西，老师最难适应。\n\n有老师问我，那上课干什么。\n\n我说三件事：看画、找错、盯着改。\n\n听起来简单，做起来累。因为你要看每个人的画，找出他一直在犯的那个错，还要盯着他改到对。\n\n讲新课反而轻松，讲完就完了。\n\n所以最后半年，拼的是老师的耐心，不是老师的水平。\n\n谁能陪着孩子把一个错改十遍，谁就赢了。\n\n减法清单，我们贴在教研室墙上。上面写着：不加新课、不换方法、不追进度。有老师问，那学生问新东西怎么办。我说告诉他，考完再学。他真问了，我真这么答的。后来他考完，第一件事就是来问那个新东西。我说现在可以学了。那一刻我觉得，减法没白做。\n\n最后半年，少就是多。", "shoot": ["教研会，围桌", "白板写「稳 / 改 / 卡时间」", "口播在会议室"], "cat": "D", "form": "视频", "season": "10-11月", "cost": "15 分钟", "tags": "#美术生 #央美附中 #画室 #校长", "win": "12/01–12/07"}, {"id": "S23", "title": "我把开学第一张画和现在的放在一起", "hook": "开学第一张，和现在", "copy": "我把开学第一张画，和现在的画放在一起，贴在走廊。\n\n有的孩子进步很大，有的几乎没变。\n\n没变的那几个，我一个个叫过来看。不是批评，是让他自己说：这三个月，你干了什么。\n\n有个孩子站了五分钟，说：我好像每天都在画，但不知道画了什么。\n\n这句话很准。很多人不是不努力，是努力没有方向。\n\n所以贴出来不是为了比，是为了让每个人看见自己的三个月。\n\n有孩子看完，回去把画板上的画全撕了，重新开始。\n\n也有孩子看完，第二天来得更早。\n\n家长常问：这样会不会打击孩子？会。但打击比蒙着好。\n\n还有人问：能不能只贴进步大的？不能。只贴好的，就成了表演。\n\n家长看孩子的画，别只看像不像。看三个月前和现在的差别，那才是真的。\n\n还有两个问题。第一，能不能不贴？可以，但少了一次照镜子的机会。第二，多久换一次？每月一次。\n\n那天晚上，有个孩子在走廊站了很久。我没过去。\n\n有些话，得他自己跟自己说。\n\n有个孩子看完，回到教室把画板上的画全撕了。我没拦。第二天他来得比谁都早，重新起了一张稿。三个月后，那张画挂在了最中间。\n\n有个家长来看，站在自己孩子的画前面，看了很久，说：原来他画成这样。我说对，他一直画成这样，只是你以前没看过。\n\n贴画这件事，我们每月做一次。\n\n不排名，只贴两张：这个月第一张，和这个月最后一张。\n\n有人问，为什么不贴最好的那张。\n\n因为最好的那张，看不出过程。\n\n第一张和最后一张放在一起，中间发生了什么，一目了然。\n\n有孩子看完，回去把画板上的画撕了重画。\n\n也有孩子看完，第二天来得更早。\n\n墙上贴的不是画，是一个月的时间。\n\n有个孩子看完自己的两张画，问我：老师，我是不是白画了。我说没有，第一张是你敢画，最后一张是你会画。他愣了一下，说那中间那些呢。我说中间那些，是让你从敢画变成会画的路。他后来把中间那些也贴上了。整面墙，都是他的一个月。路不好看，但路是真的。\n\n墙上的画会换，时间不会。", "shoot": ["两张画并排贴墙", "学生站着看的背影", "口播在走廊"], "cat": "D", "form": "图文", "season": "10-11月", "cost": "15 分钟", "tags": "#美术生 #央美附中 #画室 #校长", "win": "12/01–12/07"}, {"id": "S24", "title": "我今天画了一张，手有点生", "hook": "好久不画，手会生", "copy": "今天画了一张，手有点生。\n\n起稿的时候犹豫了几次，铺色也不敢下重手。\n\n学生围过来看，说老师你也会画不好啊。\n\n我说会啊。我一周不画就退，你们一天不画就退。\n\n然后我把这张画贴在了墙上，没撕。\n\n为什么贴？因为我想让他们看见，画不好是常态。\n\n很多孩子以为，老师画画是一气呵成的。其实不是。我也会犹豫，也会改，也会画到一半想撕掉。\n\n区别只在于，我知道下一步该干什么。\n\n这个「知道」，是画了十几年换来的。\n\n家长常问：孩子画不好就烦躁，怎么办？告诉他，烦躁是正常的。高手也烦躁，只是他们不停。\n\n还有人问：那什么时候能不烦躁？不会不烦躁，只会习惯。\n\n孩子画不好就烦，家长别急着安慰。说一句「我知道你烦」，比说「没事」管用。\n\n还有两个问题。第一，老师多久画一张？我现在一周至少一张。第二，画不好要不要给学生看？要，这才真实。\n\n有学生问我：老师你画不好，会不会不好意思。\n\n我说会。但我更怕的是，因为不好意思，就不画了。\n\n我以前画不好会撕，现在不撕了。撕掉的是证据，留下的是过程。学生需要的不是一张完美的画，是一个敢画的人。\n\n学生画不好会藏，我以前也藏。后来发现，藏起来的画，永远不会变好。现在我把画不好的也贴出来，旁边写一行字：这张我改了四次。\n\n我画画这件事，学生一开始不信。\n\n他们说，老师你也会画不好？\n\n我说会，而且经常。\n\n后来我每周画一张，画完贴在墙上，不挑好的贴。\n\n学生慢慢习惯了。有人会站在我的画前面看很久，然后说，老师你这里也没画完。\n\n我说对，我知道哪里没画完。\n\n知道，和画完，是两件事。\n\n老师能教的是「知道」，画完要靠他自己。\n\n有学生问我，老师你画得不好，为什么还贴。我说因为我想让你们看见，画画这件事，大人也在练。他后来也把自己画坏的贴出来了。贴的时候他有点不好意思。我说没事，画坏的也是画。第二天，又有两个人贴。墙上慢慢满起来。满的不是画，是胆。\n\n敢贴，才敢画。", "shoot": ["画架前起稿，保留犹豫的动作", "学生围观的反应", "成品贴墙，镜头拉远"], "cat": "D", "form": "视频", "season": "10-11月", "cost": "20 分钟", "tags": "#美术生 #央美附中 #画室 #校长", "win": "12/01–12/07"}], "cats": [{"k": "A", "n": "结果证据", "d": "成绩、录取、作品对照"}, {"k": "B", "n": "家长决策", "d": "选校、政策、时间、费用"}, {"k": "C", "n": "教学现场", "d": "课堂、示范、学员成长"}, {"k": "D", "n": "校长人格", "d": "校长本人第一人称"}, {"k": "E", "n": "互动型", "d": "提问、征集，评论即线索"}]}</script>

function emptyStore(){ return {custom:[],overrides:{},deleted:[],status:{}}; }
function loadStore(){
  try{
    const s = JSON.parse(localStorage.getItem(KEY) || '{}');
    return {
      custom: Array.isArray(s.custom) ? s.custom : [],
      overrides: s.overrides && typeof s.overrides==='object' ? s.overrides : {},
      deleted: Array.isArray(s.deleted) ? s.deleted : [],
      status: s.status && typeof s.status==='object' ? s.status : {}
    };
  }catch(e){ return emptyStore(); }
}
let store = loadStore();
let state = {v:'home', cat:null, id:null, from:null, listIds:[]};

function persist(){
  try{ localStorage.setItem(KEY, JSON.stringify(store)); return true; }
  catch(e){ alert('保存失败：手机存储空间不足，或浏览器禁用了本地存储。'); return false; }
}
function allItems(){
  const out = [];
  D.items.forEach(x=>{
    if(store.deleted.indexOf(x.id) >= 0) return;
    out.push(store.overrides[x.id] ? Object.assign({}, x, store.overrides[x.id]) : x);
  });
  store.custom.forEach(x=>{
    if(store.deleted.indexOf(x.id) >= 0) return;
    out.push(x);
  });
  return out;
}
function findItem(id){ return allItems().filter(x=>x.id===id)[0]; }
function stOf(id){ return (store.status[id] && store.status[id].s) || ''; }
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const wc = s => String(s||'').replace(/\s/g,'').length;
const mins = n => Math.max(1, Math.round(n/280));

function itemsOf(cat){
  const arr = allItems().filter(x=>x.cat===cat);
  if(cat!=='D') return arr;
  return arr.filter(x=>x.win).concat(arr.filter(x=>!x.win));
}
function seasonItems(){ return allItems().filter(x=>x.win); }

function goHome(){ state={v:'home',cat:null,id:null,from:null,listIds:[]}; render(); window.scrollTo(0,0); }
function goSeason(){ state={v:'season',cat:'D',id:null,from:null,listIds:[]}; render(); window.scrollTo(0,0); }
function goCat(c){ state={v:'cat',cat:c,id:null,from:null,listIds:[]}; render(); window.scrollTo(0,0); }
function goMine(){ state={v:'mine',cat:null,id:null,from:null,listIds:[]}; render(); window.scrollTo(0,0); }
function goBackup(){ state={v:'backup',cat:null,id:null,from:null,listIds:[]}; render(); window.scrollTo(0,0); }
function goOpen(){ state={v:'open',cat:null,id:null,from:null,listIds:[]}; render(); window.scrollTo(0,0); }
function goItem(id, from, listIds){
  state={v:'item',cat:state.cat,id,from:from||state.v,listIds:listIds||state.listIds||[]};
  render(); window.scrollTo(0,0);
}
function goEdit(id){
  state={v:'edit',cat:state.cat,id:id||null,from:state.v,retFrom:state.from||state.v,listIds:state.listIds};
  render(); window.scrollTo(0,0);
}

back.onclick = ()=>{
  if(state.v==='item'){
    if(state.from==='season') goSeason();
    else if(state.from==='mine') goMine();
    else if(state.from==='search') goHome();
    else if(state.cat) goCat(state.cat);
    else goHome();
  } else if(state.v==='edit'){
    state.id ? goItem(state.id, state.from, state.listIds) : goHome();
  } else goHome();
};
fab.onclick = ()=> goEdit(null);

function render(){
  back.style.display = state.v==='home' ? 'none' : 'flex';
  fab.style.display = ['home','season','cat','mine'].indexOf(state.v) >= 0 ? 'flex' : 'none';
  view.classList.toggle('withbar', state.v==='item');
  if(state.v==='home') return renderHome();
  if(state.v==='season') return renderSeason();
  if(state.v==='cat') return renderCat();
  if(state.v==='item') return renderItem();
  if(state.v==='edit') return renderEdit();
  if(state.v==='mine') return renderMine();
  if(state.v==='backup') return renderBackup();
  if(state.v==='open') return renderOpen();
}

function statusDot(id){
  const s = stOf(id);
  return '<span class="dot '+(s==='pub'?'pub':s==='done'?'done':'')+'"></span>';
}

function rowsHtml(arr, opts){
  opts = opts || {};
  return arr.map(x=>{
    const s = stOf(x.id);
    const idTxt = x.id && x.id.charAt(0)==='N' ? '新' : x.id;
    return '<div class="row" data-id="'+x.id+'"><div class="idx">'+esc(idTxt)+'</div><div class="body">'
      + '<div class="t">'+esc(x.title)+'</div>'
      + '<div class="m"><span class="chip">'+esc(x.form)+'</span>'
      + (x.win?'<span class="chip season">'+esc(x.win)+'</span>':'')
      + (x.cost?'<span>'+esc(x.cost)+'</span>':'')
      + (s?'<span>'+statusDot(x.id)+esc(STAT[s])+'</span>':'')
      + '</div></div></div>';
  }).join('');
}

function bindRows(arr){
  const ids = arr.map(x=>x.id);
  view.querySelectorAll('.row').forEach(el=>{
    el.onclick = ()=> goItem(el.dataset.id, state.v, ids);
  });
}

function renderHome(){
  ttl.textContent = '阿祖画室 · 选题库';
  cnt.textContent = allItems().length + ' 条';
  const all = allItems();
  const doneN = all.filter(x=>stOf(x.id)==='done').length;
  const pubN = all.filter(x=>stOf(x.id)==='pub').length;
  let h = '<div class="hero"><h1>选题库</h1><p>点分类 → 点选题 → 看文案和拍法</p></div>';
  h += '<div class="seasonbox" id="seasonbox"><div class="st">NOW · 10/20 – 11/30</div>'
     + '<div class="sn">本月可拍 '+seasonItems().length+' 条</div>'
     + '<div class="sd">按周排好，点进去就是文案和拍法</div></div>';
  h += '<div class="srch"><input id="q" placeholder="搜关键词，比如 分数线 / 劝退 / 石膏" autocomplete="off"></div>';
  h += '<div class="cats" id="cats">';
  D.cats.forEach(c=>{
    const n = itemsOf(c.k).length;
    h += '<div class="cat" data-c="'+c.k+'"><div class="k">'+c.k+'</div><div><div class="n">'+esc(c.n)+'</div><div class="d">'+esc(c.d)+' · '+n+' 条</div></div><div class="go">›</div></div>';
  });
  h += '</div><div class="list" id="res" style="margin-top:18px"></div>';
  h += '<div class="list" style="margin-top:14px">'
     + '<div class="mine" id="mine"><div class="l">我的选题与状态</div><div class="r">已拍 '+doneN+' · 已发 '+pubN+' ›</div></div>'
     + '<div class="mine" id="open"><div class="l">手机打开 / 发给同事</div><div class="r">二维码 ›</div></div>'
     + '<div class="mine" id="bk"><div class="l">备份与恢复</div><div class="r">导出 / 导入 ›</div></div>'
     + '</div>';
  h += '<div class="foot">阿祖画室 · 央美附中考前 · 燕郊</div>';
  view.innerHTML = h;
  document.getElementById('seasonbox').onclick = goSeason;
  document.getElementById('mine').onclick = goMine;
  document.getElementById('open').onclick = goOpen;
  document.getElementById('bk').onclick = goBackup;
  view.querySelectorAll('.cat').forEach(el=> el.onclick = ()=> goCat(el.dataset.c));
  const q = document.getElementById('q');
  q.oninput = ()=>{
    const k = q.value.trim();
    const res = document.getElementById('res');
    if(!k){ res.innerHTML=''; return; }
    const hit = allItems().filter(x=> (x.title+x.hook+x.copy+(x.tags||'')+(x.shoot||[]).join('')).indexOf(k)>=0);
    res.innerHTML = hit.length ? rowsHtml(hit.slice(0,60)) : '<div class="empty">没找到</div>';
    bindRows(hit.slice(0,60));
  };
}

function renderSeason(){
  ttl.textContent = '本月可拍';
  const arr = seasonItems();
  cnt.textContent = arr.length + ' 条';
  let h = '<div class="hero"><h1>10 月 20 日 – 11 月 30 日</h1><p>每条都挂在画室这个月正在发生的事上；12 月初 3 条提前备着</p></div>';
  let all = [];
  WK.forEach(w=>{
    const g = arr.filter(x=>x.win===w);
    if(!g.length) return;
    h += '<div class="wk">'+w+' · '+g.length+' 条</div><div class="list">'+rowsHtml(g)+'</div>';
    all = all.concat(g);
  });
  view.innerHTML = h;
  bindRows(all);
}

function renderCat(){
  const c = D.cats.filter(x=>x.k===state.cat)[0];
  ttl.textContent = c.n;
  const arr = itemsOf(c.k);
  cnt.textContent = arr.length + ' 条';
  let h = '<div class="list">';
  arr.forEach((x,i)=>{
    if(c.k==='D' && i>0 && arr[i-1].win && !x.win){
      h += '<div class="sep">常青备用 · 任何时候都能拍</div>';
    }
    const s = stOf(x.id);
    const idTxt = x.id && x.id.charAt(0)==='N' ? '新' : x.id;
    h += '<div class="row" data-id="'+x.id+'"><div class="idx">'+esc(idTxt)+'</div><div class="body">'
      + '<div class="t">'+esc(x.title)+'</div>'
      + '<div class="m"><span class="chip">'+esc(x.form)+'</span>'
      + (x.win?'<span class="chip season">'+esc(x.win)+'</span>':(x.season?'<span class="chip season">'+esc(x.season)+'</span>':''))
      + (x.cost?'<span>'+esc(x.cost)+'</span>':'')
      + (s?'<span>'+statusDot(x.id)+esc(STAT[s])+'</span>':'')
      + '</div></div></div>';
  });
  h += '</div>';
  view.innerHTML = h;
  view.querySelectorAll('.row').forEach(el=> el.onclick = ()=> goItem(el.dataset.id, 'cat', arr.map(x=>x.id)));
}

function renderItem(){
  const x = findItem(state.id);
  if(!x){ goHome(); return; }
  ttl.textContent = x.id;
  const n = wc(x.copy);
  cnt.textContent = x.form;
  const s = stOf(x.id);
  let h = '<div class="detail">';
  h += '<h2>'+esc(x.title)+'</h2>';
  h += '<div class="meta"><span class="chip">'+esc(x.form)+'</span>'
     + (x.win?'<span class="chip season">'+esc(x.win)+'</span>':(x.season?'<span class="chip season">'+esc(x.season)+'</span>':''))
     + (x.cost?'<span>'+esc(x.cost)+'</span>':'')
     + '<span>'+n+' 字 · 约 '+mins(n)+' 分钟</span></div>';

  h += '<div class="stat" id="stat">';
  ['','done','pub'].forEach(k=>{
    h += '<span class="s'+(s===k?' on':'')+'" data-s="'+k+'">'+STAT[k]+'</span>';
  });
  h += '</div>';

  if(x.hook) h += '<div class="card"><h3>封面大字</h3><div class="hook">'+esc(x.hook)+'</div></div>';

  h += '<div class="card"><h3>正文（可直接复制 / 可编辑）</h3><div class="copy" id="copytext">'+esc(x.copy)+'</div>'
     + '<button class="btn ghost" id="copyall">复制标题 + 正文 + 标签</button></div>';

  if(x.shoot && x.shoot.length){
    h += '<div class="card"><h3>怎么拍</h3><ol class="steps">'
       + x.shoot.map(t=>'<li>'+esc(t)+'</li>').join('') + '</ol></div>';
  }
  if(x.tags) h += '<div class="card"><h3>标签</h3><div class="tags">'+esc(x.tags)+'</div></div>';

  h += '<div class="btnrow"><button class="btn" id="edit">编辑这条</button></div>';

  const ids = state.listIds || [];
  const idx = ids.indexOf(x.id);
  if(idx >= 0){
    h += '<div class="nav"><button id="prev" '+(idx<=0?'disabled':'')+'>‹ 上一条</button>'
       + '<button id="next" '+(idx>=ids.length-1?'disabled':'')+'>下一条 ›</button></div>';
  }
  h += '</div>';
  h += '<div class="actionbar"><button class="btn ghost" id="copybtn">复制正文</button>'
     + '<button class="btn" id="copypub">复制发布包 · 已发</button></div>';
  view.innerHTML = h;

  view.querySelectorAll('#stat .s').forEach(el=>{
    el.onclick = ()=>{
      const k = el.dataset.s;
      if(!store.status[x.id]) store.status[x.id] = {};
      if(store.status[x.id].s === k) delete store.status[x.id].s;
      else store.status[x.id].s = k;
      store.status[x.id].t = Date.now();
      persist(); renderItem();
    };
  });
  document.getElementById('edit').onclick = ()=> goEdit(x.id);

  const copy = async (text, btn, label)=>{
    try{ await navigator.clipboard.writeText(text); btn.textContent='已复制 ✓'; }
    catch(e){
      const ta=document.createElement('textarea'); ta.value=text;
      ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand('copy'); btn.textContent='已复制 ✓'; }
      catch(err){ btn.textContent='复制失败，请长按选择'; }
      ta.remove();
    }
    setTimeout(()=>{ btn.textContent=label; }, 1600);
  };
  const cb = document.getElementById('copybtn');
  cb.onclick = ()=> copy(document.getElementById('copytext').innerText, cb, '复制正文');
  const ca = document.getElementById('copyall');
  ca.onclick = ()=> copy(x.title+'\n\n'+x.copy+'\n\n'+(x.tags||''), ca, '复制标题 + 正文 + 标签');

  const cp = document.getElementById('copypub');
  cp.onclick = async ()=>{
    await copy(x.title+'\n\n'+x.copy+'\n\n'+(x.tags||''), cp, '复制发布包 · 已发');
    if(!store.status[x.id]) store.status[x.id] = {};
    store.status[x.id].s = 'pub';
    store.status[x.id].t = Date.now();
    persist();
    const ids2 = state.listIds || [];
    const i2 = ids2.indexOf(x.id);
    if(i2 >= 0 && i2 < ids2.length - 1) setTimeout(()=> goItem(ids2[i2+1], state.from, ids2), 600);
    else setTimeout(renderItem, 600);
  };

  const prev = document.getElementById('prev');
  const next = document.getElementById('next');
  if(prev) prev.onclick = ()=> goItem(ids[idx-1], state.from, ids);
  if(next) next.onclick = ()=> goItem(ids[idx+1], state.from, ids);
}

function renderEdit(){
  const editing = state.id ? findItem(state.id) : null;
  const x = editing || {id:'',cat:state.cat||'D',form:'视频',title:'',hook:'',win:'',cost:'',copy:'',shoot:[],tags:'#美术生 #央美附中 #画室 #校长'};
  ttl.textContent = editing ? '编辑选题' : '新建选题';
  cnt.textContent = editing ? x.id : '';
  let h = '<div class="form">';
  h += '<label>分类</label><select id="f_cat">';
  D.cats.forEach(c=>{ h += '<option value="'+c.k+'" '+(x.cat===c.k?'selected':'')+'>'+c.k+' · '+esc(c.n)+'</option>'; });
  h += '</select>';
  h += '<label>形式</label><select id="f_form">'
     + '<option '+(x.form==='视频'?'selected':'')+'>视频</option>'
     + '<option '+(x.form==='图文'?'selected':'')+'>图文</option></select>';
  h += '<label>标题</label><input id="f_title" value="'+esc(x.title)+'" placeholder="11–15 字，疑问或悬念">';
  h += '<label>封面大字</label><input id="f_hook" value="'+esc(x.hook)+'" placeholder="视频第一句 / 封面上的话">';
  h += '<label>档期（留空为常青题）</label><input id="f_win" value="'+esc(x.win||'')+'" placeholder="如 11/03–11/09">';
  h += '<label>拍摄成本</label><input id="f_cost" value="'+esc(x.cost||'')+'" placeholder="如 30 分钟">';
  h += '<label>正文</label><textarea id="f_copy" rows="18" placeholder="口播稿或图文正文">'+esc(x.copy)+'</textarea>';
  h += '<div class="hint" id="wc">'+wc(x.copy)+' 字 · 约 '+mins(wc(x.copy))+' 分钟</div>';
  h += '<label>怎么拍（一行一条）</label><textarea id="f_shoot" rows="4" placeholder="桌上摊开名单&#10;夜里台灯，只拍手">'+esc((x.shoot||[]).join('\n'))+'</textarea>';
  h += '<label>标签</label><input id="f_tags" value="'+esc(x.tags||'')+'">';
  h += '<div class="btnrow"><button class="btn" id="save">保存</button>'
     + (editing?'<button class="btn danger" id="del">删除</button>':'')
     + '</div>';
  h += '</div>';
  view.innerHTML = h;

  const tc = document.getElementById('f_copy');
  tc.oninput = ()=>{ document.getElementById('wc').textContent = wc(tc.value)+' 字 · 约 '+mins(wc(tc.value))+' 分钟'; };

  document.getElementById('save').onclick = ()=>{
    const title = document.getElementById('f_title').value.trim();
    const copyText = document.getElementById('f_copy').value.trim();
    if(!title){ alert('标题不能为空'); return; }
    if(!copyText){ alert('正文不能为空'); return; }
    const obj = {
      cat: document.getElementById('f_cat').value,
      form: document.getElementById('f_form').value,
      title: title,
      hook: document.getElementById('f_hook').value.trim(),
      win: document.getElementById('f_win').value.trim(),
      cost: document.getElementById('f_cost').value.trim(),
      copy: copyText,
      shoot: document.getElementById('f_shoot').value.split('\n').map(s=>s.trim()).filter(Boolean),
      tags: document.getElementById('f_tags').value.trim()
    };
    let id = state.id;
    if(id){
      const isCustom = store.custom.some(c=>c.id===id);
      if(isCustom){
        store.custom = store.custom.map(c=> c.id===id ? Object.assign({}, c, obj) : c);
      }else{
        store.overrides[id] = obj;
      }
    }else{
      id = 'N' + Date.now().toString(36).toUpperCase().slice(-5);
      obj.id = id;
      obj.season = '';
      store.custom.push(obj);
    }
    if(!persist()) return;
    goItem(id, state.retFrom || 'home', state.listIds);
  };

  const del = document.getElementById('del');
  if(del) del.onclick = ()=>{
    if(!confirm('删除这条？内置选题可以在「备份」里恢复。')) return;
    const id = state.id;
    const isCustom = store.custom.some(c=>c.id===id);
    if(isCustom) store.custom = store.custom.filter(c=>c.id!==id);
    else if(store.deleted.indexOf(id) < 0) store.deleted.push(id);
    delete store.status[id];
    persist();
    goHome();
  };
}

function renderMine(){
  ttl.textContent = '我的';
  const all = allItems();
  const custom = store.custom;
  const doneArr = all.filter(x=>stOf(x.id)==='done');
  const pubArr = all.filter(x=>stOf(x.id)==='pub');
  const todoArr = all.filter(x=>stOf(x.id)==='');
  const tab = state.mineTab || 'custom';
  const map = {custom:custom, done:doneArr, pub:pubArr, todo:todoArr};
  const list = map[tab] || custom;
  let h = '<div class="hero"><h1>我的选题</h1><p>自己加的、改过的，都存在这台手机里</p></div>';
  h += '<div class="card"><h3>进度</h3>'
     + '<div class="stat" id="tabs" style="margin:6px 0 10px">'
     + '<span class="s'+(tab==='custom'?' on':'')+'" data-t="custom">我加的 '+custom.length+'</span>'
     + '<span class="s'+(tab==='todo'?' on':'')+'" data-t="todo">未拍 '+todoArr.length+'</span>'
     + '<span class="s'+(tab==='done'?' on':'')+'" data-t="done">已拍 '+doneArr.length+'</span>'
     + '<span class="s'+(tab==='pub'?' on':'')+'" data-t="pub">已发 '+pubArr.length+'</span>'
     + '</div>'
     + '<div class="btnrow"><button class="btn ghost" id="bk2">备份 / 导入</button></div></div>';
  const titles = {custom:'我加的', todo:'还没拍', done:'已经拍完', pub:'已经发布'};
  h += '<div class="wk">'+titles[tab]+' · '+list.length+' 条</div>';
  h += list.length ? '<div class="list">'+rowsHtml(list,{custom:true})+'</div>'
       : '<div class="empty">'+(tab==='custom'?'还没有自己加的选题，点右下角 + 新建':'这个分类还是空的')+'</div>';
  view.innerHTML = h;
  document.getElementById('bk2').onclick = goBackup;
  view.querySelectorAll('#tabs .s').forEach(el=>{
    el.onclick = ()=>{ state.mineTab = el.dataset.t; renderMine(); };
  });
  bindRows(list);
}

function renderBackup(){
  ttl.textContent = '备份与恢复';
  cnt.textContent = '';
  const snapshot = JSON.stringify(store);
  let h = '<div class="hero"><h1>备份与恢复</h1><p>换手机、清理浏览器之前，先把这一串复制走</p></div>';
  h += '<div class="card"><h3>导出</h3>'
     + '<textarea class="backup" id="dump" readonly>'+esc(snapshot)+'</textarea>'
     + '<button class="btn" id="cd">复制备份</button>'
     + '<div class="hint">大小 '+Math.round(snapshot.length/1024)+' KB，包含你新增的选题、修改和拍摄状态。</div></div>';
  h += '<div class="card"><h3>导入</h3>'
     + '<textarea class="backup" id="imp" placeholder="把之前复制的备份粘贴到这里"></textarea>'
     + '<button class="btn ghost" id="ci">导入并覆盖</button>'
     + '<div class="hint">导入会覆盖当前手机上的修改，建议先导出一份。</div></div>';
  h += '<div class="card"><h3>恢复</h3>'
     + '<div class="mine"><div class="l">已删除的内置选题</div><div class="r">'+store.deleted.length+' 条</div></div>'
     + '<button class="btn ghost" id="restore" '+(store.deleted.length?'':'disabled')+'>全部恢复</button>'
     + '<button class="btn danger" id="reset">清空所有修改</button></div>';
  view.innerHTML = h;

  const dump = document.getElementById('dump');
  document.getElementById('cd').onclick = async ()=>{
    const btn = document.getElementById('cd');
    try{ await navigator.clipboard.writeText(snapshot); btn.textContent='已复制 ✓'; }
    catch(e){
      dump.focus(); dump.select();
      try{ document.execCommand('copy'); btn.textContent='已复制 ✓'; }catch(err){ btn.textContent='请长按全选复制'; }
    }
    setTimeout(()=> btn.textContent='复制备份', 1600);
  };
  document.getElementById('ci').onclick = ()=>{
    const txt = document.getElementById('imp').value.trim();
    if(!txt){ alert('先粘贴备份内容'); return; }
    try{
      const o = JSON.parse(txt);
      if(!o || typeof o!=='object') throw new Error('bad');
      if(!confirm('导入会覆盖当前修改，确定？')) return;
      store = {
        custom: Array.isArray(o.custom)?o.custom:[],
        overrides: o.overrides&&typeof o.overrides==='object'?o.overrides:{},
        deleted: Array.isArray(o.deleted)?o.deleted:[],
        status: o.status&&typeof o.status==='object'?o.status:{}
      };
      persist(); alert('导入成功'); goHome();
    }catch(e){ alert('备份格式不对，检查是不是复制完整了'); }
  };
  const restore = document.getElementById('restore');
  restore.onclick = ()=>{
    if(!confirm('恢复所有被删除的内置选题？')) return;
    store.deleted = [];
    persist(); renderBackup();
  };
  document.getElementById('reset').onclick = ()=>{
    if(!confirm('清空所有修改？新增的选题、编辑和状态都会没，内置内容恢复原样。')) return;
    store = emptyStore();
    persist(); goHome();
  };
}

function renderOpen(){
  ttl.textContent = '手机打开';
  cnt.textContent = '';
  const url = 'https://554824178-art.github.io/azhu-topics/';
  let h = '<div class="hero"><h1>手机打开</h1><p>扫码或点链接；进度存在这台手机里</p></div>';
  h += '<div class="card" style="text-align:center">';
  if(QR_URI) h += '<img class="qrimg" alt="选题库二维码" src="'+QR_URI+'">';
  h += '<div class="linkbox" id="urltxt">'+url+'</div>'
     + '<button class="btn" id="copyurl">复制链接</button></div>';
  h += '<div class="card"><h3>三步用起来</h3><ol class="steps">'
     + '<li>微信扫码，或把链接发到微信里点开。</li>'
     + '<li>浏览器右上角「…」→「添加到主屏幕」，以后像 App 一样点开。</li>'
     + '<li>换手机前，先在「备份与恢复」里复制备份，再在新手机导入。</li>'
     + '</ol></div>';
  h += '<div class="card"><h3>进度存在哪</h3><div class="copy">拍摄状态、你新增和改过的选题，只保存在当前手机的浏览器里，不会上传，也不依赖电脑。'
     + '清理浏览器数据或换手机时会丢，所以每月导出一次备份更稳妥。</div></div>';
  view.innerHTML = h;
  const btn = document.getElementById('copyurl');
  btn.onclick = async ()=>{
    try{ await navigator.clipboard.writeText(url); btn.textContent='已复制 ✓'; }
    catch(e){
      const t = document.getElementById('urltxt');
      const r = document.createRange(); r.selectNodeContents(t);
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
      btn.textContent='请长按复制';
    }
    setTimeout(()=>{ btn.textContent='复制链接'; }, 1600);
  };
}

render();
</script>
